<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Agent 整体架构</title>
  <desc id="desc">从 CLI 与消息平台进入 AIAgent，再经过上下文、模型、工具和执行后端，并由会话、记忆与技能组成学习层。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5245"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2b2620" flood-opacity=".10"/></filter>
    <style>
      .h{font:700 30px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#2b2620}.sub{font:16px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#6f6659}.t{font:700 19px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#2b2620}.b{font:15px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#554d42}.tiny{font:13px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#6f6659}.line{stroke:#5b5245;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" rx="28" fill="#fdfaf3"/>
  <text class="h" x="64" y="62">Hermes Agent：执行系统与学习系统共用一条运行链</text>
  <text class="sub" x="64" y="92">模型负责选择下一步；Harness 负责装配 Context、执行工具、保存状态和控制边界。</text>

  <rect x="64" y="140" width="220" height="206" rx="20" fill="#ebe4d4" stroke="#8a7f6d" filter="url(#shadow)"/>
  <text class="t" x="88" y="177">交互入口</text>
  <rect x="88" y="198" width="172" height="42" rx="10" fill="#fbf8f1"/><text class="b" x="174" y="225" text-anchor="middle">CLI / TUI</text>
  <rect x="88" y="250" width="172" height="42" rx="10" fill="#fbf8f1"/><text class="b" x="174" y="277" text-anchor="middle">Gateway / Chat</text>
  <rect x="88" y="302" width="172" height="24" rx="8" fill="#d8dee0"/><text class="tiny" x="174" y="319" text-anchor="middle">profile 决定身份与配置</text>

  <rect x="350" y="120" width="456" height="332" rx="24" fill="#f5f0e4" stroke="#8a7f6d" filter="url(#shadow)"/>
  <text class="t" x="378" y="158">AIAgent 与 Conversation Loop</text>
  <rect x="378" y="182" width="188" height="72" rx="14" fill="#d8dee0" stroke="#2f5d8a"/><text class="t" x="472" y="212" text-anchor="middle">Prompt Builder</text><text class="tiny" x="472" y="235" text-anchor="middle">身份 · 工具 · 记忆 · Skill</text>
  <rect x="590" y="182" width="188" height="72" rx="14" fill="#dee3d6" stroke="#4f7a52"/><text class="t" x="684" y="212" text-anchor="middle">Model Client</text><text class="tiny" x="684" y="235" text-anchor="middle">生成回答或工具调用</text>
  <rect x="378" y="280" width="188" height="72" rx="14" fill="#fbf8f1" stroke="#8a7f6d"/><text class="t" x="472" y="310" text-anchor="middle">Tool Executor</text><text class="tiny" x="472" y="333" text-anchor="middle">校验 · 调用 · 结果回传</text>
  <rect x="590" y="280" width="188" height="72" rx="14" fill="#fbf8f1" stroke="#8a7f6d"/><text class="t" x="684" y="310" text-anchor="middle">Context Engine</text><text class="tiny" x="684" y="333" text-anchor="middle">压缩 · 缓存 · session</text>
  <path class="line" d="M566 218H584"/><path class="line" d="M684 254V274"/><path class="line" d="M590 316H572"/><path class="line" d="M472 280V260"/>
  <rect x="378" y="380" width="400" height="44" rx="12" fill="#eed9d3"/><text class="b" x="578" y="407" text-anchor="middle">预算、审批、错误语义与停止条件包围整个循环</text>

  <rect x="874" y="140" width="502" height="206" rx="20" fill="#ebe4d4" stroke="#8a7f6d" filter="url(#shadow)"/>
  <text class="t" x="902" y="177">行动能力</text>
  <rect x="902" y="198" width="136" height="58" rx="12" fill="#fbf8f1"/><text class="b" x="970" y="225" text-anchor="middle">工具注册表</text><text class="tiny" x="970" y="245" text-anchor="middle">搜索 / 浏览器 / MCP</text>
  <rect x="1054" y="198" width="136" height="58" rx="12" fill="#d8dee0"/><text class="b" x="1122" y="225" text-anchor="middle">execute_code</text><text class="tiny" x="1122" y="245" text-anchor="middle">受控 Python + RPC</text>
  <rect x="1206" y="198" width="142" height="58" rx="12" fill="#dee3d6"/><text class="b" x="1277" y="225" text-anchor="middle">delegate_task</text><text class="tiny" x="1277" y="245" text-anchor="middle">隔离上下文</text>
  <rect x="902" y="276" width="446" height="46" rx="12" fill="#fbf8f1"/><text class="b" x="1125" y="305" text-anchor="middle">Local · Docker · SSH · Daytona · Singularity · Modal · Vercel</text>

  <path class="line" d="M284 242H342"/><path class="line" d="M806 242H866"/>

  <rect x="64" y="516" width="1312" height="232" rx="24" fill="#f5f0e4" stroke="#8a7f6d" filter="url(#shadow)"/>
  <text class="t" x="92" y="556">跨会话学习层</text>
  <rect x="92" y="582" width="276" height="120" rx="16" fill="#fbf8f1" stroke="#8a7f6d"/>
  <text class="t" x="230" y="616" text-anchor="middle">Session Store + FTS5</text><text class="b" x="230" y="646" text-anchor="middle">保存轨迹，按关键词召回旧证据</text><text class="tiny" x="230" y="675" text-anchor="middle">长尾细节，不自动等于当前事实</text>
  <rect x="438" y="582" width="276" height="120" rx="16" fill="#d8dee0" stroke="#2f5d8a"/>
  <text class="t" x="576" y="616" text-anchor="middle">MEMORY.md / USER.md</text><text class="b" x="576" y="646" text-anchor="middle">短小的事实、偏好和经验索引</text><text class="tiny" x="576" y="675" text-anchor="middle">新会话读取冻结快照</text>
  <rect x="784" y="582" width="276" height="120" rx="16" fill="#dee3d6" stroke="#4f7a52"/>
  <text class="t" x="922" y="616" text-anchor="middle">Agent Skills</text><text class="b" x="922" y="646" text-anchor="middle">按需加载的流程、脚本与参考</text><text class="tiny" x="922" y="675" text-anchor="middle">候选 → 审批 → 回放 → 发布</text>
  <rect x="1130" y="582" width="218" height="120" rx="16" fill="#eed9d3" stroke="#a8433f"/>
  <text class="t" x="1239" y="616" text-anchor="middle">安全门</text><text class="b" x="1239" y="646" text-anchor="middle">write approval</text><text class="tiny" x="1239" y="675" text-anchor="middle">环境过滤 · 资源上限</text>
  <path class="line" d="M368 642H430"/><path class="line" d="M714 642H776"/><path class="line" d="M1060 642H1122"/>
  <path class="line" d="M684 452V508"/>
</svg>
