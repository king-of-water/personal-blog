<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>库存预占的远程调用顺序</title><desc>订单服务发请求，库存服务在数据库事务内减少库存并写预占记录，提交后返回结果。响应丢失时按原订单号查询，确认已提交结果。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="45">一次库存预占：提交在前，成功响应在后</text><rect class="box" x="35" y="80" width="220" height="60" rx="8"/><text x="145" y="117">订单服务</text><rect class="box" x="370" y="80" width="220" height="60" rx="8"/><text x="480" y="117">库存服务</text><rect class="box" x="705" y="80" width="220" height="60" rx="8"/><text x="815" y="117">库存数据库</text><path d="M145 140 V650" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path d="M480 140 V650" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path d="M815 140 V650" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path class="line"  d="M145 205 H480"/><text class="small" x="310" y="187">① O100 预占 S42 一件</text><path class="line"  d="M480 275 H815"/><text class="small" x="650" y="252">② 开启事务：减库存</text><text class="small" x="650" y="273">并写 O100 预占记录</text><path class="line" stroke-dasharray="7 5" d="M815 345 H480"/><text class="small" x="648" y="329">③ 事务提交成功</text><rect class="ok" x="620" y="370" width="300" height="52" rx="6"/><text class="small" x="770" y="402">库存 9 件；O100 已预占</text><path class="line" stroke-dasharray="7 5" d="M480 460 H145"/><text class="small" x="310" y="444">④ 返回预占结果</text><rect class="box" x="40" y="490" width="880" height="145" rx="8"/><text class="small" x="470" y="522">如果第 ④ 步的响应丢了，下面按原订单号确认</text><path class="line"  d="M145 555 H480"/><text class="small" x="310" y="546">查询 O100</text><path class="line" stroke-dasharray="7 5" d="M480 610 H145"/><text class="small" x="310" y="597">返回已提交的预占记录</text></svg>
