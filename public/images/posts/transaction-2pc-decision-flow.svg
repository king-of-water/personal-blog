<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img"><title>两阶段提交的统一决议</title><desc>参与者先执行分支并可靠保存准备状态，全部准备成功才持久化提交决定，否则记录回滚决定。决定后的通知丢失只重试原决定。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="800" fill="#fdfaf3"/><text class="title" x="480" y="45">2PC：先准备，再记录统一决议</text><rect class="box" x="270" y="85" width="420" height="60" rx="8"/><text x="480" y="122">参与者执行各自事务分支</text><path class="line" d="M480 145 V185"/><rect class="box" x="270" y="185" width="420" height="60" rx="8"/><text x="480" y="222">Prepare：保存可恢复准备状态</text><path class="line" d="M480 245 V285"/><path class="box" d="M480 285 L660 335 L480 385 L300 335 Z"/><text class="small" x="480" y="342">全部准备成功？</text><path class="line" d="M300 335 H230 V430"/><text class="small" x="240" y="321">是</text><path class="line" d="M660 335 H730 V430"/><text class="small" x="720" y="321">否 / 准备超时</text><rect class="box" x="45" y="430" width="370" height="60" rx="8"/><text x="230" y="467">协调者持久化提交决定</text><rect class="box" x="545" y="430" width="370" height="60" rx="8"/><text x="730" y="467">协调者持久化回滚决定</text><path class="line" d="M230 490 V550"/><path class="line" d="M730 490 V550"/><rect class="ok" x="45" y="550" width="370" height="60" rx="8"/><text x="230" y="587">通知所有参与者提交</text><rect class="box" x="545" y="550" width="370" height="60" rx="8"/><text x="730" y="587">通知所有参与者回滚</text><path class="line" d="M230 610 V680"/><path class="line" d="M730 610 V680"/><rect class="box" x="45" y="680" width="370" height="60" rx="8"/><text x="230" y="717">未获确认：恢复并重发提交</text><rect class="box" x="545" y="680" width="370" height="60" rx="8"/><text x="730" y="717">未获确认：恢复并重发回滚</text><text class="small" x="480" y="782">已准备但不知道最终决议：不能凭超时自行回滚</text></svg>
