<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Learn Claude Code s03 权限管线</title>
  <desc id="desc">工具请求依次经过硬拒绝、规则匹配与用户审批，只有允许的请求才进入工具分发和外部环境，被拒绝的请求也会形成工具结果返回模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b5245"/></marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b2620}.sub{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#6f6659}.h{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b2620}.body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#554d42}.chip{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.line{stroke:#5b5245;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="720" fill="#fdfaf3"/>
  <text x="72" y="78" class="title">权限判断发生在工具请求与真实副作用之间</text>
  <text x="72" y="112" class="sub">Prompt 可以表达偏好，执行闸门才决定动作是否真的发生。</text>

  <rect x="70" y="214" width="190" height="130" rx="18" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
  <text x="98" y="260" class="h">tool_use</text>
  <text x="98" y="299" class="body">工具名、参数、ID</text>
  <path d="M260 279 H326" class="line"/>

  <rect x="326" y="194" width="226" height="170" rx="18" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
  <text x="356" y="240" class="h">1. 硬拒绝</text>
  <text x="356" y="279" class="body">任何时候都不允许</text>
  <text x="356" y="313" class="body">教学示例：危险字符串</text>
  <path d="M552 279 H618" class="line"/>

  <rect x="618" y="194" width="226" height="170" rx="18" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
  <text x="648" y="240" class="h">2. 规则匹配</text>
  <text x="648" y="279" class="body">资源、工具与风险</text>
  <text x="648" y="313" class="body">是否需要人工判断</text>
  <path d="M844 279 H910" class="line"/>

  <rect x="910" y="194" width="226" height="170" rx="18" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
  <text x="940" y="240" class="h">3. 用户审批</text>
  <text x="940" y="279" class="body">展示具体动作与范围</text>
  <text x="940" y="313" class="body">allow 或 deny</text>
  <path d="M1136 279 H1202" class="line"/>

  <rect x="1202" y="214" width="168" height="130" rx="18" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
  <text x="1231" y="260" class="h">执行工具</text>
  <text x="1231" y="299" class="body">产生外部结果</text>

  <path d="M439 364 V462 H710" class="line"/>
  <path d="M731 364 V462 H710" class="line"/>
  <path d="M1023 364 V462 H710" class="line"/>
  <rect x="544" y="462" width="332" height="124" rx="18" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
  <text x="574" y="510" class="h">拒绝也要返回 tool_result</text>
  <text x="574" y="548" class="body">模型据此改用安全路径或请求帮助</text>

  <rect x="70" y="625" width="1300" height="46" rx="12" fill="#ebe4d4" stroke="#8a7f6d"/>
  <text x="94" y="655" class="body">教学代码的字符串规则只说明闸门位置。生产边界还需要专用工具、规范化参数、最小权限、沙箱和审计。</text>
</svg>
