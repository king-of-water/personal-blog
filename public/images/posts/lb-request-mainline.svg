<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-labelledby="title desc"><title id="title">先走一遍：三次选择，各选一个目标</title><desc id="desc">DNS 返回区域入口地址，浏览器连接该入口；NLB 为连接选择 Nginx，Nginx 为商品请求选择应用实例。网页响应由应用返回，经代理交给顾客。DNS 不转发网页正文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="280" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先走一遍：三次选择，各选一个目标</text><rect x="40" y="80" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="145" y="116" font-size="19" text-anchor="middle" fill="#2b2620">① DNS 返回地址</text><text x="145" y="141" font-size="19" text-anchor="middle" fill="#2b2620">选择区域入口</text><path d="M250 122 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="285" y="80" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="116" font-size="19" text-anchor="middle" fill="#2b2620">② NLB 选择连接目标</text><text x="390" y="141" font-size="19" text-anchor="middle" fill="#2b2620">连接交给 Nginx G1</text><path d="M495 122 H530" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="530" y="80" width="210" height="85" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="635" y="116" font-size="19" text-anchor="middle" fill="#2b2620">③ Nginx 选择业务实例</text><text x="635" y="141" font-size="19" text-anchor="middle" fill="#2b2620">商品请求交给 A</text><text x="390" y="210" font-size="16" text-anchor="middle" fill="#2b2620">DNS 查询结束后，页面请求沿“区域入口 → Nginx → 应用”传输。</text><text x="390" y="246" font-size="18" text-anchor="middle" fill="#2b2620">A 返回结果，Nginx 接收并响应顾客。</text></svg>
