<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">动态代理在真实对象外包一层拦截</title>
  <desc id="desc">调用方拿到的是代理对象，长得和真实对象一样；方法调用先进入拦截器，拦截器可以记录日志、校验、开事务，再转发给真实对象。真实对象不知道自己被代理了。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b48"/></marker>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">动态代理：调用方、代理、真实对象各司其职</text>
  <text x="56" y="88" class="b">代理长得和真实对象一样，调用方无感知；拦截逻辑在转发前后各插一刀。</text>

  <g transform="translate(70 180)">
    <rect width="200" height="110" rx="16" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
    <text x="100" y="48" text-anchor="middle" class="t" fill="#5e5083">调用方 Caller</text>
    <text x="100" y="78" text-anchor="middle" class="s">拿到的是代理对象</text>
  </g>
  <line x1="270" y1="235" x2="360" y2="235" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="315" y="225" text-anchor="middle" class="m">调用</text>

  <g transform="translate(360 150)">
    <rect width="260" height="190" rx="16" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="130" y="42" text-anchor="middle" class="t" fill="#725923">代理对象 Proxy</text>
    <rect x="30" y="65" width="200" height="100" rx="12" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="130" y="92" text-anchor="middle" class="m">before：日志/校验/事务</text>
    <text x="130" y="122" text-anchor="middle" class="m">method.invoke(target)</text>
    <text x="130" y="152" text-anchor="middle" class="m">after：清理/提交</text>
  </g>
  <line x1="620" y1="245" x2="710" y2="245" stroke="#466b48" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="665" y="235" text-anchor="middle" class="m">转发</text>

  <g transform="translate(710 180)">
    <rect width="200" height="110" rx="16" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="100" y="48" text-anchor="middle" class="t" fill="#466b48">真实对象 Target</text>
    <text x="100" y="78" text-anchor="middle" class="s">不知道被代理了</text>
  </g>

  <g transform="translate(70 420)">
    <rect width="1060" height="190" rx="20" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="38" class="t">「不改原类」的关键</text>
    <text x="28" y="74" class="b">真实对象一行不改；拦截逻辑（日志、事务、权限）写在代理的拦截器里。</text>
    <text x="28" y="104" class="b">一个真实对象可以被多个代理包装，每层各管一件事（先记日志、再开事务）。</text>
    <text x="28" y="140" class="b">代理对象和真实对象「长得一样」，调用方拿到哪个都用同一套接口调用。</text>
  </g>
</svg>
