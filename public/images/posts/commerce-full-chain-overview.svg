<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
  <title id="title">内容电商全链路：兴趣怎样变成可交付、可结算的交易</title>
  <desc id="desc">实线从看到内容，经商品选择、报价、下单、支付确认到发货运输签收，再按规则确认收货和结算。虚线从支付和交付阶段进入售后，依据当前阶段停止交付或退货，再执行退款并调整结算。每个节点说明参与领域与产生的结果，用户身份、地址和进度反馈贯穿全程。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a7f6d"/></marker></defs>
  <rect width="900" height="1010" fill="#fdfaf3"/>
  <g fill="#2b2620">
    <text x="32" y="43" font-size="26" font-weight="600">先看一笔购买怎样走完，再看异常从哪里分出去</text>
    <text x="32" y="75" font-size="18">用户链路贯穿全程：身份与地址、购买动作、页面进度和异常入口</text>
  </g>
  <g fill="#f5f0e4" stroke="#8a7f6d" stroke-width="1.5">
    <rect x="208" y="110" width="620" height="80" rx="6"/>
    <rect x="208" y="220" width="620" height="80" rx="6"/>
    <rect x="208" y="330" width="620" height="80" rx="6"/>
    <rect x="208" y="440" width="620" height="80" rx="6"/>
    <rect x="208" y="550" width="620" height="80" rx="6"/>
    <rect x="208" y="660" width="620" height="80" rx="6"/>
    <rect x="456" y="814" width="400" height="118" rx="6"/>
  </g>
  <rect x="32" y="814" width="400" height="118" rx="6" fill="#dee3d6" stroke="#466b48" stroke-width="1.5"/>
  <g fill="#2b2620" font-size="22">
    <text x="232" y="143">01 看到笔记 / 视频，点击挂载商品</text>
    <text x="232" y="253">02 查看商品、商家、评价，选择规格与地址</text>
    <text x="232" y="363">03 选择优惠，核对费用，获得结算报价</text>
    <text x="232" y="473">04 提交订单，确认库存预占和优惠券锁定</text>
    <text x="232" y="583">05 用户付款，渠道结果确认，订单接受支付</text>
    <text x="232" y="693">06 商家接单 → 仓库发货 → 运输与签收</text>
    <text x="56" y="849">按规则确认收货、评价与结算</text>
    <text x="480" y="849">申请取消 / 退货等售后</text>
  </g>
  <g fill="#2b2620" font-size="18">
    <text x="232" y="174">内容提供入口与挂载关系 → 用户进入商品页</text>
    <text x="232" y="284">商品与商家提供销售条件 → 形成明确购买选择</text>
    <text x="232" y="394">商品、营销与配送规则 → 明细与预计应付金额</text>
    <text x="232" y="504">交易、库存与营销 → 可付款的订单与成交快照</text>
    <text x="232" y="614">支付确认资金，交易推进状态 → 可以安排交付</text>
    <text x="232" y="724">商家、履约、仓库与物流 → 交付任务与包裹进度</text>
    <text x="56" y="883">交易确认完成条件，结算计算应得款项</text>
    <text x="56" y="911">满足打款条件后支付，分别确认结果</text>
    <text x="480" y="883">按当前阶段停止交付或处理退件</text>
    <text x="480" y="911">批准退款 → 支付退款 → 结算调整</text>
  </g>
  <g fill="#6f6659" font-size="21">
    <text x="32" y="155">发现</text>
    <text x="32" y="265">决策</text>
    <text x="32" y="375">报价</text>
    <text x="32" y="485">成交：下单</text>
    <text x="32" y="595">成交：付款</text>
    <text x="32" y="705">等待交付</text>
  </g>
  <g fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M518 190 V220"/><path d="M518 300 V330"/><path d="M518 410 V440"/>
    <path d="M518 520 V550"/><path d="M518 630 V660"/>
    <path d="M518 740 V779 H232 V814"/>
    <path d="M828 590 H874 V782 H656 V814" stroke-dasharray="6 5"/>
    <path d="M828 700 H874" stroke-dasharray="6 5" marker-end="none"/>
  </g>
  <g fill="#2b2620" font-size="18">
    <text x="250" y="766">满足交易完成条件</text>
    <text x="564" y="767">付款后不同阶段均可出现售后</text>
    <text x="32" y="968">实线：正常购买主线。虚线：售后分支，不必等结算结束才开始。</text>
    <text x="32" y="994">未付款取消无需退款；结算周期、评价与售后条件遵循各自业务规则。</text>
  </g>
</svg>
