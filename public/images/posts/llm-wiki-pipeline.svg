<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LLM Wiki 从多种知识源到可追溯知识页的生成流程</title>
  <desc id="desc">PRD、接口、代码、数据结构和事故复盘先保留各自结构与权限，再统一为实体、关系、结论和证据，经过冲突确认后生成可阅读页面，并随来源变化增量更新。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5245"/></marker>
    <style>.t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620}.h{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#6f6659}.k{font-size:16px;font-weight:700;letter-spacing:.08em;fill:#7a5c33}.nh{font-size:21px;font-weight:700}.b{font-size:16px;fill:#554d42}.small{font-size:14px;fill:#6f6659}.box{fill:#f5f0e4;stroke:#b8aa94;stroke-width:2}.accent{fill:#e9dfca;stroke:#7a5c33;stroke-width:2}.green{fill:#e4eee8;stroke:#56705e;stroke-width:2}.line{stroke:#5b5245;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="820" fill="#fdfaf3"/>
  <text x="70" y="68" class="t h">LLM Wiki 是一条多源知识编译流水线</text>
  <text x="70" y="104" class="t sub">代码只是知识源之一，页面背后还要保留版本、证据、冲突与权限</text>
  <text x="70" y="160" class="t k">01 保留来源结构</text>
  <rect x="70" y="184" width="242" height="76" rx="8" class="box"/><text x="94" y="215" class="t nh">产品与设计文档</text><text x="94" y="242" class="t small">章节 · 状态 · 负责人</text>
  <rect x="70" y="276" width="242" height="76" rx="8" class="box"/><text x="94" y="307" class="t nh">接口与数据结构</text><text x="94" y="334" class="t small">协议 · 字段 · Schema</text>
  <rect x="70" y="368" width="242" height="76" rx="8" class="box"/><text x="94" y="399" class="t nh">代码与测试</text><text x="94" y="426" class="t small">符号 · 依赖 · Commit</text>
  <rect x="70" y="460" width="242" height="76" rx="8" class="box"/><text x="94" y="491" class="t nh">复盘与决策记录</text><text x="94" y="518" class="t small">失败路径 · 历史原因</text>
  <text x="382" y="160" class="t k">02 编译统一模型</text>
  <rect x="382" y="184" width="286" height="352" rx="10" class="accent"/>
  <text x="410" y="224" class="t nh">可查询的知识对象</text>
  <text x="410" y="272" class="t b">Entity　系统、接口、概念</text><text x="410" y="310" class="t b">Claim　可验证的结论</text><text x="410" y="348" class="t b">Relation　调用、依赖、影响</text><text x="410" y="386" class="t b">Evidence　章节、符号、字段</text><text x="410" y="424" class="t b">Version　生效、失效、变更</text><text x="410" y="462" class="t b">ACL　谁能读取与使用</text>
  <line x1="410" y1="486" x2="640" y2="486" stroke="#b8aa94"/><text x="410" y="516" class="t small">页面是视图，不是唯一事实源</text>
  <text x="738" y="160" class="t k">03 处理冲突并组证据</text>
  <rect x="738" y="184" width="286" height="160" rx="10" class="box"/><text x="766" y="224" class="t nh">证据包</text><text x="766" y="262" class="t b">围绕读者问题选择材料</text><text x="766" y="296" class="t small">每个关键结论都能回到来源</text>
  <rect x="738" y="376" width="286" height="160" rx="10" class="box"/><text x="766" y="416" class="t nh">冲突队列</text><text x="766" y="454" class="t b">PRD 与代码不一致</text><text x="766" y="488" class="t small">确认、保留差异或标记未知</text>
  <text x="1094" y="160" class="t k">04 交付可用知识</text>
  <rect x="1094" y="184" width="276" height="352" rx="10" class="green"/>
  <text x="1122" y="224" class="t nh">有证据的知识页面</text><text x="1122" y="272" class="t b">领域总览与阅读入口</text><text x="1122" y="310" class="t b">流程、规则与接口页面</text><text x="1122" y="348" class="t b">决策、排障与历史版本</text><text x="1122" y="386" class="t b">原始证据和交叉链接</text>
  <line x1="1122" y1="420" x2="1342" y2="420" stroke="#9ab0a0"/><text x="1122" y="454" class="t small">人：浏览、学习、核对</text><text x="1122" y="484" class="t small">Agent：检索、引用、规划</text>
  <path d="M312 360H356" class="line"/><path d="M668 360H712" class="line"/><path d="M1024 360H1068" class="line"/>
  <rect x="382" y="628" width="988" height="104" rx="10" fill="#f2eadb" stroke="#b8aa94" stroke-width="2"/>
  <text x="410" y="668" class="t nh">增量更新闭环</text><text x="410" y="704" class="t b">来源变化 → 找到受影响 Claim → 更新相关页面 → 校验引用与权限 → 发布新版本</text>
  <path d="M1232 536V602H526V560" class="line"/>
  <text x="70" y="782" class="t small">读图：只把代码转成自然语言，是文档生成；能处理多源证据、冲突和更新，才接近可维护的知识系统。</text>
</svg>
