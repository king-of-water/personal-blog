<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img"><title>滑动窗口：旧请求没过期，新请求就占不到额度</title><desc>1.010 秒时，0.990 秒的 100 条记录仍在最近一秒内。删除过期记录、判断数量和添加新记录在同一原子操作里执行。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#d8dee0;stroke:#295279;stroke-width:1.5}.no{fill:#eed9d3;stroke:#943b37;stroke-width:1.5}</style><rect width="960" height="750" fill="#fdfaf3"/><text x="480" y="46" class="title">滑动窗口：跟着现在，回头看最近一秒</text><rect x="90" y="85" width="780" height="115" class="box" rx="10"/><path d="M135 145 H825" class="line"/><path d="M720 120 V165" fill="none" stroke="#295279" stroke-width="4"/><text x="170" y="118" class="small">左边界 0.010</text><text x="720" y="112" class="small">0.990：100 条</text><text x="785" y="185" class="small">现在 1.010</text><text x="395" y="185" class="small">这 100 条仍在 (0.010, 1.010] 内</text><rect x="285" y="235" width="390" height="60" rx="10" class="box"/><text x="480" y="273" class="">新请求到达：计算 now − 1 秒</text><path class="line" d="M480 200 V235"/><path class="line" d="M480 295 V320"/><rect x="285" y="320" width="390" height="60" rx="10" class="box"/><text x="480" y="358" class="">删除不晚于左边界的记录</text><path class="line" d="M480 380 V405"/><rect x="285" y="405" width="390" height="60" rx="10" class="box"/><text x="480" y="443" class="">剩余记录数 + 1 ≤ 100？</text><path class="line" d="M285 435 H165 V505"/><text x="220" y="422" class="small">否</text><rect x="40" y="505" width="310" height="60" rx="10" class="no"/><text x="195" y="543" class="">拒绝：不新增本次记录</text><path class="line" d="M675 435 H795 V505"/><text x="740" y="422" class="small">是</text><rect x="615" y="505" width="310" height="60" rx="10" class="ok"/><text x="770" y="543" class="">记录唯一请求 ID 与时间</text><path class="line" d="M770 565 V595"/><rect x="615" y="595" width="310" height="60" rx="10" class="ok"/><text x="770" y="633" class="">放行，继续执行查询</text><text x="340" y="635" class="small">本例：已有 100 条 → 拒绝</text><text x="480" y="710" class="small">删除、计数、条件新增须原子执行；到 1.990 秒，第一批才移出</text></svg>
