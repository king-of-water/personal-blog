<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Fencing Token 在资源端拒绝旧持有者</title>
  <desc id="desc">锁服务依次发出 Token 41 和 42，新持有者先写入数据库并把最大 Token 更新为 42，旧持有者随后携带 41 写入时被数据库拒绝。</desc>
  <style>.bg{fill:#f7f7f3}.p{fill:#fff;stroke:#d5ddd6;stroke-width:2}.soft{fill:#e7f1eb;stroke:#a9c7b5;stroke-width:2}.warm{fill:#f4eee1;stroke:#dfcfae;stroke-width:2}.g{fill:#17684f}.h{font:700 28px Arial,'PingFang SC',sans-serif;fill:#1d2823}.t{font:700 20px Arial,'PingFang SC',sans-serif;fill:#233129}.b{font:500 16px Arial,'PingFang SC',sans-serif;fill:#46534c}.s{font:500 14px Arial,'PingFang SC',sans-serif;fill:#617067}.l{stroke:#53635a;stroke-width:3;fill:none}.d{stroke:#8b9990;stroke-width:3;stroke-dasharray:9 8;fill:none}.bad{fill:#9f5d4a}.ok{fill:#17684f}</style>
  <rect class="bg" width="1440" height="620"/><text x="70" y="62" class="h">锁服务给出顺序，业务资源执行最后一次校验</text><text x="70" y="96" class="s">随机 owner 用于安全解锁；单调 Token 用于判断哪一个持有者更新。</text>
  <rect x="70" y="155" width="270" height="118" rx="14" class="warm"/><text x="100" y="197" class="t">旧 Worker A</text><text x="100" y="231" class="b">获得 Token 41 后暂停</text>
  <rect x="70" y="365" width="270" height="118" rx="14" class="soft"/><text x="100" y="407" class="t">新 Worker B</text><text x="100" y="441" class="b">租约到期后获得 Token 42</text>
  <rect x="545" y="235" width="310" height="160" rx="16" class="p"/><text x="585" y="282" class="t">锁与 Token 服务</text><text x="585" y="320" class="b">每次成功获取时递增</text><text x="585" y="354" class="b">41 → 42 → 43 ...</text>
  <path d="M340 214 H545" class="d"/><path d="M533 204 l18 10 -18 10" fill="#8b9990"/><path d="M340 424 H545" class="l"/><path d="M533 414 l18 10 -18 10" fill="#53635a"/>
  <rect x="1060" y="235" width="310" height="160" rx="16" class="p"/><text x="1100" y="282" class="t">订单数据库</text><text x="1100" y="320" class="b">保存 last_fence = 42</text><text x="1100" y="354" class="b">只接受 token ≥ last_fence</text>
  <path d="M855 315 H1060" class="l"/><path d="M1048 305 l18 10 -18 10" fill="#53635a"/>
  <path d="M340 424 C700 530 920 480 1120 395" class="l"/><text x="650" y="508" class="b">B 先写入：token=42</text><circle cx="1092" cy="407" r="18" class="ok"/><text x="1086" y="414" style="font:700 20px Arial,sans-serif;fill:#fff">✓</text>
  <path d="M340 214 C720 105 1010 145 1180 235" class="d"/><text x="670" y="149" class="b">A 恢复后写入：token=41</text><circle cx="1127" cy="207" r="18" class="bad"/><text x="1121" y="214" style="font:700 20px Arial,sans-serif;fill:#fff">×</text>
  <rect x="405" y="550" width="630" height="45" rx="10" class="g"/><text x="455" y="579" style="font:700 17px Arial,'PingFang SC',sans-serif;fill:#fff">数据库拒绝 41，不需要相信旧 Worker 是否已经察觉租约失效</text>
</svg>
