<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">一个大 Key 顺着请求路径放大成本</title>
  <desc id="desc">一个大 Key 在读取时产生大回复占用 CPU 序列化与网络带宽，删除时同步释放阻塞主线程，复制时拖慢全量同步，迁移时逐 Key 传输卡顿，频繁增删还造成内存碎片。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">一个大 Key 顺着请求路径放大成本</text>
  <text x="56" y="88" class="b">成本不只在「内存多占一块」，它顺着读、删、复制、迁移一路放大。</text>

  <g transform="translate(480 150)">
    <rect width="240" height="90" rx="16" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="120" y="42" text-anchor="middle" class="t" fill="#725923">大 Key</text>
    <text x="120" y="70" text-anchor="middle" class="s">百万字段的 Hash / 大 String</text>
  </g>

  <line x1="600" y1="240" x2="600" y2="290" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="195" x2="270" y2="195" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="195" x2="930" y2="195" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70 310)">
    <rect width="320" height="150" rx="18" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#295279">读取</text>
    <text x="160" y="74" text-anchor="middle" class="m">HGETALL / LRANGE 0 -1</text>
    <text x="160" y="102" text-anchor="middle" class="b">大回复：CPU 序列化 + 网络</text>
    <text x="160" y="130" text-anchor="middle" class="s">改 HSCAN 或分页</text>
  </g>
  <g transform="translate(440 310)">
    <rect width="320" height="150" rx="18" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#943b37">删除</text>
    <text x="160" y="74" text-anchor="middle" class="m">DEL 同步释放</text>
    <text x="160" y="102" text-anchor="middle" class="b">主线程阻塞几十上百毫秒</text>
    <text x="160" y="130" text-anchor="middle" class="s">改 UNLINK + lazyfree</text>
  </g>
  <g transform="translate(810 310)">
    <rect width="320" height="150" rx="18" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#466b48">复制 / 迁移</text>
    <text x="160" y="74" text-anchor="middle" class="m">全量同步 / MIGRATE</text>
    <text x="160" y="102" text-anchor="middle" class="b">整 Key 传输，卡住源和目标</text>
    <text x="160" y="130" text-anchor="middle" class="s">拆小后再搬</text>
  </g>

  <g transform="translate(70 500)">
    <rect width="1060" height="130" rx="20" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="40" class="t">还有两类更隐蔽的成本</text>
    <text x="28" y="74" class="b">内存碎片：反复 APPEND / 增删大 Key，`mem_fragmentation_ratio` 偏离 1。</text>
    <text x="28" y="102" class="b">过期：大 Key 到期时惰性或主动过期都要 O(N) 删除，集中到期会叠成一次停顿。</text>
  </g>
</svg>
