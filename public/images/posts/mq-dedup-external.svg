<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc"><title id="title">退款超时后，先查询同一业务动作</title><desc id="desc">持久记录退款动作，按稳定 refundId 调用渠道，响应未知时查询渠道，得到确定结果后保存终态；无幂等查询能力的渠道进入对账。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="440" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">退款超时后，先查询同一业务动作</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">保存退款动作</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">参数与 refundId 不变</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">请求渠道</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">相同动作复用同一键</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">响应超时</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">结果 UNKNOWN</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="250" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">按 refundId 查询</text><text x="650" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">不改键再次退款</text><rect x="284" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">得到确定事实</text><text x="389" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">保存成功或拒绝终态</text><rect x="24" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">无法确认</text><text x="129" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">持久对账与人工恢复</text><path d="M650,155 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,290 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,330 V360 H129 V330" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="380" font-size="17" text-anchor="middle" fill="#2b2620">仍然未知</text><text x="24" y="418" font-size="18" text-anchor="start" fill="#2b2620">MQ 确认可以转移责任，但接管记录必须有恢复执行者与告警。</text></svg>
