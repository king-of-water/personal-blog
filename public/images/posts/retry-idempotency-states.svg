<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc"><title id="title">一次写请求从超时到确认的状态</title><desc id="desc">客户端超时后进入结果未知，使用同一幂等键查询；服务端根据持久化记录返回成功、最终失败、处理中或进入对账。</desc><style>.b{fill:#f7f7f3}.p{fill:#fff;stroke:#d6ded7;stroke-width:2}.g{fill:#17684f}.s{fill:#e7f1eb}.w{fill:#f4eee1}.t{font:700 22px Arial,'PingFang SC',sans-serif;fill:#1d2823}.x{font:500 17px Arial,'PingFang SC',sans-serif;fill:#3d4b43}.l{stroke:#526158;stroke-width:3;fill:none}</style><rect class="b" width="1440" height="420"/><text x="70" y="58" class="t">写请求超时后，正确动作是用同一业务键确认，而不是换键重放</text><rect x="70" y="130" width="210" height="90" rx="14" class="p"/><text x="108" y="183" class="t">客户端超时</text><path d="M280 175 H385" class="l"/><path d="M373 165 l18 10 -18 10" fill="#526158"/><rect x="390" y="130" width="230" height="90" rx="14" class="w"/><text x="430" y="183" class="t">UNKNOWN</text><path d="M620 175 H725" class="l"/><path d="M713 165 l18 10 -18 10" fill="#526158"/><rect x="730" y="130" width="250" height="90" rx="14" class="s"/><text x="765" y="170" class="t">按幂等键查询</text><text x="765" y="198" class="x">不换键、不盲目重放</text><path d="M855 220 V290 H385" class="l"/><path d="M855 220 V290 H1190" class="l"/><rect x="170" y="300" width="260" height="70" rx="12" class="p"/><text x="205" y="344" class="t">SUCCEEDED</text><rect x="520" y="300" width="260" height="70" rx="12" class="p"/><text x="555" y="344" class="t">PROCESSING</text><rect x="890" y="300" width="330" height="70" rx="12" class="p"/><text x="925" y="344" class="t">FAILED / 对账恢复</text></svg>
