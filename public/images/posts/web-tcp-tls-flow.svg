<svg xmlns="http://www.w3.org/2000/svg" width="780" height="650" viewBox="0 0 780 650" role="img" aria-labelledby="title desc"><title id="title">建立通道：连接状态与身份验证分开完成</title><desc id="desc">浏览器所在主机与服务端进行 TCP 三次握手同步连接状态，随后通过 TLS 交换握手材料并验证站点身份；验证失败结束访问，成功后发送加密的 HTTP 请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="650" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">建立通道：连接状态与身份验证分开完成</text><rect x="65" y="75" width="230" height="60" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="180" y="111" font-size="19" text-anchor="middle" fill="#2b2620">浏览器所在主机</text><rect x="485" y="75" width="230" height="60" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="600" y="111" font-size="19" text-anchor="middle" fill="#2b2620">站点入口</text><path d="M180 135 V555 M600 135 V555" fill="none" stroke="#8a7f6d" stroke-dasharray="5 5"/><path d="M180 190 H600" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="178" font-size="18" text-anchor="middle" fill="#2b2620">TCP：SYN，提出初始序号</text><path d="M600 250 H180" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="238" font-size="17" text-anchor="middle" fill="#2b2620">TCP：SYN + ACK，回应并提出自己的序号</text><path d="M180 310 H600" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="298" font-size="18" text-anchor="middle" fill="#2b2620">TCP：ACK，确认对端序号</text><path d="M180 385 H600" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="373" font-size="17" text-anchor="middle" fill="#2b2620">TLS：发送支持的参数与密钥交换材料</text><path d="M600 445 H180" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="433" font-size="17" text-anchor="middle" fill="#2b2620">TLS：回应，提供证书与身份验证材料</text><rect x="45" y="485" width="270" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="180" y="513.5" font-size="19" text-anchor="middle" fill="#2b2620">校验信任链、名称和握手</text><text x="180" y="538.5" font-size="19" text-anchor="middle" fill="#2b2620">失败则终止正常页面访问</text><path d="M315 520 H485" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="400" y="503" font-size="17" text-anchor="middle" fill="#2b2620">验证通过</text><rect x="485" y="485" width="270" height="70" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="620" y="513.5" font-size="19" text-anchor="middle" fill="#2b2620">完成握手</text><text x="620" y="538.5" font-size="19" text-anchor="middle" fill="#2b2620">开始交换受保护的 HTTP 消息</text><text x="390" y="610" font-size="17" text-anchor="middle" fill="#2b2620">简化的首次握手主线；TLS 恢复与 HTTP/3 的流程另有区别。</text></svg>
