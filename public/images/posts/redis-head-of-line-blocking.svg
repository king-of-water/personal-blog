<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
  <title id="title">Redis 串行命令执行中的队头阻塞</title>
  <desc id="desc">一条耗时 120 毫秒的大型集合运算挡在两个快速命令之前，导致后续命令的等待时间远大于自身执行时间。</desc>
  <rect width="1100" height="590" rx="28" fill="#fdfaf3"/>
  <g font-family="sans-serif">
    <text x="54" y="62" font-size="30" font-weight="700" fill="#2b2620">一条慢命令，让后续快命令一起变慢</text>
    <text x="54" y="98" font-size="18" fill="#6f6659">应用看到的是多条命令 P99 上涨，队首可能只有一个根因</text>

    <text x="54" y="157" font-size="19" font-weight="700" fill="#295279">到达队列</text>
    <g transform="translate(54 180)" text-anchor="middle">
      <rect x="0" y="0" width="190" height="76" rx="16" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
      <text x="95" y="31" font-size="19" font-weight="700" fill="#295279">GET A</text><text x="95" y="57" font-size="16" fill="#554d42">执行 0.05 ms</text>
      <rect x="210" y="0" width="248" height="76" rx="16" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
      <text x="334" y="31" font-size="19" font-weight="700" fill="#943b37">SINTER big:set…</text><text x="334" y="57" font-size="16" fill="#554d42">执行 120 ms</text>
      <rect x="478" y="0" width="190" height="76" rx="16" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
      <text x="573" y="31" font-size="19" font-weight="700" fill="#295279">GET B</text><text x="573" y="57" font-size="16" fill="#554d42">执行 0.05 ms</text>
      <rect x="688" y="0" width="190" height="76" rx="16" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
      <text x="783" y="31" font-size="19" font-weight="700" fill="#295279">INCR C</text><text x="783" y="57" font-size="16" fill="#554d42">执行 0.04 ms</text>
      <path d="M886 38H976" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="930" y="27" font-size="15" fill="#6f6659">执行方向</text>
    </g>

    <text x="54" y="322" font-size="19" font-weight="700" fill="#466b48">主执行路径时间线</text>
    <line x1="54" y1="402" x2="1046" y2="402" stroke="#8a7f6d" stroke-width="3"/>
    <rect x="54" y="354" width="92" height="96" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="100" y="389" text-anchor="middle" font-size="17" font-weight="700" fill="#466b48">GET A</text><text x="100" y="422" text-anchor="middle" font-size="15" fill="#554d42">0.05 ms</text>
    <rect x="146" y="337" width="566" height="130" rx="14" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
    <text x="429" y="386" text-anchor="middle" font-size="23" font-weight="700" fill="#943b37">SINTER 持有执行权</text>
    <text x="429" y="421" text-anchor="middle" font-size="18" fill="#554d42">120 ms 内没有处理后续普通命令</text>
    <rect x="712" y="354" width="160" height="96" rx="12" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="792" y="388" text-anchor="middle" font-size="17" font-weight="700" fill="#725923">GET B</text><text x="792" y="421" text-anchor="middle" font-size="15" fill="#554d42">先等约 120 ms</text>
    <rect x="872" y="354" width="174" height="96" rx="12" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="959" y="388" text-anchor="middle" font-size="17" font-weight="700" fill="#725923">INCR C</text><text x="959" y="421" text-anchor="middle" font-size="15" fill="#554d42">继续排队</text>

    <rect x="54" y="500" width="992" height="52" rx="14" fill="#f5f0e4"/>
    <text x="550" y="533" text-anchor="middle" font-size="18" fill="#554d42">端到端耗时 = 自身执行时间 + 前面所有等待；Slow Log 只会突出真正执行慢的命令。</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker></defs>
</svg>
