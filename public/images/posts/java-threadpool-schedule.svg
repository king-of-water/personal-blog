<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="title desc"><title id="title">定时任务：到期取出，周期成功后重新排队</title><desc id="desc">任务包装后进入延迟队列，到期且有工作线程才能执行；成功的周期任务计算下一次时间并重新入队，单次完成或异常则结束 Future。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="450" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">定时任务：到期取出，周期成功后重新排队</text><rect x="25" y="80" width="195" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="122.5" y="106.5" text-anchor="middle" font-size="20" fill="#2b2620">包装任务</text><text x="122.5" y="131.5" text-anchor="middle" font-size="20" fill="#2b2620">记录触发时间</text><rect x="285" y="80" width="195" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="382.5" y="119" text-anchor="middle" font-size="20" fill="#2b2620">进入延迟队列</text><rect x="545" y="80" width="195" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="642.5" y="106.5" text-anchor="middle" font-size="20" fill="#2b2620">到期且有线程</text><text x="642.5" y="131.5" text-anchor="middle" font-size="20" fill="#2b2620">取出任务</text><path d="M220,112 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M480,112 H545" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="25" y="228" width="195" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="122.5" y="267" text-anchor="middle" font-size="20" fill="#2b2620">执行任务</text><path d="M642,144 V183 H122 V228" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M383,210 L505.5,260 L383,310 L260.5,260 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="383" y="267" text-anchor="middle" font-size="20" fill="#2b2620">周期且成功？</text><path d="M220,260 H260" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="545" y="228" width="195" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="642.5" y="254.5" text-anchor="middle" font-size="20" fill="#2b2620">计算下一次时间</text><text x="642.5" y="279.5" text-anchor="middle" font-size="20" fill="#2b2620">重新入队</text><path d="M505,260 H545" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="525" y="244" text-anchor="middle" font-size="18" fill="#2b2620">是</text><path d="M740,260 H760 V58 H382 V80" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258" y="365" width="250" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="383" y="391.5" text-anchor="middle" font-size="20" fill="#2b2620">单次结束或异常</text><text x="383" y="416.5" text-anchor="middle" font-size="20" fill="#2b2620">记录 Future 状态</text><path d="M383,310 V365" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="408" y="345" text-anchor="middle" font-size="18" fill="#2b2620">否</text></svg>
