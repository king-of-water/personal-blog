<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">一次 Coding Agent 调用如何穿过 Harness</title>
  <desc id="desc">用户输入经过上下文装配进入模型，工具调用通过校验、审批和沙箱后执行，结果回写会话并继续循环。</desc>
  <rect width="1440" height="760" fill="#fdfaf3"/>
  <style>
    .title{font:700 36px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#2b2620}
    .sub{font:400 18px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#6f6659}
    .label{font:700 19px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#2b2620}
    .body{font:400 15px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#6f6659}
    .step{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#4f7a52}
    .box{stroke:#8a7f6d;stroke-width:1.2;rx:16}
    .arrow{stroke:#5b5245;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .loop{stroke:#4f7a52;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#greenArrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b5245"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f7a52"/></marker>
  </defs>
  <text x="80" y="72" class="title">一轮任务，不止一次模型调用</text>
  <text x="80" y="106" class="sub">工具结果不断改变环境，Harness 把新的事实送回下一次模型请求</text>

  <rect class="box" x="80" y="170" width="230" height="112" fill="#d8dee0"/>
  <text x="104" y="198" class="step">01</text><text x="104" y="231" class="label">接收输入</text><text x="104" y="258" class="body">任务 · steer · interrupt</text>
  <path class="arrow" d="M310 226 L365 226"/>
  <rect class="box" x="365" y="170" width="260" height="112" fill="#dee3d6"/>
  <text x="389" y="198" class="step">02</text><text x="389" y="231" class="label">装配上下文</text><text x="389" y="258" class="body">规则 · 历史 · 环境 · 工具</text>
  <path class="arrow" d="M625 226 L680 226"/>
  <rect class="box" x="680" y="170" width="230" height="112" fill="#ebe4d4"/>
  <text x="704" y="198" class="step">03</text><text x="704" y="231" class="label">调用模型</text><text x="704" y="258" class="body">流式文本与 tool call</text>
  <path class="arrow" d="M910 226 L965 226"/>
  <rect class="box" x="965" y="170" width="390" height="112" fill="#e3dde2"/>
  <text x="989" y="198" class="step">04</text><text x="989" y="231" class="label">解析事件</text><text x="989" y="258" class="body">展示文本 · 更新计划 · 分派工具</text>

  <path class="arrow" d="M1160 282 L1160 348"/>
  <rect class="box" x="965" y="350" width="390" height="126" fill="#f5f0e4"/>
  <text x="989" y="380" class="step">05</text><text x="989" y="413" class="label">策略与执行</text>
  <text x="989" y="440" class="body">schema 校验 · 审批 · 沙箱 · 超时</text><text x="989" y="462" class="body">命令 / 补丁 / MCP / 浏览器 / 外部函数</text>
  <path class="arrow" d="M965 413 L910 413"/>
  <rect class="box" x="680" y="350" width="230" height="126" fill="#d8dee0"/>
  <text x="704" y="380" class="step">06</text><text x="704" y="413" class="label">规范化结果</text>
  <text x="704" y="440" class="body">状态 · 输出 · 错误</text><text x="704" y="462" class="body">截断 · 后续读取入口</text>
  <path class="arrow" d="M680 413 L625 413"/>
  <rect class="box" x="365" y="350" width="260" height="126" fill="#dee3d6"/>
  <text x="389" y="380" class="step">07</text><text x="389" y="413" class="label">写回会话</text>
  <text x="389" y="440" class="body">消息历史 · 事件日志</text><text x="389" y="462" class="body">文件状态 · 进程句柄</text>

  <path class="loop" d="M495 350 C495 310,795 330,795 284"/>
  <text x="638" y="323" text-anchor="middle" class="step">仍有工具调用：继续循环</text>

  <path class="arrow" d="M495 476 L495 545"/>
  <rect class="box" x="365" y="548" width="260" height="108" fill="#fbf8f1"/>
  <text x="389" y="578" class="step">08A</text><text x="389" y="611" class="label">压缩或恢复</text><text x="389" y="638" class="body">预算不足 · 中断 · 重试</text>
  <path class="arrow" d="M625 602 L680 602"/>
  <rect class="box" x="680" y="548" width="230" height="108" fill="#fbf8f1"/>
  <text x="704" y="578" class="step">08B</text><text x="704" y="611" class="label">完成验收</text><text x="704" y="638" class="body">测试 · diff · 最终消息</text>

  <text x="1160" y="530" text-anchor="middle" class="sub">审批回答“谁同意”</text>
  <text x="1160" y="558" text-anchor="middle" class="sub">沙箱回答“最多能做什么”</text>
  <line x1="1010" y1="585" x2="1310" y2="585" stroke="#8a7f6d"/>
  <text x="1160" y="620" text-anchor="middle" class="body">每一步都产生可观察事件</text>
  <text x="1160" y="646" text-anchor="middle" class="body">每个副作用都留下可恢复状态</text>
</svg>
