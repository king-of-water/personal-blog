<svg xmlns="http://www.w3.org/2000/svg" width="780" height="425" viewBox="0 0 780 425" role="img" aria-labelledby="title desc"><title id="title">主缓存：命中晋升，超预算降级</title><desc id="desc">X 留在主缓存试用区，再次命中后进入保护区最近端；保护区超预算时，最旧的 B 降回试用区最近端。试用区最旧者优先作为淘汰比较对象。保护区不是永久保留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="425" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">主缓存：命中晋升，超预算降级</text><rect x="35" y="90" width="300" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="185" y="126" font-size="19" text-anchor="middle" fill="#2b2620">试用区 Probation</text><text x="185" y="151" font-size="19" text-anchor="middle" fill="#2b2620">新候选与降级条目</text><rect x="445" y="90" width="300" height="85" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="595" y="126" font-size="19" text-anchor="middle" fill="#2b2620">保护区 Protected</text><text x="595" y="151" font-size="19" text-anchor="middle" fill="#2b2620">主缓存中再次命中的条目</text><path d="M335 122 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="93" font-size="17" text-anchor="middle" fill="#2b2620">X 命中</text><text x="390" y="150" font-size="17" text-anchor="middle" fill="#2b2620">晋升</text><path d="M595 175 V235 H185 V175" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="220" font-size="17" text-anchor="middle" fill="#2b2620">保护区超预算：最旧的 B 降回试用区最近端</text><path d="M185 235 V305" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="305" width="300" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="185" y="331" font-size="19" text-anchor="middle" fill="#2b2620">试用区最旧者</text><text x="185" y="356" font-size="19" text-anchor="middle" fill="#2b2620">优先参与后续淘汰比较</text><rect x="445" y="305" width="300" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="331" font-size="19" text-anchor="middle" fill="#2b2620">B 再次命中可重新晋升</text><text x="595" y="356" font-size="19" text-anchor="middle" fill="#2b2620">一直不访问则逐渐变旧</text><text x="390" y="408" font-size="17" text-anchor="middle" fill="#2b2620">降级没有删除数据；各区域内部仍按最近访问顺序管理。</text></svg>
