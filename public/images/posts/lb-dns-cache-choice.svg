<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" role="img" aria-labelledby="title desc"><title id="title">第一处选择：DNS 回答连接去哪里</title><desc id="desc">浏览器或递归解析器优先复用有效的名称记录，未命中时查询权威服务。权威服务按调度策略回答区域入口地址，浏览器向该地址连接；缓存尚有效或连接仍在复用时，不保证立刻看到新调度结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="590" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">第一处选择：DNS 回答连接去哪里</text><rect x="225" y="75" width="330" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">查询 shop.example.com 的地址</text><path d="M390 140 V185" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="225" y="185" width="330" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="213.5" font-size="19" text-anchor="middle" fill="#2b2620">本地或递归解析器</text><text x="390" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">已有可复用的有效记录？</text><path d="M225 220 H180" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="200" y="205" font-size="17" text-anchor="middle" fill="#2b2620">是</text><rect x="25" y="185" width="155" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="102.5" y="213.5" font-size="19" text-anchor="middle" fill="#2b2620">使用缓存地址</text><text x="102.5" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">无需查询权威端</text><path d="M390 255 V315" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="290" font-size="17" text-anchor="middle" fill="#2b2620">否</text><rect x="225" y="315" width="330" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="346" font-size="19" text-anchor="middle" fill="#2b2620">查询权威名称服务</text><text x="390" y="371" font-size="19" text-anchor="middle" fill="#2b2620">按地域、权重等策略回答入口</text><path d="M390 390 V460" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M100 255 V495 H225" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="225" y="460" width="330" height="70" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="488.5" font-size="19" text-anchor="middle" fill="#2b2620">浏览器连接得到的入口地址</text><text x="390" y="513.5" font-size="19" text-anchor="middle" fill="#2b2620">页面正文不由 DNS 转发</text><text x="390" y="570" font-size="17" text-anchor="middle" fill="#2b2620">改变名称记录，不会主动迁移已经建立的连接。</text></svg>
