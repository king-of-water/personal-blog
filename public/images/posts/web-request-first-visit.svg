<svg xmlns="http://www.w3.org/2000/svg" width="780" height="780" viewBox="0 0 780 780" role="img" aria-labelledby="title desc"><title id="title">打开商品 42：逐步建立访问条件</title><desc id="desc">浏览器先检查缓存，必要时查询 DNS 获得入口地址，再建立或复用连接，完成 TLS 验证，发送 HTTP 请求。收到页面后还要请求资源和数据并渲染。失败停在对应阶段，不能当成业务完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="780" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">打开商品 42：逐步建立访问条件</text><rect x="35" y="75" width="330" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="103.5" font-size="19" text-anchor="middle" fill="#2b2620">点击商品网址</text><text x="200" y="128.5" font-size="19" text-anchor="middle" fill="#2b2620">解析主机名、路径与访问方式</text><path d="M200 145 V205" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="205" width="330" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="236" font-size="19" text-anchor="middle" fill="#2b2620">资源缓存可直接使用？</text><text x="200" y="261" font-size="19" text-anchor="middle" fill="#2b2620">否则继续准备网络访问</text><path d="M365 240 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="405" y="224" font-size="16" text-anchor="middle" fill="#2b2620">可用</text><rect x="445" y="205" width="300" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="595" y="236" font-size="19" text-anchor="middle" fill="#2b2620">使用缓存正文</text><text x="595" y="261" font-size="19" text-anchor="middle" fill="#2b2620">直接进入解析与渲染</text><path d="M200 280 V345" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="200" y="316" font-size="17" text-anchor="middle" fill="#2b2620">需要网络</text><rect x="35" y="345" width="330" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="376" font-size="19" text-anchor="middle" fill="#2b2620">取得目标地址</text><text x="200" y="401" font-size="19" text-anchor="middle" fill="#2b2620">优先使用有效的地址缓存</text><path d="M365 370 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="405" y="354" font-size="16" text-anchor="middle" fill="#2b2620">未命中</text><rect x="445" y="345" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="376" font-size="19" text-anchor="middle" fill="#2b2620">DNS 解析器查询名称记录</text><text x="595" y="401" font-size="19" text-anchor="middle" fill="#2b2620">返回地址；失败则报告解析错误</text><path d="M445 400 H390 V445 H200 V475" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M200 420 V475" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="475" width="330" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="508.5" font-size="19" text-anchor="middle" fill="#2b2620">建立 TCP 与验证 TLS</text><text x="200" y="533.5" font-size="19" text-anchor="middle" fill="#2b2620">已有合适连接则可复用</text><path d="M365 515 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="405" y="499" font-size="16" text-anchor="middle" fill="#2b2620">成功</text><rect x="445" y="475" width="300" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="508.5" font-size="19" text-anchor="middle" fill="#2b2620">发送 HTTP 请求</text><text x="595" y="533.5" font-size="19" text-anchor="middle" fill="#2b2620">入口 / 应用处理并响应</text><path d="M595 555 V620" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="445" y="620" width="300" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="595" y="653.5" font-size="19" text-anchor="middle" fill="#2b2620">解析 HTML，再加载资源</text><text x="595" y="678.5" font-size="19" text-anchor="middle" fill="#2b2620">请求 JSON，更新并绘制页面</text><path d="M595 280 V305 H765 V660 H745" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="35" y="620" width="330" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="653.5" font-size="19" text-anchor="middle" fill="#2b2620">连接 / 身份验证失败？</text><text x="200" y="678.5" font-size="19" text-anchor="middle" fill="#2b2620">停在该阶段，不能认定业务执行</text><path d="M200 555 V620" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="752" font-size="17" text-anchor="middle" fill="#2b2620">DNS 提供地址；页面正文沿浏览器与目标入口之间的连接传输。</text></svg>
