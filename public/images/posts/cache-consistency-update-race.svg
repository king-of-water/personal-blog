<svg xmlns="http://www.w3.org/2000/svg" width="780" height="362" viewBox="0 0 780 362" role="img" aria-labelledby="title desc"><title id="title">直接更新缓存：两次写入的顺序倒转</title><desc id="desc">A 提交 v42 后暂停，B 提交 v43 并更新缓存，A 恢复后写回 v42。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="362" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">直接更新缓存：两次写入的顺序倒转</text><rect x="31" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="100" y="85" text-anchor="middle" font-size="20" fill="#2b2620">写请求 A</text><path d="M100,101 V302" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="221" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="290" y="85" text-anchor="middle" font-size="20" fill="#2b2620">写请求 B</text><path d="M290,101 V302" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="421" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="490" y="85" text-anchor="middle" font-size="20" fill="#2b2620">数据库</text><path d="M490,101 V302" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="611" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="680" y="85" text-anchor="middle" font-size="20" fill="#2b2620">缓存</text><path d="M680,101 V302" stroke="#8a7f6d" stroke-dasharray="5 5"/><path d="M100,135 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="125" text-anchor="middle" font-size="18" fill="#2b2620">1. COMMIT v42；A 暂停</text><path d="M290,183 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="173" text-anchor="middle" font-size="18" fill="#2b2620">2. COMMIT v43</text><path d="M290,231 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485" y="221" text-anchor="middle" font-size="18" fill="#2b2620">3. SET v43</text><path d="M100,279 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="269" text-anchor="middle" font-size="18" fill="#2b2620">4. A 恢复：SET v42</text><rect x="35" y="314" width="710" height="36" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="390" y="339" text-anchor="middle" font-size="20" fill="#2b2620">数据库：42 → 43；缓存：43 → 42，发生版本倒退</text></svg>
