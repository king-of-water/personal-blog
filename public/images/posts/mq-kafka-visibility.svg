<svg xmlns="http://www.w3.org/2000/svg" width="780" height="285" viewBox="0 0 780 285" role="img" aria-labelledby="title desc"><title id="title">可见范围：事务稳定 ≤ 复制提交 ≤ 本地末尾</title><desc id="desc">示例 LSO 为 100，HW 为 110，LEO 为 120，所有边界为右开区间。小于 LSO 的记录可进入事务稳定读取并继续过滤；LSO 到 HW 之间受到未结束事务阻挡；HW 到 LEO 之间尚未进入复制可见范围。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="285" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">可见范围：事务稳定 ≤ 复制提交 ≤ 本地末尾</text><rect x="24" y="84" width="220" height="100" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="134" y="115" font-size="19" text-anchor="middle" fill="#2b2620">offset &lt; 100</text><text x="134" y="140" font-size="19" text-anchor="middle" fill="#2b2620">事务稳定读取范围</text><text x="134" y="165" font-size="19" text-anchor="middle" fill="#2b2620">仍需过滤终止事务</text><rect x="280" y="84" width="220" height="100" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="115" font-size="19" text-anchor="middle" fill="#2b2620">100 ≤ offset &lt; 110</text><text x="390" y="140" font-size="19" text-anchor="middle" fill="#2b2620">已复制可见</text><text x="390" y="165" font-size="19" text-anchor="middle" fill="#2b2620">事务读取暂时等待</text><rect x="536" y="84" width="220" height="100" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="646" y="115" font-size="19" text-anchor="middle" fill="#2b2620">110 ≤ offset &lt; 120</text><text x="646" y="140" font-size="19" text-anchor="middle" fill="#2b2620">Leader 本地尾部</text><text x="646" y="165" font-size="19" text-anchor="middle" fill="#2b2620">尚未复制可见</text><path d="M244 134 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 134 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="244" y="220" font-size="18" text-anchor="middle" fill="#2b2620">LSO = 100</text><text x="500" y="220" font-size="18" text-anchor="middle" fill="#2b2620">HW = 110</text><text x="690" y="220" font-size="18" text-anchor="middle" fill="#2b2620">LEO = 120</text><text x="24" y="263" font-size="17" text-anchor="start" fill="#2b2620">read_uncommitted 也不能直接越过 HW 读取本地尾部。</text></svg>
