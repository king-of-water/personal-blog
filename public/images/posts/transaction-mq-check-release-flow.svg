<svg xmlns="http://www.w3.org/2000/svg" width="960" height="890" viewBox="0 0 960 890" role="img"><title>事务消息的暂存、放行与回查</title><desc>生产者先发半消息，Broker确认后执行本地事务。明确提交才放行，明确回滚不投递，二次通知丢失或结果未知时Broker回查持久化事务结果。消费者还需自己的本地事务与确认。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="890" fill="#fdfaf3"/><text class="title" x="480" y="45">事务消息：先暂存，按本地事务结果放行</text><rect class="box" x="245" y="85" width="470" height="60" rx="8"/><text x="480" y="122">生产者发送半消息与事务编号</text><path class="line" d="M480 145 V185"/><rect class="box" x="245" y="185" width="470" height="60" rx="8"/><text x="480" y="222">Broker 确认保存，消费者不可见</text><path class="line" d="M480 245 V285"/><rect class="box" x="245" y="285" width="470" height="60" rx="8"/><text x="480" y="322">生产者执行并记录本地事务</text><path class="line" d="M480 345 V385"/><path class="box" d="M480 385 L660 435 L480 485 L300 435 Z"/><text class="small" x="480" y="442">获得可靠事务结果？</text><path class="line" d="M300 435 H180 V565"/><text class="small" x="184" y="420">明确提交</text><rect class="ok" x="30" y="565" width="300" height="80" rx="8"/><text x="180" y="596">通知 Commit</text><text x="180" y="626">Broker 放行消息</text><path class="line" d="M660 435 H785 V565"/><text class="small" x="785" y="420">明确回滚</text><rect class="box" x="635" y="565" width="300" height="80" rx="8"/><text x="785" y="596">通知 Rollback</text><text x="785" y="626">Broker 不投递此消息</text><path class="line" d="M480 485 V565"/><text class="small" x="503" y="520">未知 / 二次通知丢失</text><rect class="box" x="355" y="565" width="250" height="80" rx="8"/><text x="480" y="596">Broker 发起回查</text><text x="480" y="626">生产者查原事务</text><path class="line" d="M480 645 V700"/><rect class="box" x="355" y="700" width="250" height="80" rx="8"/><text x="480" y="731">查询持久化结果</text><text x="480" y="761">未知则继续等待</text><path class="line" d="M605 740 H945 V370 H480 V385"/><path class="line" d="M180 645 V730"/><rect class="ok" x="30" y="730" width="300" height="80" rx="8"/><text x="180" y="761">消费者幂等处理</text><text x="180" y="791">本地提交后再确认</text><text class="small" x="480" y="859">回查不重新下单；放行消息也不等于下游全部成功</text></svg>
