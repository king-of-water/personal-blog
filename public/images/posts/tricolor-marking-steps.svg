<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">三色标记的分步过程</title>
  <desc id="desc">以 GC Roots 指向 A、A 指向 B、B 指向 C 和 D 的对象图为例，演示三色标记的五个步骤：GC Roots 先把 A 标灰；取出 A 把 B 标灰、A 标黑；取出 B 把 C 和 D 标灰、B 标黑；依次取出 C、D 标黑；灰集合清空后全部为黑，没有垃圾。灰集合相当于待办清单。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 17px ui-sans-serif,system-ui,sans-serif}.b{font:400 15px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">灰集合 = 待办清单：取一个、看引用、标黑自己</text>
  <text x="56" y="84" class="b">对象图：GC Roots → A → B →（C、D）</text>

  <!-- 对象图 -->
  <g transform="translate(70 110)">
    <rect width="1060" height="140" rx="16" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="32" class="t">对象图</text>

    <rect x="60" y="52" width="120" height="56" rx="10" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
    <text x="120" y="87" text-anchor="middle" class="m">GC Roots</text>

    <circle cx="280" cy="80" r="28" fill="#ffffff" stroke="#8a7f6d" stroke-width="2.5"/><text x="280" y="86" text-anchor="middle" class="m">A</text>
    <circle cx="450" cy="80" r="28" fill="#ffffff" stroke="#8a7f6d" stroke-width="2.5"/><text x="450" y="86" text-anchor="middle" class="m">B</text>
    <circle cx="620" cy="46" r="28" fill="#ffffff" stroke="#8a7f6d" stroke-width="2.5"/><text x="620" y="52" text-anchor="middle" class="m">C</text>
    <circle cx="620" cy="118" r="28" fill="#ffffff" stroke="#8a7f6d" stroke-width="2.5"/><text x="620" y="124" text-anchor="middle" class="m">D</text>

    <line x1="180" y1="80" x2="250" y2="80" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="308" y1="80" x2="420" y2="80" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="472" y1="66" x2="596" y2="50" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="472" y1="94" x2="596" y2="112" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="740" y="70" class="s">初始全部为白（未访问）</text>
    <text x="740" y="100" class="s">灰 = 已访问但引用没处理完</text>
    <text x="740" y="130" class="s">黑 = 已访问且引用都处理完</text>
  </g>

  <!-- 五个步骤 -->
  <g transform="translate(70 280)">
    <rect width="1060" height="290" rx="16" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="32" class="t">五个步骤</text>

    <!-- 步骤卡片 -->
    <g transform="translate(30 50)">
      <rect width="190" height="100" rx="12" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
      <text x="95" y="28" text-anchor="middle" class="b">①</text>
      <text x="95" y="54" text-anchor="middle" class="m">A 标灰</text>
      <text x="95" y="80" text-anchor="middle" class="s">灰：[A]</text>
    </g>
    <g transform="translate(240 50)">
      <rect width="190" height="100" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="95" y="28" text-anchor="middle" class="b">②</text>
      <text x="95" y="54" text-anchor="middle" class="m">A 黑 / B 灰</text>
      <text x="95" y="80" text-anchor="middle" class="s">灰：[B]</text>
    </g>
    <g transform="translate(450 50)">
      <rect width="190" height="100" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="95" y="28" text-anchor="middle" class="b">③</text>
      <text x="95" y="54" text-anchor="middle" class="m">B 黑 / C、D 灰</text>
      <text x="95" y="80" text-anchor="middle" class="s">灰：[C, D]</text>
    </g>
    <g transform="translate(660 50)">
      <rect width="190" height="100" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="95" y="28" text-anchor="middle" class="b">④</text>
      <text x="95" y="54" text-anchor="middle" class="m">C 黑</text>
      <text x="95" y="80" text-anchor="middle" class="s">灰：[D]</text>
    </g>
    <g transform="translate(870 50)">
      <rect width="160" height="100" rx="12" fill="#2b2620" stroke="#2b2620" stroke-width="2"/>
      <text x="80" y="28" text-anchor="middle" class="b" fill="#ffffff">⑤</text>
      <text x="80" y="54" text-anchor="middle" class="m" fill="#ffffff">全部标黑</text>
      <text x="80" y="80" text-anchor="middle" class="s" fill="#d7cebd">灰：[]</text>
    </g>

    <text x="530" y="190" text-anchor="middle" class="b">每一步都是「取出一个灰对象 → 把它的引用标灰 → 自己标黑」，直到灰集合清空</text>
    <text x="530" y="222" text-anchor="middle" class="s">走完后仍然是白色的对象，说明没有任何引用链能到达它 —— 那就是垃圾</text>
    <text x="530" y="256" text-anchor="middle" class="b" fill="#943b37">并发下业务线程会改引用，可能让某个对象「逃过」标记 → 就是漏标</text>
  </g>

  <g transform="translate(70 600)">
    <rect width="1060" height="90" rx="16" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="34" class="b">关键不变式：标记过程中，黑色对象不能直接指向白色对象。</text>
    <text x="28" y="62" class="s">一旦被打破，那个白色对象就既没被灰对象「看到」，又搭上了黑对象这条线 —— 它会被漏标、被误回收。</text>
  </g>
</svg>
