<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img"><title>漏桶：请求可以挤进来，调用按节奏出去</title><desc>100 次同时到达，有界队列接收 20 次、拒绝 80 次。发送器每 10 毫秒启动一次调用，发送前检查取消或等待超时。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#d8dee0;stroke:#295279;stroke-width:1.5}.no{fill:#eed9d3;stroke:#943b37;stroke-width:1.5}</style><rect width="960" height="750" fill="#fdfaf3"/><text x="480" y="46" class="title">排队漏桶：吸收突发，要用等待时间来换</text><rect x="45" y="95" width="300" height="60" rx="10" class="box"/><text x="195" y="133" class="">0.990 秒：100 次到达</text><path class="line" d="M345 125 H430"/><rect x="440" y="95" width="470" height="60" rx="10" class="box"/><text x="675" y="133" class="">队列是否还有位置？</text><path class="line" d="M675 155 V215"/><text x="695" y="191" class="small">有</text><rect x="440" y="215" width="470" height="60" rx="10" class="ok"/><text x="675" y="253" class="">接收 20 次，进入待发送队列</text><path class="line" d="M440 125 H390 V260 H355"/><text x="390" y="198" class="small">满了</text><rect x="45" y="230" width="310" height="60" rx="10" class="no"/><text x="200" y="268" class="">其余 80 次拒绝</text><text x="240" y="350" class="">队列中的请求：① ② ③ … ⑳</text><path class="line" d="M675 275 V365"/><rect x="440" y="365" width="470" height="60" rx="10" class="box"/><text x="675" y="403" class="">每 10 毫秒，取出队头一项</text><path class="line" d="M675 425 V455"/><rect x="440" y="455" width="470" height="60" rx="10" class="box"/><text x="675" y="493" class="">已取消 / 超过等待期限？</text><path class="line" d="M440 485 H355"/><text x="390" y="472" class="small">是</text><rect x="45" y="455" width="310" height="60" rx="10" class="no"/><text x="200" y="493" class="">移除，不调用下游</text><path class="line" d="M675 515 V550"/><text x="695" y="541" class="small">否</text><rect x="440" y="550" width="470" height="60" rx="10" class="ok"/><text x="675" y="588" class="">启动下游调用</text><text x="240" y="565" class="small">第 1 次：0.990 秒</text><text x="240" y="600" class="small">第 2 次：1.000 秒</text><text x="240" y="635" class="small">第 20 次：1.180 秒</text><path d="M910 580 H935 V395 H910" class="line"/><text x="480" y="707" class="small">接收入队 ≠ 业务完成；队列长度与最长等待时间都要有限</text></svg>
