<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Codex 与 Claude Code 的 Harness 分层架构</title>
  <desc id="desc">对比 Codex 的客户端、App Server、Core、工具路由和执行环境，以及 Claude Code 的界面、Query Loop、上下文、工具和安全治理。</desc>
  <rect width="1440" height="860" fill="#fdfaf3"/>
  <style>
    .title{font:700 36px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#2b2620}
    .sub{font:400 18px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#6f6659}
    .head{font:700 24px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#2b2620}
    .label{font:700 19px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#2b2620}
    .body{font:400 15px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#6f6659}
    .note{font:600 15px ui-sans-serif,system-ui,-apple-system,"PingFang SC";fill:#4f7a52}
    .box{stroke:#8a7f6d;stroke-width:1.2;rx:14}
    .arrow{stroke:#5b5245;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b5245"/></marker></defs>
  <text x="80" y="72" class="title">同一个 Agent Loop，两种 Harness 组织方式</text>
  <text x="80" y="106" class="sub">左边强调可嵌入核心与协议，右边强调终端工作流与生命周期扩展</text>

  <rect x="70" y="145" width="625" height="640" rx="20" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="1.5"/>
  <text x="105" y="190" class="head">Codex</text><text x="207" y="190" class="note">官方开源核心</text>
  <rect class="box" x="105" y="220" width="555" height="78" fill="#d8dee0"/>
  <text x="130" y="252" class="label">客户端</text><text x="130" y="278" class="body">CLI · IDE · Desktop · 其他宿主</text>
  <path class="arrow" d="M382 299 L382 326"/>
  <rect class="box" x="105" y="328" width="555" height="82" fill="#ebe4d4"/>
  <text x="130" y="361" class="label">App Server 与协议</text><text x="130" y="387" class="body">JSON-RPC · Thread / Turn / Item · 流式事件</text>
  <path class="arrow" d="M382 411 L382 438"/>
  <rect class="box" x="105" y="440" width="555" height="94" fill="#dee3d6"/>
  <text x="130" y="474" class="label">Codex Core</text><text x="130" y="500" class="body">会话状态 · Agent Loop · 上下文装配 · 模型客户端</text>
  <path class="arrow" d="M382 535 L382 562"/>
  <rect class="box" x="105" y="564" width="555" height="82" fill="#e3dde2"/>
  <text x="130" y="597" class="label">工具路由与策略</text><text x="130" y="623" class="body">参数校验 · Approval Policy · Sandbox Policy</text>
  <path class="arrow" d="M382 647 L382 674"/>
  <rect class="box" x="105" y="676" width="555" height="78" fill="#f5f0e4"/>
  <text x="130" y="708" class="label">执行与持久化</text><text x="130" y="734" class="body">Exec Server · 进程 / 文件 · Rollout · Worktree</text>

  <rect x="745" y="145" width="625" height="640" rx="20" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="1.5"/>
  <text x="780" y="190" class="head">Claude Code</text><text x="952" y="190" class="note">官方行为 + 实现线索</text>
  <rect class="box" x="780" y="220" width="555" height="78" fill="#d8dee0"/>
  <text x="805" y="252" class="label">交互界面</text><text x="805" y="278" class="body">Terminal · IDE · Desktop · Web · Remote Control</text>
  <path class="arrow" d="M1058 299 L1058 326"/>
  <rect class="box" x="780" y="328" width="555" height="82" fill="#ebe4d4"/>
  <text x="805" y="361" class="label">Session 与 Query Loop</text><text x="805" y="387" class="body">流式消息 · tool_use / end_turn · 中断与排队输入</text>
  <path class="arrow" d="M1058 411 L1058 438"/>
  <rect class="box" x="780" y="440" width="555" height="94" fill="#dee3d6"/>
  <text x="805" y="474" class="label">上下文装配</text><text x="805" y="500" class="body">CLAUDE.md · Memory · Skills · MCP · Compaction</text>
  <path class="arrow" d="M1058 535 L1058 562"/>
  <rect class="box" x="780" y="564" width="555" height="82" fill="#e3dde2"/>
  <text x="805" y="597" class="label">工具与生命周期</text><text x="805" y="623" class="body">Read / Edit / Bash / Grep · Hooks · Subagents</text>
  <path class="arrow" d="M1058 647 L1058 674"/>
  <rect class="box" x="780" y="676" width="555" height="78" fill="#f5f0e4"/>
  <text x="805" y="708" class="label">安全与状态</text><text x="805" y="734" class="body">Permissions · Sandbox · Checkpoint · JSONL</text>

  <text x="720" y="830" text-anchor="middle" class="sub">模型提出下一步，Harness 决定这一步怎样被看见、执行、记录和约束</text>
</svg>
