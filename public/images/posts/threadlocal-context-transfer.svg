<svg xmlns="http://www.w3.org/2000/svg" width="780" height="385" viewBox="0 0 780 385" role="img" aria-labelledby="title desc"><title id="title">异步传播：提交时捕获，执行后恢复</title><desc id="desc">提交方捕获不可变上下文并包装任务；执行方保存旧值，安装快照执行任务，无论正常返回还是异常，finally 恢复旧值或移除。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="385" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">异步传播：提交时捕获，执行后恢复</text><rect x="25" y="80" width="205" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="127.5" y="106.5" text-anchor="middle" font-size="20" fill="#2b2620">提交方读取 CURRENT</text><text x="127.5" y="131.5" text-anchor="middle" font-size="20" fill="#2b2620">捕获小型快照</text><rect x="290" y="80" width="205" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="392.5" y="106.5" text-anchor="middle" font-size="20" fill="#2b2620">包装任务</text><text x="392.5" y="131.5" text-anchor="middle" font-size="20" fill="#2b2620">提交执行器</text><rect x="550" y="80" width="205" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="652.5" y="106.5" text-anchor="middle" font-size="20" fill="#2b2620">实际执行线程</text><text x="652.5" y="131.5" text-anchor="middle" font-size="20" fill="#2b2620">保存 previous</text><path d="M230,112 H290" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M495,112 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="550" y="230" width="205" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="652.5" y="258.5" text-anchor="middle" font-size="20" fill="#2b2620">安装快照</text><text x="652.5" y="283.5" text-anchor="middle" font-size="20" fill="#2b2620">执行 action</text><path d="M652,144 V230" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="270" y="230" width="225" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="382.5" y="258.5" text-anchor="middle" font-size="20" fill="#2b2620">finally</text><text x="382.5" y="283.5" text-anchor="middle" font-size="20" fill="#2b2620">恢复 previous / 移除</text><path d="M550,264 H495" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="500" y="210" text-anchor="middle" font-size="18" fill="#2b2620">正常或异常</text><text x="25" y="355" text-anchor="start" font-size="18" fill="#2b2620">CallerRuns 也适用：不能误删提交线程原有的外层上下文。</text></svg>
