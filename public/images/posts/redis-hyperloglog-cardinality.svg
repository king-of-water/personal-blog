<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Redis HyperLogLog 的基数估算过程</title>
  <desc id="desc">输入元素经过哈希，一部分位选择寄存器，另一部分位的前导零更新寄存器最大值，最终根据全部寄存器估算不同元素数量。</desc>
  <rect width="1100" height="610" rx="28" fill="#fdfaf3"/>
  <g font-family="sans-serif">
    <text x="54" y="62" font-size="30" font-weight="700" fill="#2b2620">HyperLogLog：记住统计特征，不记住成员</text>
    <text x="54" y="98" font-size="18" fill="#6f6659">PFCOUNT 回答“不同元素大约有多少”，不能回答“它们是谁”</text>

    <g transform="translate(54 150)" text-anchor="middle">
      <rect x="0" y="0" width="184" height="100" rx="18" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
      <text x="92" y="35" font-size="20" font-weight="700" fill="#295279">输入元素</text>
      <text x="92" y="66" font-size="16" fill="#2b2620">user:7 · user:42</text><text x="92" y="88" font-size="16" fill="#2b2620">user:7 · user:91</text>
      <path d="M191 50H244" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="252" y="0" width="184" height="100" rx="18" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
      <text x="344" y="35" font-size="20" font-weight="700" fill="#725923">Hash</text>
      <text x="344" y="67" font-size="16" fill="#2b2620">0110 000101…</text><text x="344" y="89" font-size="15" fill="#6f6659">均匀比特串</text>
      <path d="M443 50H496" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="504" y="0" width="214" height="100" rx="18" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
      <text x="611" y="33" font-size="19" font-weight="700" fill="#5e5083">拆成两部分</text>
      <text x="611" y="62" font-size="16" fill="#2b2620">索引位 → Register</text><text x="611" y="86" font-size="16" fill="#2b2620">剩余位 → 前导零</text>
      <path d="M725 50H778" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="786" y="0" width="206" height="100" rx="18" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="889" y="35" font-size="19" font-weight="700" fill="#466b48">更新最大值</text>
      <text x="889" y="67" font-size="16" fill="#2b2620">R[index] = max</text><text x="889" y="89" font-size="15" fill="#6f6659">重复元素不复制保存</text>
    </g>

    <text x="54" y="318" font-size="21" font-weight="700" fill="#2b2620">Register 只保存各桶观察到的统计特征</text>
    <g transform="translate(54 345)" text-anchor="middle">
      <rect x="0" y="0" width="112" height="88" rx="12" fill="#fbf8f1" stroke="#466b48"/><text x="56" y="29" font-size="15" fill="#6f6659">R0</text><text x="56" y="65" font-size="27" font-weight="700" fill="#466b48">3</text>
      <rect x="122" y="0" width="112" height="88" rx="12" fill="#fbf8f1" stroke="#466b48"/><text x="178" y="29" font-size="15" fill="#6f6659">R1</text><text x="178" y="65" font-size="27" font-weight="700" fill="#466b48">1</text>
      <rect x="244" y="0" width="112" height="88" rx="12" fill="#fbf8f1" stroke="#466b48"/><text x="300" y="29" font-size="15" fill="#6f6659">R2</text><text x="300" y="65" font-size="27" font-weight="700" fill="#466b48">5</text>
      <rect x="366" y="0" width="112" height="88" rx="12" fill="#fbf8f1" stroke="#466b48"/><text x="422" y="29" font-size="15" fill="#6f6659">R3</text><text x="422" y="65" font-size="27" font-weight="700" fill="#466b48">2</text>
      <text x="515" y="56" font-size="26" fill="#6f6659">…</text>
      <path d="M552 44H634" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="642" y="0" width="350" height="88" rx="16" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
      <text x="817" y="36" font-size="20" font-weight="700" fill="#725923">对全部 Register 计算</text>
      <text x="817" y="65" font-size="17" fill="#2b2620">PFCOUNT ≈ 独立元素基数</text>
    </g>

    <g transform="translate(54 485)">
      <rect x="0" y="0" width="300" height="72" rx="15" fill="#dee3d6"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#466b48">固定小内存</text><text x="24" y="55" font-size="15" fill="#554d42">稠密表示约 12 KB</text>
      <rect x="325" y="0" width="300" height="72" rx="15" fill="#f4eace"/>
      <text x="349" y="30" font-size="18" font-weight="700" fill="#725923">允许统计误差</text><text x="349" y="55" font-size="15" fill="#554d42">标准误差约 0.81%</text>
      <rect x="650" y="0" width="342" height="72" rx="15" fill="#eed9d3"/>
      <text x="674" y="30" font-size="18" font-weight="700" fill="#943b37">不可枚举与精确判断</text><text x="674" y="55" font-size="15" fill="#554d42">不适合计费、权限与成员查询</text>
    </g>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker></defs>
</svg>
