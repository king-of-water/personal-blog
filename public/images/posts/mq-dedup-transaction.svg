<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc"><title id="title">本地效果与去重结果一起提交</title><desc id="desc">唯一约束让并发首次事件只有一个胜者，胜者在同一事务内修改业务并保存结果；确认丢失后的重复读取已提交结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="430" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">本地效果与去重结果一起提交</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">收到事件</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">稳定 eventId</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">唯一约束插入</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">同一事务竞争</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">插入成功</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">修改业务并保存结果</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">重复事件</text><text x="129" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">同键同参数才复用</text><rect x="284" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">唯一冲突</text><text x="389" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">回滚后查已提交结果</text><rect x="544" y="250" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">事务提交</text><text x="650" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">随后确认消费</text><path d="M389,155 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,155 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,290 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="395" font-size="18" text-anchor="start" fill="#2b2620">去重记录单独先提交，会把未产生的业务效果误判为已经完成。</text></svg>
