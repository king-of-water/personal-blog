<svg xmlns="http://www.w3.org/2000/svg" width="780" height="490" viewBox="0 0 780 490" role="img" aria-labelledby="title desc"><title id="title">4.x 事务消息：已知结果放行，未知结果继续回查</title><desc id="desc">半消息先被 Broker 按配置接收，随后执行本地事务。持久化提交结果使消息可见，明确回滚不投递，未知结果等待回查。回查次数和扫描受配置约束。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="490" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">4.x 事务消息：已知结果放行，未知结果继续回查</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">发送半消息</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">消费者不可见</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">Broker 确认</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">耐久依存储配置</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">执行本地事务</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">持久保存事务结果</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="250" width="210" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="129" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">COMMIT</text><text x="129" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">发布到业务 Topic</text><rect x="284" y="250" width="210" height="80" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="389" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">ROLLBACK</text><text x="389" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">不投递给消费者</text><rect x="544" y="250" width="212" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="650" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">UNKNOW / 确认丢失</text><text x="650" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">查询持久事务结果</text><path d="M650,155 V210 H129 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M389,210 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,210 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="386" font-size="18" text-anchor="start" fill="#2b2620">回查仍未知：在策略允许范围内继续等待，不把查无记录当回滚。</text><text x="24" y="425" font-size="18" text-anchor="start" fill="#2b2620">超限按对应版本处理；4.9.8 默认监听器尝试转存专用 Topic。</text><text x="24" y="462" font-size="18" text-anchor="start" fill="#2b2620">事务消息协调发布侧，不替代消费端的幂等、重试和业务对账。</text></svg>
