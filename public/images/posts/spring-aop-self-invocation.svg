<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">自调用绕过代理导致事务失效</title>
  <desc id="desc">外部调用进入代理对象，代理触发增强后再调到真实对象，因此 outer 方法的事务生效。但 outer 内部用 this.inner() 调用时，this 指向真实对象而非代理，调用不经过代理，inner 上的事务增强不会触发。改用注入自己或 AopContext.currentProxy 可以让调用重新经过代理。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b48"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#943b37"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">代理只在「方法调用入口」生效</text>
  <text x="56" y="84" class="b">进去之后的内部调用，代理管不着 —— 这就是自调用失效的根源。</text>

  <!-- 上半：外部调用（正常） -->
  <g transform="translate(70 120)">
    <rect width="1060" height="230" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t" fill="#466b48">① 外部调用：经过代理，增强生效</text>

    <rect x="40" y="60" width="180" height="80" rx="12" fill="#e3dde2" stroke="#5e5083"/>
    <text x="130" y="95" text-anchor="middle" class="b">外部调用方</text>
    <text x="130" y="122" text-anchor="middle" class="m">service.outer()</text>

    <rect x="290" y="60" width="200" height="80" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="390" y="92" text-anchor="middle" class="t" fill="#466b48">代理对象</text>
    <text x="390" y="122" text-anchor="middle" class="s">触发事务增强</text>

    <rect x="560" y="60" width="200" height="80" rx="12" fill="#d8dee0" stroke="#295279"/>
    <text x="660" y="92" text-anchor="middle" class="t" fill="#295279">真实对象</text>
    <text x="660" y="122" text-anchor="middle" class="s">outer() 执行</text>

    <line x1="220" y1="100" x2="290" y2="100" stroke="#466b48" stroke-width="3" marker-end="url(#arrowG)"/>
    <line x1="490" y1="100" x2="560" y2="100" stroke="#466b48" stroke-width="3" marker-end="url(#arrowG)"/>

    <text x="40" y="190" class="b" fill="#466b48">✓ outer() 的事务生效 —— 因为调用是从代理对象进去的。</text>
  </g>

  <!-- 下半：自调用（失效） -->
  <g transform="translate(70 380)">
    <rect width="1060" height="270" rx="18" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
    <text x="28" y="34" class="t" fill="#943b37">② 自调用：this 指向真实对象，绕过代理</text>

    <rect x="40" y="60" width="230" height="90" rx="12" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="155" y="92" text-anchor="middle" class="b">真实对象内部</text>
    <text x="155" y="122" text-anchor="middle" class="m">this.inner()</text>

    <rect x="360" y="60" width="230" height="90" rx="12" fill="#f5f0e4" stroke="#d7cebd" stroke-dasharray="7 6"/>
    <text x="475" y="92" text-anchor="middle" class="b" fill="#943b37">代理对象</text>
    <text x="475" y="122" text-anchor="middle" class="s" fill="#943b37">被跳过（未经过）</text>

    <rect x="680" y="60" width="230" height="90" rx="12" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="795" y="92" text-anchor="middle" class="b">inner() 直接执行</text>
    <text x="795" y="122" text-anchor="middle" class="s" fill="#943b37">REQUIRES_NEW 未生效</text>

    <line x1="270" y1="105" x2="360" y2="105" stroke="#943b37" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowR)"/>
    <text x="315" y="96" text-anchor="middle" class="s" fill="#943b37">不经过</text>
    <line x1="590" y1="105" x2="680" y2="105" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="40" y="200" class="b" fill="#943b37">✗ inner() 的事务不生效 —— 不是注解写错，是调用根本没走代理。</text>
    <text x="40" y="234" class="b">解法：拆到另一个 Bean（推荐）· 注入自己 self.inner() · AopContext.currentProxy()</text>
  </g>
</svg>
