<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">同一订单串行，不同订单可以并行</title><desc id="desc">业务版本与事件一起提交，发送器按键推进，稳定路由到队列，消费侧按键串行并在业务提交后确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">同一订单串行，不同订单可以并行</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">业务版本 1 → 2 → 3</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">与事件同事务提交</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">按键发送</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">前条未知时不越过</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">稳定路由</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">同键进入同队列</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="245" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="276" font-size="19" text-anchor="middle" fill="#2b2620">按序处理</text><text x="650" y="301" font-size="19" text-anchor="middle" fill="#2b2620">不拆到无序线程池</text><rect x="284" y="245" width="210" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="389" y="276" font-size="19" text-anchor="middle" fill="#2b2620">业务提交</text><text x="389" y="301" font-size="19" text-anchor="middle" fill="#2b2620">版本与效果一起更新</text><rect x="24" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="276" font-size="19" text-anchor="middle" fill="#2b2620">确认完成</text><text x="129" y="301" font-size="19" text-anchor="middle" fill="#2b2620">再推进下一条</text><path d="M650,155 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,282 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,282 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="378" font-size="18" text-anchor="start" fill="#2b2620">路由迁移、失败跳过和旧任务恢复，都要守住同一业务序列。</text></svg>
