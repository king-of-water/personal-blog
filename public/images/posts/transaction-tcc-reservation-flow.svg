<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img"><title>TCC预留资源后确认或取消</title><desc>Try先冻结金额和预留库存，全部成功后记录确认决定，否则取消。Confirm与Cancel只处理同一分支的预留，重复和迟到请求受持久化终态约束。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="800" fill="#fdfaf3"/><text class="title" x="480" y="45">TCC：先预留资源，后确认或释放</text><rect class="box" x="245" y="85" width="470" height="60" rx="8"/><text x="480" y="122">Try 钱包：冻结本次 100 元</text><path class="line" d="M480 145 V185"/><rect class="box" x="245" y="185" width="470" height="60" rx="8"/><text x="480" y="222">Try 库存：预留本次 1 件商品</text><path class="line" d="M480 245 V285"/><path class="box" d="M480 285 L660 335 L480 385 L300 335 Z"/><text class="small" x="480" y="342">所有 Try 成功？</text><path class="line" d="M300 335 H230 V430"/><text class="small" x="240" y="321">是</text><path class="line" d="M660 335 H730 V430"/><text class="small" x="720" y="321">否 / 准备超时</text><rect class="box" x="45" y="430" width="370" height="60" rx="8"/><text x="230" y="467">协调者保存确认决定</text><rect class="box" x="545" y="430" width="370" height="60" rx="8"/><text x="730" y="467">协调者保存取消决定</text><path class="line" d="M230 490 V550"/><path class="line" d="M730 490 V550"/><rect class="ok" x="45" y="550" width="370" height="60" rx="8"/><text x="230" y="587">Confirm：冻结转扣款、确认库存</text><rect class="box" x="545" y="550" width="370" height="60" rx="8"/><text x="730" y="587">Cancel：解冻、释放库存</text><path class="line" d="M230 610 V680"/><path class="line" d="M730 610 V680"/><rect class="box" x="45" y="680" width="370" height="60" rx="8"/><text x="230" y="717">响应丢失：重试原分支确认</text><rect class="box" x="545" y="680" width="370" height="60" rx="8"/><text x="730" y="717">响应丢失：重试原分支取消</text><text class="small" x="480" y="782">取消先到也留下记录，迟到 Try 不能再占资源</text></svg>
