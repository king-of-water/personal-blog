<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LinkedHashMap 的双向链表与 LRU 淘汰</title>
  <desc id="desc">LinkedHashMap 继承 HashMap，在节点上再挂一条双向链表（before/after 指针），哈希表部分复用用于 O(1) 查找，链表决定遍历顺序。accessOrder 为 true 时按访问顺序排列，get 命中的节点移到尾部，容量超出时淘汰链表头部（最久未用），从而实现 LRU。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">LinkedHashMap = HashMap 的哈希表 + 一条双向链表</text>
  <text x="56" y="84" class="b">查找还是 O(1)（复用 HashMap），链表只决定「遍历顺序」。</text>

  <!-- 哈希表部分 -->
  <g transform="translate(60 120)">
    <rect width="1080" height="150" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t" fill="#466b48">① 哈希表部分（继承自 HashMap，提供 O(1) 查找）</text>
    <rect x="40" y="56" width="120" height="60" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="100" y="92" text-anchor="middle" class="m">bucket 0</text>
    <rect x="180" y="56" width="120" height="60" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="240" y="92" text-anchor="middle" class="m">bucket 1</text>
    <rect x="320" y="56" width="120" height="60" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="380" y="92" text-anchor="middle" class="m">bucket 2</text>
    <text x="480" y="92" class="b">… 每个桶里放的是 Entry（多了 before / after 两个指针）</text>
  </g>

  <!-- 双向链表 -->
  <g transform="translate(60 300)">
    <rect width="1080" height="230" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t" fill="#295279">② 双向链表部分（决定遍历顺序，accessOrder = true 时按访问顺序）</text>

    <rect x="90" y="80" width="180" height="70" rx="12" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
    <text x="180" y="110" text-anchor="middle" class="m">A（最久未用）</text>
    <text x="180" y="136" text-anchor="middle" class="s">head / eldest</text>

    <rect x="330" y="80" width="180" height="70" rx="12" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="420" y="118" text-anchor="middle" class="m">B</text>

    <rect x="570" y="80" width="180" height="70" rx="12" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="660" y="118" text-anchor="middle" class="m">C</text>

    <rect x="810" y="80" width="180" height="70" rx="12" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="900" y="110" text-anchor="middle" class="m">D（最近访问）</text>
    <text x="900" y="136" text-anchor="middle" class="s">tail</text>

    <line x1="270" y1="105" x2="330" y2="105" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="510" y1="105" x2="570" y2="105" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="750" y1="105" x2="810" y2="105" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

    <line x1="330" y1="135" x2="270" y2="135" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="570" y1="135" x2="510" y2="135" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="810" y1="135" x2="750" y2="135" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="540" y="180" text-anchor="middle" class="s">before / after 双向指针：get 命中某个节点，就把它移到尾部</text>
    <text x="540" y="208" text-anchor="middle" class="b" fill="#943b37">容量超限时，淘汰 head（最久未用）→ 这就是 LRU</text>
  </g>

  <!-- 两种顺序 -->
  <g transform="translate(60 550)">
    <rect width="1080" height="140" rx="16" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="34" class="t">accessOrder 决定链表的顺序</text>
    <text x="28" y="68" class="b">false（默认）：链表维护「插入顺序」，遍历按插入先后输出。</text>
    <text x="28" y="98" class="b">true：链表维护「访问顺序」，get/put 命中即把节点移到尾部，头部始终是最久未用。</text>
    <text x="28" y="126" class="s">配合重写 removeEldestEntry 返回 size() &gt; capacity，就得到几行代码的 LRU。</text>
  </g>
</svg>
