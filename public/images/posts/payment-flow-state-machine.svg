<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">支付、业务确认与退款状态机</title>
  <desc id="desc">流水从等待支付进入支付中；支付明确失败进入支付失败，成功则进入已支付。业务事实属于当前支付时进入业务成功，否则进入退款中，并在退款确认后进入已退款。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5245"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b48"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#943b37"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="64" y="66" fill="#2b2620" font-size="30" font-weight="700">钱扣了、业务成了、钱退了是三个提交点</text>
    <text x="64" y="102" fill="#6f6659" font-size="18">未画出的边表示禁止迁移；终态只能读取，普通触发器不能重新打开</text>

    <g text-anchor="middle">
      <rect x="58" y="246" width="160" height="92" rx="16" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
      <text x="138" y="283" fill="#2b2620" font-size="19" font-weight="700">WAIT_PAY</text>
      <text x="138" y="312" fill="#554d42" font-size="15">流水已建立</text>

      <rect x="278" y="246" width="160" height="92" rx="16" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
      <text x="358" y="283" fill="#2b2620" font-size="19" font-weight="700">PAYING</text>
      <text x="358" y="312" fill="#554d42" font-size="15">支付结果待确认</text>

      <rect x="498" y="246" width="160" height="92" rx="16" fill="#f4eace" stroke="#8a7f6d" stroke-width="2"/>
      <text x="578" y="283" fill="#2b2620" font-size="19" font-weight="700">PAYED</text>
      <text x="578" y="312" fill="#554d42" font-size="15">资金已扣</text>

      <rect x="825" y="158" width="210" height="96" rx="16" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="930" y="196" fill="#2b2620" font-size="19" font-weight="700">BIZ_SUCCESS</text>
      <text x="930" y="226" fill="#3d6340" font-size="15">业务终态，永久禁退</text>

      <rect x="718" y="438" width="180" height="96" rx="16" fill="#f4eace" stroke="#8a7f6d" stroke-width="2"/>
      <text x="808" y="476" fill="#2b2620" font-size="19" font-weight="700">REFUNDING</text>
      <text x="808" y="506" fill="#554d42" font-size="15">退款结果待确认</text>

      <rect x="955" y="438" width="180" height="96" rx="16" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
      <text x="1045" y="476" fill="#2b2620" font-size="19" font-weight="700">REFUNDED</text>
      <text x="1045" y="506" fill="#3d6340" font-size="15">退款终态</text>

      <rect x="278" y="438" width="160" height="96" rx="16" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
      <text x="358" y="476" fill="#2b2620" font-size="19" font-weight="700">PAY_FAIL</text>
      <text x="358" y="506" fill="#943b37" font-size="15">当前 attempt 终态</text>
    </g>

    <path d="M218 292H278M438 292H498" stroke="#5b5245" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M358 338V438" stroke="#943b37" stroke-width="4" marker-end="url(#red)"/>
    <path d="M658 268C735 268 748 206 825 206" fill="none" stroke="#466b48" stroke-width="4" marker-end="url(#green)"/>
    <path d="M625 338C650 395 680 486 718 486" fill="none" stroke="#5b5245" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M898 486H955" stroke="#466b48" stroke-width="4" marker-end="url(#green)"/>

    <text x="242" y="274" fill="#6f6659" font-size="14">开始确认</text>
    <text x="462" y="274" fill="#6f6659" font-size="14">扣款成功</text>
    <text x="374" y="395" fill="#943b37" font-size="14">明确失败</text>
    <text x="696" y="188" fill="#3d6340" font-size="14">事实属于本单</text>
    <text x="646" y="416" fill="#6f6659" font-size="14">业务失败且允许补偿</text>
    <text x="914" y="469" fill="#3d6340" font-size="14">退款确认</text>

    <rect x="64" y="620" width="1072" height="78" rx="14" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="2"/>
    <text x="88" y="651" fill="#2b2620" font-size="17" font-weight="700">UNKNOWN 不一定需要单独状态值</text>
    <text x="88" y="679" fill="#554d42" font-size="15">PAYING、PAYED 与 REFUNDING 各自表达哪一类事实待确认；长期无法确认时进入人工队列，但不伪造失败。</text>
  </g>
</svg>
