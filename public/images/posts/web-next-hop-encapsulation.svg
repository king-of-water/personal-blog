<svg xmlns="http://www.w3.org/2000/svg" width="780" height="720" viewBox="0 0 780 720" role="img" aria-labelledby="title desc"><title id="title">同一份请求，按下一跳逐段运送</title><desc id="desc">HTTP 经 TLS 保护后进入 TCP 段和 IP 数据报，再封装为当前链路的帧。电脑查路由选择网关，没有邻居记录时用 ARP 查询网关 MAC。路由器取出 IP 数据报再为下一跳封装。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="720" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">同一份请求，按下一跳逐段运送</text><rect x="35" y="85" width="320" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="195" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">浏览器：形成 HTTP 消息</text><text x="195" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">TLS 保护应用数据</text><path d="M195 155 V195" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="195" width="320" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="195" y="223.5" font-size="19" text-anchor="middle" fill="#2b2620">TCP：分段并维护传输状态</text><text x="195" y="248.5" font-size="19" text-anchor="middle" fill="#2b2620">IP：加入源地址与目标地址</text><path d="M195 265 V315" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="315" width="320" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="195" y="346" font-size="19" text-anchor="middle" fill="#2b2620">查路由：目标不在本地</text><text x="195" y="371" font-size="19" text-anchor="middle" fill="#2b2620">选择默认网关作为下一跳</text><path d="M355 350 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="400" y="330" font-size="17" text-anchor="middle" fill="#2b2620">查邻居</text><rect x="445" y="315" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="346" font-size="19" text-anchor="middle" fill="#2b2620">无网关 MAC 缓存？</text><text x="595" y="371" font-size="19" text-anchor="middle" fill="#2b2620">ARP 询问，收到回答后再发</text><path d="M595 390 V425 H195 V455" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M195 390 V455" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="455" width="320" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="195" y="486" font-size="19" text-anchor="middle" fill="#2b2620">按当前链路封装并发送</text><text x="195" y="511" font-size="19" text-anchor="middle" fill="#2b2620">本跳帧的目标是网关</text><path d="M355 490 H445" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="445" y="455" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="486" font-size="19" text-anchor="middle" fill="#2b2620">网关取出 IP 数据报</text><text x="595" y="511" font-size="19" text-anchor="middle" fill="#2b2620">查路由，为下一跳重新封装</text><path d="M595 530 V565" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="445" y="565" width="300" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="593.5" font-size="19" text-anchor="middle" fill="#2b2620">后续路由器继续逐跳转发</text><text x="595" y="618.5" font-size="19" text-anchor="middle" fill="#2b2620">目标网络交给服务端</text><text x="390" y="676" font-size="17" text-anchor="middle" fill="#2b2620">示例限定 IPv4 以太网；每跳链路地址变化。</text><text x="390" y="701" font-size="16" text-anchor="middle" fill="#2b2620">NAT 还可能改写 IP / 端口；路由不要求经过 NAT。</text></svg>
