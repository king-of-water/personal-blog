<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc"><title id="title">超时消息触发检查，订单状态裁决关单</title><desc id="desc">订单与发送意图同事务保存，到期后查询权威状态，只有仍未支付且过期才条件关单并持久生成库存释放任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="430" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">超时消息触发检查，订单状态裁决关单</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">创建订单</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">保存期限与任务意图</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">到期交付</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">允许晚到，不应早关</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">查询权威状态</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">支付或改期会改变结果</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="250" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">满足关单条件</text><text x="650" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">事务推进并写 Outbox</text><rect x="284" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">释放库存</text><text x="389" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">按预占身份幂等</text><rect x="24" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">确认与对账</text><text x="129" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">失败保留恢复责任</text><path d="M650,155 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,290 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,290 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="395" font-size="18" text-anchor="start" fill="#2b2620">已支付、已关闭或旧期限任务：结束本次检查，不重复产生副作用。</text></svg>
