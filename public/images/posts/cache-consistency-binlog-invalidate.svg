<svg xmlns="http://www.w3.org/2000/svg" width="780" height="435" viewBox="0 0 780 435" role="img" aria-labelledby="title desc"><title id="title">binlog 同步：删除确认之后才能确认消费</title><desc id="desc">提交后的有效变更被订阅、可靠投递，消费者映射缓存键并删除；失败或超时保留事件重试，删除确认后才确认消费位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="435" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">binlog 同步：删除确认之后才能确认消费</text><rect x="30" y="80" width="210" height="60" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="135" y="104.5" text-anchor="middle" font-size="20" fill="#2b2620">事务提交 v42</text><text x="135" y="129.5" text-anchor="middle" font-size="20" fill="#2b2620">binlog 有效变更</text><rect x="285" y="80" width="210" height="60" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="104.5" text-anchor="middle" font-size="20" fill="#2b2620">订阅并解析</text><text x="390" y="129.5" text-anchor="middle" font-size="20" fill="#2b2620">可靠投递事件</text><rect x="540" y="80" width="210" height="60" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="645" y="104.5" text-anchor="middle" font-size="20" fill="#2b2620">消费者映射 key</text><text x="645" y="129.5" text-anchor="middle" font-size="20" fill="#2b2620">执行 DEL</text><path d="M240,110 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M495,110 H540" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M645,185 L725,230 L645,275 L565,230 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="645" y="237" text-anchor="middle" font-size="20" fill="#2b2620">删除确认？</text><path d="M645,140 V185" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="285" y="197" width="210" height="65" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="390" y="224" text-anchor="middle" font-size="20" fill="#2b2620">保留未确认事件</text><text x="390" y="249" text-anchor="middle" font-size="20" fill="#2b2620">退避重试</text><path d="M565,230 H495" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="530" y="211" text-anchor="middle" font-size="18" fill="#2b2620">否 / 超时</text><path d="M390,197 V170 H520 V110 H540" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="540" y="325" width="210" height="65" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="645" y="352" text-anchor="middle" font-size="20" fill="#2b2620">确认消费位置</text><text x="645" y="377" text-anchor="middle" font-size="20" fill="#2b2620">后续读 miss 回源</text><path d="M645,275 V325" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="674" y="309" text-anchor="middle" font-size="18" fill="#2b2620">是</text><text x="30" y="416" text-anchor="start" font-size="18" fill="#2b2620">订阅投递位点 ≠ 缓存消费完成位点</text></svg>
