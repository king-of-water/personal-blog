<svg xmlns="http://www.w3.org/2000/svg" width="780" height="790" viewBox="0 0 780 790" role="img" aria-labelledby="title desc"><title id="title">失败先看执行证据，下线先停止新工作</title><desc id="desc">失败后区分明确未发送、已经得到业务结果、发送后结果未知。只有语义允许且预算足够时才重试，结果未知的写操作按原编号确认。下线从停止分配新工作开始，排空在途请求后退出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="790" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">失败先看执行证据，下线先停止新工作</text><rect x="230" y="80" width="320" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="108.5" font-size="19" text-anchor="middle" fill="#2b2620">一次上游尝试没有正常完成</text><text x="390" y="133.5" font-size="19" text-anchor="middle" fill="#2b2620">先判断已获得的证据</text><path d="M390 150 V185 H145 V230" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 150 V230" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 150 V185 H635 V230" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="40" y="230" width="210" height="90" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="145" y="268.5" font-size="19" text-anchor="middle" fill="#2b2620">能够明确确认</text><text x="145" y="293.5" font-size="19" text-anchor="middle" fill="#2b2620">业务请求未发送</text><rect x="285" y="230" width="210" height="90" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="268.5" font-size="19" text-anchor="middle" fill="#2b2620">已有明确业务结果</text><text x="390" y="293.5" font-size="19" text-anchor="middle" fill="#2b2620">如拒绝或提交成功</text><rect x="530" y="230" width="210" height="90" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="635" y="268.5" font-size="19" text-anchor="middle" fill="#2b2620">发送后响应丢失</text><text x="635" y="293.5" font-size="19" text-anchor="middle" fill="#2b2620">业务效果未知</text><path d="M145 320 V390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 320 V390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M635 320 V390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="40" y="390" width="210" height="90" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="145" y="428.5" font-size="19" text-anchor="middle" fill="#2b2620">语义允许且有预算</text><text x="145" y="453.5" font-size="19" text-anchor="middle" fill="#2b2620">可尝试其他目标</text><rect x="285" y="390" width="210" height="90" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="428.5" font-size="19" text-anchor="middle" fill="#2b2620">按结果推进业务</text><text x="390" y="453.5" font-size="19" text-anchor="middle" fill="#2b2620">不盲目换台重做</text><rect x="530" y="390" width="210" height="90" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="635" y="428.5" font-size="19" text-anchor="middle" fill="#2b2620">写操作保留原编号</text><text x="635" y="453.5" font-size="19" text-anchor="middle" fill="#2b2620">查询或幂等重试</text><text x="390" y="535" font-size="19" text-anchor="middle" fill="#2b2620">计划下线是另一条路径：不能直接迁移已执行中的业务</text><rect x="40" y="590" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="145" y="626" font-size="19" text-anchor="middle" fill="#2b2620">停止分配新工作</text><text x="145" y="651" font-size="19" text-anchor="middle" fill="#2b2620">传播摘除 / 退出信号</text><path d="M250 632 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="285" y="590" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="626" font-size="19" text-anchor="middle" fill="#2b2620">等待在途请求完成</text><text x="390" y="651" font-size="19" text-anchor="middle" fill="#2b2620">处理长连接新请求</text><path d="M495 632 H530" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="530" y="590" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="635" y="626" font-size="19" text-anchor="middle" fill="#2b2620">宽限期后退出</text><text x="635" y="651" font-size="19" text-anchor="middle" fill="#2b2620">剩余未知结果查证</text><text x="390" y="748" font-size="18" text-anchor="middle" fill="#2b2620">超时结束等待；换实例不撤销已提交的订单。</text></svg>
