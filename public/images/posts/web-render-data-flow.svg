<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" role="img" aria-labelledby="title desc"><title id="title">有了 HTML，怎样看到商品与价格</title><desc id="desc">浏览器解析 HTML，加载样式和脚本并显示已有内容。脚本如需价格会继续请求 JSON，成功后更新页面结构并绘制，失败时由页面表达数据加载失败。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="640" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">有了 HTML，怎样看到商品与价格</text><rect x="235" y="75" width="310" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">收到商品页 HTML</text><path d="M390 140 V185" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="235" y="185" width="310" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="216" font-size="19" text-anchor="middle" fill="#2b2620">解析页面结构</text><text x="390" y="241" font-size="19" text-anchor="middle" fill="#2b2620">发现 CSS、脚本和图片后加载</text><path d="M390 260 V305" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="235" y="305" width="310" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="336" font-size="19" text-anchor="middle" fill="#2b2620">显示已有内容，执行脚本</text><text x="390" y="361" font-size="19" text-anchor="middle" fill="#2b2620">价格需要另行查询？</text><path d="M235 342 H190" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="210" y="328" font-size="17" text-anchor="middle" fill="#2b2620">否</text><rect x="25" y="305" width="165" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="107.5" y="336" font-size="19" text-anchor="middle" fill="#2b2620">按已有内容</text><text x="107.5" y="361" font-size="19" text-anchor="middle" fill="#2b2620">完成页面绘制</text><path d="M390 380 V430" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="410" font-size="17" text-anchor="middle" fill="#2b2620">是：请求商品 JSON</text><rect x="235" y="430" width="310" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="458.5" font-size="19" text-anchor="middle" fill="#2b2620">读取并解析价格响应</text><text x="390" y="483.5" font-size="19" text-anchor="middle" fill="#2b2620">数据有效且请求成功？</text><path d="M545 465 H590" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="570" y="451" font-size="17" text-anchor="middle" fill="#2b2620">否</text><rect x="590" y="430" width="165" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="672.5" y="458.5" font-size="19" text-anchor="middle" fill="#2b2620">表达加载失败</text><text x="672.5" y="483.5" font-size="19" text-anchor="middle" fill="#2b2620">按业务决定重试</text><path d="M390 500 V550" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="532" font-size="17" text-anchor="middle" fill="#2b2620">是</text><rect x="235" y="550" width="310" height="65" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="588.5" font-size="19" text-anchor="middle" fill="#2b2620">更新页面元素，再布局与绘制</text></svg>
