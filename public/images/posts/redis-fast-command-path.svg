<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Redis 一次命令的执行路径</title>
  <desc id="desc">展示客户端请求经过网络 I/O、事件循环、串行命令执行和回复发送的路径，并区分 I/O 线程、后台线程与持久化子进程。</desc>
  <rect width="1100" height="660" rx="28" fill="#fdfaf3"/>
  <g font-family="sans-serif">
    <text x="54" y="62" font-size="30" font-weight="700" fill="#2b2620">一次命令走过四类执行资源</text>
    <text x="54" y="98" font-size="18" fill="#6f6659">网络可以并行辅助，普通命令仍主要沿核心路径依次执行</text>

    <rect x="50" y="145" width="170" height="92" rx="18" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="135" y="181" text-anchor="middle" font-size="21" font-weight="700" fill="#725923">Client</text>
    <text x="135" y="211" text-anchor="middle" font-size="16" fill="#554d42">TCP / RESP</text>
    <path d="M228 191H296" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="305" y="128" width="238" height="126" rx="20" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="424" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#295279">网络 I/O</text>
    <text x="424" y="199" text-anchor="middle" font-size="16" fill="#2b2620">读 Socket · 解析 RESP</text>
    <text x="424" y="226" text-anchor="middle" font-size="15" fill="#6f6659">可由 I/O 线程分担</text>
    <path d="M551 191H618" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="627" y="128" width="234" height="126" rx="20" fill="#dee3d6" stroke="#466b48" stroke-width="3"/>
    <text x="744" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#466b48">核心命令路径</text>
    <text x="744" y="199" text-anchor="middle" font-size="16" fill="#2b2620">查 Key · 执行命令</text>
    <text x="744" y="226" text-anchor="middle" font-size="15" fill="#943b37">慢操作会阻塞后续命令</text>
    <path d="M869 191H936" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="945" y="128" width="105" height="126" rx="20" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="997" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#295279">回复</text>
    <text x="997" y="205" text-anchor="middle" font-size="15" fill="#554d42">编码</text>
    <text x="997" y="228" text-anchor="middle" font-size="15" fill="#554d42">写 Socket</text>

    <path d="M744 263V329" stroke="#466b48" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="764" y="304" font-size="15" fill="#466b48">下放可后台处理的工作</text>

    <rect x="50" y="347" width="310" height="174" rx="20" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
    <text x="205" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#5e5083">后台线程</text>
    <text x="83" y="426" font-size="17" fill="#2b2620">• 惰性释放 / UNLINK</text>
    <text x="83" y="457" font-size="17" fill="#2b2620">• AOF fsync 等慢 I/O</text>
    <text x="83" y="488" font-size="17" fill="#2b2620">• 部分内部维护任务</text>

    <rect x="395" y="347" width="310" height="174" rx="20" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="550" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#725923">持久化子进程</text>
    <text x="428" y="426" font-size="17" fill="#2b2620">• BGSAVE 写 RDB</text>
    <text x="428" y="457" font-size="17" fill="#2b2620">• AOF Rewrite</text>
    <text x="428" y="488" font-size="17" fill="#943b37">• fork 本身仍会暂停父进程</text>

    <rect x="740" y="347" width="310" height="174" rx="20" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="895" y="388" text-anchor="middle" font-size="22" font-weight="700" fill="#554d42">操作系统</text>
    <text x="773" y="426" font-size="17" fill="#2b2620">• CPU 调度 / NUMA</text>
    <text x="773" y="457" font-size="17" fill="#2b2620">• 内存页 / Swap / COW</text>
    <text x="773" y="488" font-size="17" fill="#2b2620">• 网卡、磁盘与文件系统</text>

    <rect x="50" y="558" width="1000" height="54" rx="14" fill="#eed9d3"/>
    <text x="550" y="592" text-anchor="middle" font-size="18" fill="#943b37">低延迟要求核心命令路径持续短小；辅助线程无法替慢命令并行解围。</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b48"/></marker>
  </defs>
</svg>
