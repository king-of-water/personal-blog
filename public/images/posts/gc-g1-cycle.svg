<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 0 780 455" role="img" aria-labelledby="title desc"><title id="title">G1：先得到存活信息，再分批释放老年代区域</title><desc id="desc">年轻代回收阶段通过 Concurrent Start 启动并发标记，随后 Remark、Cleanup 确定信息并进入 Mixed 回收。疏散失败且不能维持分配时可能进入 Full GC。该图省略中间继续发生的 Young GC。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="455" fill="#fdfaf3"/><text x="24" y="34" text-anchor="start" font-size="22" fill="#2b2620">G1：先得到存活信息，再分批释放老年代区域</text><rect x="24" y="75" width="213" height="68" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="130.5" y="103" text-anchor="middle" font-size="19" fill="#2b2620">Young GC</text><text x="130.5" y="127" text-anchor="middle" font-size="19" fill="#2b2620">STW：疏散年轻代</text><rect x="285" y="75" width="213" height="68" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="391.5" y="103" text-anchor="middle" font-size="19" fill="#2b2620">Concurrent Start</text><text x="391.5" y="127" text-anchor="middle" font-size="19" fill="#2b2620">STW：启动标记</text><rect x="546" y="75" width="210" height="68" rx="6" fill="#d8dee0" stroke="#295279"/><text x="651" y="103" text-anchor="middle" font-size="19" fill="#2b2620">并发标记</text><text x="651" y="127" text-anchor="middle" font-size="19" fill="#2b2620">业务线程继续执行</text><path d="M237,109 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M498,109 H546" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M651,143 V221" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="546" y="221" width="210" height="68" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="651" y="249" text-anchor="middle" font-size="19" fill="#2b2620">Remark / Cleanup</text><text x="651" y="273" text-anchor="middle" font-size="19" fill="#2b2620">确定存活与候选区</text><rect x="285" y="221" width="213" height="68" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="391.5" y="249" text-anchor="middle" font-size="19" fill="#2b2620">多次 Mixed GC</text><text x="391.5" y="273" text-anchor="middle" font-size="19" fill="#2b2620">STW：年轻代 + 部分 Old</text><path d="M546,255 H498" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M285,255 H130 V143" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="143" y="213" text-anchor="middle" font-size="17" fill="#2b2620">本轮回收完成</text><path d="M391,289 V344" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="285" y="344" width="213" height="60" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="391.5" y="368" text-anchor="middle" font-size="19" fill="#2b2620">可能 Full GC</text><text x="391.5" y="392" text-anchor="middle" font-size="19" fill="#2b2620">STW：整堆整理</text><text x="527" y="329" text-anchor="middle" font-size="17" fill="#2b2620">疏散失败且空间仍不足</text><text x="24" y="435" text-anchor="start" font-size="17" fill="#2b2620">简化周期：并发标记期间仍可发生 Young GC；暂停目标不是硬上限。</text></svg>
