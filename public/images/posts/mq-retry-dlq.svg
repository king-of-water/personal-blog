<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc"><title id="title">死信隔离之后仍有恢复责任</title><desc id="desc">任务自动重试结束后被隔离，诊断确认既有副作用，修复后按原身份受控重放，并通过业务对账检查终态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="420" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">死信隔离之后仍有恢复责任</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">进入持久隔离</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">保留原文与失败证据</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">诊断与查询</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">是否已产生副作用</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">修复输入或程序</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">明确允许重放范围</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="245" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="276" font-size="19" text-anchor="middle" fill="#2b2620">受控重放</text><text x="650" y="301" font-size="19" text-anchor="middle" fill="#2b2620">保留键，限制恢复速率</text><rect x="284" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="276" font-size="19" text-anchor="middle" fill="#2b2620">观察业务终态</text><text x="389" y="301" font-size="19" text-anchor="middle" fill="#2b2620">重复不能再次生效</text><rect x="24" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="276" font-size="19" text-anchor="middle" fill="#2b2620">对账或人工结案</text><text x="129" y="301" font-size="19" text-anchor="middle" fill="#2b2620">队列清空不等于完成</text><path d="M650,155 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,282 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,282 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="388" font-size="18" text-anchor="start" fill="#2b2620">保留期限、容量、负责人和批次暂停能力都属于恢复方案。</text></svg>
