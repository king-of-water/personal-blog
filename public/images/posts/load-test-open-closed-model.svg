<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">闭环与开环压测模型的差异</title>
  <desc id="desc">闭环模型等待响应后才发送下一次请求，系统变慢会降低到达率；开环模型按计划时刻产生请求，系统变慢会形成排队并暴露真实过载。</desc>
  <rect width="1200" height="650" rx="32" fill="#fdfaf3"/>
  <text x="70" y="68" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2b2620">系统变慢时，负载模型会做什么？</text>
  <text x="70" y="103" font-family="system-ui, sans-serif" font-size="17" fill="#8a7f6d">同样写着“100 个并发”，可能测到完全不同的过载行为</text>

  <g font-family="system-ui, sans-serif">
    <rect x="70" y="140" width="505" height="442" rx="24" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/>
    <text x="104" y="184" font-size="24" font-weight="700" fill="#8a6b12">闭环：响应驱动下一次发送</text>
    <text x="104" y="214" font-size="16" fill="#2b2620">请求慢下来，生成器也跟着慢下来</text>

    <rect x="112" y="260" width="130" height="62" rx="14" fill="#ffffff" stroke="#8a6b12" stroke-width="2"/>
    <text x="177" y="297" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">虚拟用户</text>
    <path d="M242 291h92" stroke="#8a6b12" stroke-width="4"/>
    <path d="M324 282l12 9-12 9" fill="none" stroke="#8a6b12" stroke-width="4"/>
    <rect x="336" y="260" width="168" height="62" rx="14" fill="#ffffff" stroke="#8a6b12" stroke-width="2"/>
    <text x="420" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">被测系统</text>
    <text x="420" y="308" text-anchor="middle" font-size="14" fill="#8a7f6d">响应 2 秒</text>
    <path d="M420 322v60H177v-60" fill="none" stroke="#8a6b12" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="299" y="374" text-anchor="middle" font-size="14" fill="#8a7f6d">等响应返回后再发</text>

    <rect x="104" y="428" width="437" height="105" rx="16" fill="#ffffff"/>
    <text x="128" y="460" font-size="16" font-weight="700" fill="#943b37">过载时的偏差</text>
    <text x="128" y="488" font-size="15" fill="#2b2620">系统越慢 → 实际到达率越低</text>
    <text x="128" y="513" font-size="15" fill="#2b2620">未发送的请求没有进入延迟分布</text>

    <rect x="625" y="140" width="505" height="442" rx="24" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="659" y="184" font-size="24" font-weight="700" fill="#295279">开环：时间驱动请求到达</text>
    <text x="659" y="214" font-size="16" fill="#2b2620">按计划速率发送，不等上一条完成</text>

    <rect x="661" y="260" width="130" height="62" rx="14" fill="#ffffff" stroke="#295279" stroke-width="2"/>
    <text x="726" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2620">到达时钟</text>
    <text x="726" y="308" text-anchor="middle" font-size="14" fill="#8a7f6d">每 10 ms</text>
    <path d="M791 291h60" stroke="#295279" stroke-width="4"/>
    <path d="M841 282l12 9-12 9" fill="none" stroke="#295279" stroke-width="4"/>
    <rect x="853" y="260" width="92" height="62" rx="14" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/>
    <text x="899" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6b12">队列</text>
    <text x="899" y="308" text-anchor="middle" font-size="14" fill="#943b37">增长</text>
    <path d="M945 291h45" stroke="#295279" stroke-width="4"/>
    <path d="M980 282l12 9-12 9" fill="none" stroke="#295279" stroke-width="4"/>
    <rect x="992" y="260" width="106" height="62" rx="14" fill="#ffffff" stroke="#295279" stroke-width="2"/>
    <text x="1045" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2620">系统</text>
    <text x="1045" y="308" text-anchor="middle" font-size="14" fill="#8a7f6d">响应 2 秒</text>

    <rect x="659" y="428" width="437" height="105" rx="16" fill="#ffffff"/>
    <text x="683" y="460" font-size="16" font-weight="700" fill="#466b48">过载时能看到</text>
    <text x="683" y="488" font-size="15" fill="#2b2620">排队、超时与拒绝仍按外部速率出现</text>
    <text x="683" y="513" font-size="15" fill="#2b2620">调度滞后与 dropped iterations 也要计数</text>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#8a7f6d">模型没有高下之分：选择取决于真实请求是否会等待上一次响应</text>
</svg>
