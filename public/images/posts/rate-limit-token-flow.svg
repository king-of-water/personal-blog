<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img"><title>令牌桶：按时间补额度，按请求花额度</title><desc>桶容量 20，每秒补 100。0.990 秒花完 20 份；20 毫秒后只补回 2 份。请求先补额度，再判断和扣除。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#d8dee0;stroke:#295279;stroke-width:1.5}.no{fill:#eed9d3;stroke:#943b37;stroke-width:1.5}</style><rect width="960" height="740" fill="#fdfaf3"/><text x="480" y="46" class="title">令牌桶：空闲能攒额度，但最多攒 20 份</text><text x="250" y="97" class="">补充速度：100 份 / 秒</text><path class="line" d="M250 110 V145"/><path d="M110 145 V300 H390 V145" fill="#d8dee0" stroke="#295279" stroke-width="3"/><text x="250" y="185" class="">桶容量 B = 20</text><text x="250" y="235" class="small">● ● ● ● ●</text><text x="250" y="280" class="small">桶满后不再累积</text><path class="line" d="M390 240 H525"/><rect x="535" y="190" width="355" height="60" rx="10" class="box"/><text x="712.5" y="228" class="">0.990 秒：100 次到达</text><text x="715" y="280" class="small">放行 20 次，拒绝 80 次</text><rect x="65" y="345" width="830" height="60" rx="10" class="ok"/><text x="480" y="383" class="">1.010 秒：经过 0.020 秒 → 补回 2 份 → 第二批放行 2 次</text><rect x="285" y="440" width="390" height="60" rx="10" class="box"/><text x="480" y="478" class="">按时间补充，最多补到容量</text><path class="line" d="M480 405 V440"/><path class="line" d="M480 500 V525"/><rect x="285" y="525" width="390" height="60" rx="10" class="box"/><text x="480" y="563" class="">余额 ≥ 本次请求成本？</text><path class="line" d="M285 555 H165 V625"/><text x="220" y="542" class="small">否</text><rect x="35" y="625" width="320" height="60" rx="10" class="no"/><text x="195" y="663" class="">保存余额与时间，拒绝</text><path class="line" d="M675 555 H795 V625"/><text x="740" y="542" class="small">是</text><rect x="605" y="625" width="320" height="60" rx="10" class="ok"/><text x="765" y="663" class="">扣额度并保存状态，放行</text><text x="480" y="718" class="small">整段补充、判断、扣除需原子执行；本图采用无额度即拒绝的版本</text></svg>
