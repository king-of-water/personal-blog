<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">令牌桶：桶里装的是可消费的额度</title><desc id="desc">三个桶展示初始二十个令牌、第一批请求取走全部令牌后的空桶、二十毫秒后补回两个令牌。每个圆币是一份额度，每个请求取一个；没有令牌的请求被拒绝。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5b5245" stroke-width="1.7"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;text-anchor:middle;font-size:23px}.title{font-size:34px;font-weight:650}.sub{font-size:21px;fill:#554d42}.small{font-size:19px}.num{font-size:27px;font-weight:600}.line{fill:none;stroke:#5b5245;stroke-width:2.5;marker-end:url(#arrow)}.rule{fill:none;stroke:#8a7f6d;stroke-width:2}.req{fill:#d8dee0;stroke:#295279;stroke-width:2}.reject{fill:#eed9d3;stroke:#943b37;stroke-width:2}</style>
<rect width="1200" height="760" fill="#fdfaf3"/>
<text x="600" y="57" class="title">令牌桶：往桶里补令牌，请求来了取一枚</text>
<text x="600" y="98" class="sub">桶装的是额度，不是排队的请求；一枚令牌允许一个请求通过</text>
<text x="230" y="167" class="">① 初始满桶：20 枚</text>
<path d="M110 240 L142 477 Q230 523 318 477 L350 240" fill="#f5f0e4" stroke="#5b5245" stroke-width="4"/>
<ellipse cx="230" cy="240" rx="120" ry="21" fill="#fdfaf3" stroke="#5b5245" stroke-width="3"/>
<path d="M108 280 Q20 395 128 443" fill="none" stroke="#8a7f6d" stroke-width="3"/>
<circle cx="160" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="160" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="195" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="195" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="230" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="230" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="265" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="265" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="300" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="300" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="160" cy="392" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="160" cy="392" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="195" cy="392" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="195" cy="392" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="230" cy="392" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="230" cy="392" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="265" cy="392" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="265" cy="392" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="300" cy="392" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="300" cy="392" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="160" cy="354" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="160" cy="354" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="195" cy="354" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="195" cy="354" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="230" cy="354" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="230" cy="354" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="265" cy="354" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="265" cy="354" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="300" cy="354" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="300" cy="354" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="160" cy="316" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="160" cy="316" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="195" cy="316" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="195" cy="316" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="230" cy="316" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="230" cy="316" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="265" cy="316" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="265" cy="316" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="300" cy="316" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="300" cy="316" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><text x="230" y="550" class="small">100 次到达，20 次拿到令牌</text>
<text x="600" y="167" class="">② 第一批取完：0 枚</text>
<path d="M480 240 L512 477 Q600 523 688 477 L720 240" fill="#f5f0e4" stroke="#5b5245" stroke-width="4"/>
<ellipse cx="600" cy="240" rx="120" ry="21" fill="#fdfaf3" stroke="#5b5245" stroke-width="3"/>
<path d="M478 280 Q390 395 498 443" fill="none" stroke="#8a7f6d" stroke-width="3"/>
<text x="600" y="550" class="small">桶空了，其余 80 次被拒绝</text>
<text x="970" y="167" class="">③ 20 ms 后：补回 2 枚</text>
<path d="M850 240 L882 477 Q970 523 1058 477 L1090 240" fill="#f5f0e4" stroke="#5b5245" stroke-width="4"/>
<ellipse cx="970" cy="240" rx="120" ry="21" fill="#fdfaf3" stroke="#5b5245" stroke-width="3"/>
<path d="M848 280 Q760 395 868 443" fill="none" stroke="#8a7f6d" stroke-width="3"/>
<circle cx="900" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="900" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="935" cy="430" r="15" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="935" cy="430" r="10" fill="none" stroke="#8a6b12" stroke-width="1"/><text x="970" y="550" class="small">第二批只能再通过 2 次</text>
<path d="M367 352 H445" class="line"/>
<text x="405" y="320" class="small">取走</text>
<path d="M738 352 H818" class="line"/>
<text x="775" y="320" class="small">补充</text>
<path d="M925 195 H970 V213" fill="none" stroke="#5b5245" stroke-width="8" stroke-linecap="round"/><circle cx="970" cy="227" r="10" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="970" cy="227" r="5" fill="none" stroke="#8a6b12" stroke-width="1"/><text x="1030" y="208" class="small">100 枚 / 秒</text>
<path d="M270 598 H345" class="line"/>
<circle cx="310" cy="598" r="13" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="310" cy="598" r="8" fill="none" stroke="#8a6b12" stroke-width="1"/><g><rect x="365" y="583" width="30" height="22" rx="4" class="req"/><path d="M371 590 h18 M371 597 h12" stroke="#295279" stroke-width="1.5"/></g>
<text x="250" y="648" class="small">取一枚 → 通过一个请求</text>
<g><rect x="585" y="588" width="30" height="22" rx="4" class="reject"/><path d="M591 595 h18 M591 602 h12" stroke="#943b37" stroke-width="1.5"/></g>
<path d="M565 575 L635 625 M635 575 L565 625" stroke="#943b37" stroke-width="3"/><text x="600" y="648" class="small">没有令牌 → 拒绝</text>
<circle cx="948" cy="600" r="13" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="948" cy="600" r="8" fill="none" stroke="#8a6b12" stroke-width="1"/><circle cx="982" cy="600" r="13" fill="#f4eace" stroke="#8a6b12" stroke-width="2"/><circle cx="982" cy="600" r="8" fill="none" stroke="#8a6b12" stroke-width="1"/><path d="M1005 600 H1080" class="line"/>
<g><rect x="1090" y="577" width="30" height="22" rx="4" class="req"/><path d="M1096 584 h18 M1096 591 h12" stroke="#295279" stroke-width="1.5"/></g>
<g><rect x="1090" y="607" width="30" height="22" rx="4" class="req"/><path d="M1096 614 h18 M1096 621 h12" stroke="#295279" stroke-width="1.5"/></g>
<text x="1000" y="648" class="small">补回多少，就能再取多少</text>
<text x="600" y="720" class="sub">容量 20：空闲再久也只存 20 枚；补充速度 100 / 秒：控制持续放行量</text>
</svg>
