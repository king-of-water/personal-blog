<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">RPO、RTO 与故障恢复时间线</title>
  <desc id="desc">故障发生在十二点，最近可恢复数据点在十一点五十五分，服务在十二点二十分恢复，因此实际 RPO 为五分钟，实际 RTO 为二十分钟。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a7f6d"/></marker></defs>
  <rect width="1440" height="760" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="70" y="68" fill="#2b2620" font-size="34" font-weight="700">RPO 衡量数据缺口，RTO 衡量服务中断</text>
    <text x="70" y="108" fill="#6f6659" font-size="20">两个目标独立：复制很新不代表恢复很快，启动很快也不代表数据完整</text>
    <path d="M130 390 H1310" fill="none" stroke="#8a7f6d" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="390" y1="330" x2="390" y2="450" stroke="#295279" stroke-width="4"/>
    <line x1="650" y1="300" x2="650" y2="470" stroke="#943b37" stroke-width="5"/>
    <line x1="1160" y1="330" x2="1160" y2="450" stroke="#466b48" stroke-width="4"/>
    <text x="390" y="292" text-anchor="middle" fill="#295279" font-size="22" font-weight="700">最近恢复点</text>
    <text x="390" y="487" text-anchor="middle" fill="#554d42" font-size="18">11:55</text>
    <text x="650" y="260" text-anchor="middle" fill="#943b37" font-size="23" font-weight="700">故障发生</text>
    <text x="650" y="505" text-anchor="middle" fill="#554d42" font-size="18">12:00</text>
    <text x="1160" y="292" text-anchor="middle" fill="#466b48" font-size="22" font-weight="700">服务恢复</text>
    <text x="1160" y="487" text-anchor="middle" fill="#554d42" font-size="18">12:20</text>

    <rect x="390" y="545" width="260" height="95" rx="16" fill="#d8dee0" stroke="#295279" stroke-width="3"/>
    <text x="520" y="584" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">实际 RPO = 5 分钟</text>
    <text x="520" y="615" text-anchor="middle" fill="#554d42" font-size="16">潜在数据缺口</text>
    <rect x="650" y="545" width="510" height="95" rx="16" fill="#dee3d6" stroke="#466b48" stroke-width="3"/>
    <text x="905" y="584" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">实际 RTO = 20 分钟</text>
    <text x="905" y="615" text-anchor="middle" fill="#554d42" font-size="16">检测、隔离、提升、校验与切流总耗时</text>
    <path d="M390 365 H650" fill="none" stroke="#295279" stroke-width="10"/>
    <path d="M650 415 H1160" fill="none" stroke="#466b48" stroke-width="10"/>
    <text x="520" y="345" text-anchor="middle" fill="#295279" font-size="16">数据窗口</text>
    <text x="905" y="448" text-anchor="middle" fill="#466b48" font-size="16">恢复窗口</text>
    <rect x="125" y="680" width="1190" height="44" rx="11" fill="#f5f0e4"/>
    <text x="150" y="709" fill="#554d42" font-size="17">目标值要按业务能力定义，并用端到端演练测得实际值。</text>
  </g>
</svg>
