<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">任务实例从创建到接管、重试和完成的状态机</title>
  <desc id="desc">任务从 READY 被 Worker 领取进入 RUNNING，成功后完成，明确失败进入重试，结果未知进入查询，租约过期则由新 Worker 以更高 token 接管。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a7f6d"/></marker>
    <marker id="good" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#466b48"/></marker>
    <marker id="bad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#943b37"/></marker>
  </defs>
  <rect width="1440" height="820" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="70" y="68" fill="#2b2620" font-size="34" font-weight="700">任务状态记录执行证据，租约只决定当前资格</text>
    <text x="70" y="108" fill="#6f6659" font-size="20">超时、结果未知和租约过期是三条不同的恢复路径</text>

    <rect x="95" y="305" width="190" height="100" rx="16" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="2"/>
    <text x="190" y="365" text-anchor="middle" fill="#2b2620" font-size="23" font-weight="700">READY</text>
    <rect x="430" y="280" width="260" height="150" rx="18" fill="#d8dee0" stroke="#295279" stroke-width="3"/>
    <text x="560" y="335" text-anchor="middle" fill="#2b2620" font-size="24" font-weight="700">RUNNING</text>
    <text x="560" y="373" text-anchor="middle" fill="#554d42" font-size="17">owner=A · token=41</text>
    <text x="560" y="402" text-anchor="middle" fill="#295279" font-size="15">持续续期</text>
    <rect x="895" y="145" width="220" height="105" rx="16" fill="#dee3d6" stroke="#466b48" stroke-width="3"/>
    <text x="1005" y="207" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">SUCCEEDED</text>
    <rect x="895" y="315" width="220" height="105" rx="16" fill="#f4eace" stroke="#8a6b12" stroke-width="3"/>
    <text x="1005" y="377" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">RETRY</text>
    <rect x="895" y="485" width="220" height="105" rx="16" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
    <text x="1005" y="547" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">UNKNOWN</text>
    <rect x="1210" y="315" width="170" height="105" rx="16" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
    <text x="1295" y="377" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">DEAD</text>

    <path d="M285 355 H415" fill="none" stroke="#8a7f6d" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="350" y="335" text-anchor="middle" fill="#6f6659" font-size="15">CAS 领取</text>
    <path d="M690 320 Q790 200 880 198" fill="none" stroke="#466b48" stroke-width="4" marker-end="url(#good)"/>
    <text x="790" y="220" fill="#466b48" font-size="15">完成证据齐全</text>
    <path d="M690 355 H880" fill="none" stroke="#8a6b12" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="785" y="335" text-anchor="middle" fill="#8a6b12" font-size="15">明确可重试失败</text>
    <path d="M690 395 Q790 535 880 537" fill="none" stroke="#943b37" stroke-width="4" marker-end="url(#bad)"/>
    <text x="782" y="520" fill="#943b37" font-size="15">调用结果未知</text>
    <path d="M895 390 Q770 505 640 445" fill="none" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="740" y="490" fill="#6f6659" font-size="15">退避后重新领取</text>
    <path d="M895 555 Q760 675 620 445" fill="none" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="720" y="655" fill="#6f6659" font-size="15">查询结果或幂等重试</text>
    <path d="M1115 367 H1195" fill="none" stroke="#943b37" stroke-width="3" marker-end="url(#bad)"/>
    <text x="1155" y="347" text-anchor="middle" fill="#943b37" font-size="14">超限</text>

    <path d="M560 280 V185 Q560 150 525 150 H345 Q310 150 310 185 V285" fill="none" stroke="#943b37" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#bad)"/>
    <text x="435" y="135" text-anchor="middle" fill="#943b37" font-size="16">租约过期，新的 owner 以 token=42 接管</text>
    <rect x="125" y="720" width="1190" height="48" rx="11" fill="#f5f0e4"/>
    <text x="150" y="751" fill="#554d42" font-size="17">所有完成更新都校验 owner 与 token；旧 Worker 不能覆盖接管者写入的终态。</text>
  </g>
</svg>
