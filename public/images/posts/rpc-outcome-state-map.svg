<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">RPC 调用的观察状态与远端事实</title>
  <desc id="desc">客户端从未发送、收到明确响应、或响应缺失三种观察，对应服务端未执行、拒绝、执行中、已提交但响应丢失等事实；响应缺失时必须按业务键查询。</desc>
  <style>.bg{fill:#f7f7f3}.p{fill:#fff;stroke:#d5ddd6;stroke-width:2}.g{fill:#17684f}.soft{fill:#e7f1eb}.warm{fill:#f4eee1}.h{font:700 28px Arial,'PingFang SC',sans-serif;fill:#1d2823}.t{font:700 20px Arial,'PingFang SC',sans-serif;fill:#233129}.b{font:500 17px Arial,'PingFang SC',sans-serif;fill:#46534c}.s{font:500 15px Arial,'PingFang SC',sans-serif;fill:#617067}.l{stroke:#53635a;stroke-width:3;fill:none}.d{stroke:#8b9990;stroke-width:3;stroke-dasharray:9 8;fill:none}</style>
  <rect class="bg" width="1440" height="650"/><text x="70" y="62" class="h">客户端看到的错误，不能直接证明服务端发生了什么</text><text x="70" y="96" class="s">先区分观察，再用业务键查询权威事实。</text>
  <rect x="70" y="145" width="290" height="105" rx="14" class="p"/><text x="98" y="186" class="t">观察 A：确认未发送</text><text x="98" y="219" class="b">本地校验失败、未取到地址</text>
  <rect x="575" y="145" width="290" height="105" rx="14" class="soft" stroke="#a9c7b5" stroke-width="2"/><text x="603" y="186" class="t">观察 B：收到明确响应</text><text x="603" y="219" class="b">成功或应用返回业务拒绝</text>
  <rect x="1080" y="145" width="290" height="105" rx="14" class="warm" stroke="#dfcfae" stroke-width="2"/><text x="1108" y="186" class="t">观察 C：响应缺失</text><text x="1108" y="219" class="b">超时、断连、代理失败</text>
  <path d="M215 250 V325" class="l"/><path d="M720 250 V325" class="l"/><path d="M1225 250 V325" class="l"/>
  <rect x="70" y="335" width="290" height="118" rx="14" class="p"/><text x="98" y="377" class="t">事实：未执行</text><text x="98" y="410" class="b">在 deadline 内可以重新尝试</text>
  <rect x="575" y="335" width="290" height="118" rx="14" class="p"/><text x="603" y="377" class="t">事实：已有确定终态</text><text x="603" y="410" class="b">保存结果或处理拒绝原因</text>
  <rect x="970" y="320" width="400" height="155" rx="14" class="p"/><text x="998" y="362" class="t">事实集合：UNKNOWN</text><text x="998" y="398" class="b">未到达 / 执行中 / 已回滚</text><text x="998" y="430" class="b">已提交但响应丢失</text>
  <path d="M1170 475 V535 H720" class="d"/><path d="M732 525 l-18 10 18 10" fill="#8b9990"/>
  <rect x="475" y="520" width="490" height="82" rx="13" class="g"/><text x="510" y="555" style="font:700 19px Arial,'PingFang SC',sans-serif;fill:#fff">用同一 idempotency key 查询权威业务状态</text><text x="510" y="582" style="font:500 15px Arial,'PingFang SC',sans-serif;fill:#fff">不要换键盲目重放；无法确认时进入对账</text>
</svg>
