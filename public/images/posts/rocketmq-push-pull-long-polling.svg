<svg xmlns="http://www.w3.org/2000/svg" width="780" height="385" viewBox="0 0 780 385" role="img" aria-labelledby="title desc"><title id="title">4.x Remoting：长轮询在消息可读时响应</title><desc id="desc">消费者发出拉取请求，没有匹配消息时 Broker 挂起请求，消息可读或等待期限结束后再次检查并返回。可读不等于完成物理刷盘，5.x 消费模型另行区分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="385" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">4.x Remoting：长轮询在消息可读时响应</text><rect x="24" y="80" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">客户端发起 PULL</text><text x="129" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">带位点与等待参数</text><rect x="284" y="80" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">Broker 检查</text><text x="389" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">是否有匹配消息</text><rect x="544" y="80" width="212" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="650" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">有消息</text><text x="650" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">响应拉取请求</text><path d="M234,120 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,120 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="284" y="242" width="210" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="389" y="275.5" font-size="19" text-anchor="middle" fill="#2b2620">无消息：挂起请求</text><text x="389" y="300.5" font-size="19" text-anchor="middle" fill="#2b2620">不阻塞专属业务线程</text><path d="M389,160 V242" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,282 H650 V160" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="650" y="225" font-size="17" text-anchor="middle" fill="#2b2620">可读 / 等待到期</text><text x="24" y="366" font-size="18" text-anchor="start" fill="#2b2620">长轮询降低空查询；背压还需要 SDK 阈值与业务并发限制。</text></svg>
