<svg xmlns="http://www.w3.org/2000/svg" width="780" height="245" viewBox="0 0 780 245" role="img" aria-labelledby="title desc"><title id="title">先走一遍：打开商品页的四步</title><desc id="desc">浏览器先取得域名对应的地址，再建立 TCP 和 TLS 通道，发送 HTTP 请求并取得内容，最后解析、加载后续资源并显示页面。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="245" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先走一遍：打开商品页的四步</text><rect x="20" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="105" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">① 找到地址</text><text x="105" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">DNS 返回入口地址</text><rect x="210" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="295" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">② 建立安全通道</text><text x="295" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">TCP 建连、TLS 验证</text><rect x="400" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="485" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">③ 交换页面消息</text><text x="485" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">HTTP 请求与响应</text><rect x="590" y="80" width="170" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="675" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">④ 显示商品页</text><text x="675" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">解析、加载和绘制</text><path d="M190 120 H210" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M380 120 H400" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M570 120 H590" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="208" font-size="17" text-anchor="middle" fill="#2b2620">这里先看首次访问；缓存与连接复用放到后面展开。</text></svg>
