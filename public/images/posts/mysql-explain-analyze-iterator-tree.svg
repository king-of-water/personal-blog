<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">EXPLAIN ANALYZE 迭代器树与 loops 放大关系</title>
  <desc id="desc">订单范围扫描实际返回五万九千行，使订单明细索引查找执行五万九千次，连接结果扩大到二十三万六千行，再进入聚合、排序与限制节点。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b5245"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2620; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2620; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #554d42; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6f6659; }
      .box { fill: #f5f0e4; stroke: #8a7f6d; stroke-width: 2; rx: 12; }
      .accent { fill: #d8dee0; stroke: #295279; stroke-width: 2; rx: 12; }
      .warn { fill: #f4eace; stroke: #8a7f6d; stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #5b5245; stroke-width: 2.4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #a8433f; stroke-width: 2.4; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .red { fill: #943b37; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fdfaf3"/>
  <text x="60" y="58" class="title">一次小查询怎样被 loops 放大</text>
  <text x="60" y="90" class="small">从底部叶子向上读；rows 是平均每次循环的输出，loops 是执行次数</text>

  <rect x="445" y="120" width="310" height="82" class="box"/>
  <text x="600" y="153" text-anchor="middle" class="label">LIMIT 20 + Top-N 排序</text>
  <text x="600" y="181" text-anchor="middle" class="body">最终返回 20 行</text>

  <rect x="445" y="250" width="310" height="82" class="box"/>
  <text x="600" y="283" text-anchor="middle" class="label">按 user_id 聚合</text>
  <text x="600" y="311" text-anchor="middle" class="body">输出 18,420 个用户</text>

  <rect x="445" y="380" width="310" height="92" class="accent"/>
  <text x="600" y="413" text-anchor="middle" class="label">Nested-Loop Join</text>
  <text x="600" y="442" text-anchor="middle" class="body">实际输出 236,000 行</text>
  <text x="600" y="463" text-anchor="middle" class="red">预计只有 9,600 行</text>

  <rect x="90" y="560" width="390" height="105" class="warn"/>
  <text x="285" y="596" text-anchor="middle" class="label">orders 范围扫描</text>
  <text x="285" y="626" text-anchor="middle" class="body">actual rows = 59,000 · loops = 1</text>
  <text x="285" y="651" text-anchor="middle" class="red">estimated rows = 3,200</text>

  <rect x="720" y="560" width="390" height="105" class="box"/>
  <text x="915" y="596" text-anchor="middle" class="label">order_items 索引查找</text>
  <text x="915" y="626" text-anchor="middle" class="body">actual rows = 4 · loops = 59,000</text>
  <text x="915" y="651" text-anchor="middle" class="body">单次很快，累计工作仍然很大</text>

  <path d="M600 250 V214" class="arrow"/>
  <path d="M600 380 V344" class="arrow"/>
  <path d="M285 560 C330 520 415 490 510 472" class="arrow"/>
  <path d="M915 560 C870 520 785 490 690 472" class="arrow"/>
  <path d="M480 612 C585 684 715 684 720 612" class="loop"/>
  <text x="600" y="698" text-anchor="middle" class="red">每个外层订单触发一次内层查找：59,000 次</text>
</svg>
