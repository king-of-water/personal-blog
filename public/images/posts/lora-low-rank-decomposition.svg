<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 低秩矩阵分解：冻结权重 W 与可训练矩阵 B 和 A</title>
  <desc id="desc">左侧展示 Full Fine-tuning 直接更新完整权重矩阵 W（d×d），参数量巨大；右侧展示 LoRA 冻结 W，新增两个低秩矩阵 A（r×d）和 B（d×r），r 远小于 d，可训练参数从 d² 降至 2×d×r，推理时 ΔW=B×A 加回原始 W。</desc>
  <defs>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ink{fill:#2b2620}.muted{fill:#6f6659}.green{fill:#2f6f5f}.line{stroke:#8a7f6d;stroke-width:2}.box{fill:#fffdf8;stroke:#b9ae9c;stroke-width:2}.soft{fill:#f5f0e4}.accent{fill:#dfe9df}.blue{fill:#dce6ee}.warn{fill:#fef3ee}.frozen{fill:#ece8f8;stroke:#8a7aaa;stroke-width:2}.trainable{fill:#d4e8d4;stroke:#5a9a6a;stroke-width:2}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6659"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f5f"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#fdfaf3"/>

  <text x="90" y="70" class="mono green" font-size="17" font-weight="700" letter-spacing="3">LORA DECOMPOSITION</text>
  <text x="90" y="122" class="sans ink" font-size="40" font-weight="720">冻结大矩阵，只训练两个小矩阵</text>
  <text x="90" y="158" class="sans muted" font-size="19">LoRA 把 d×d 的权重更新拆成 d×r 和 r×d 两个低秩矩阵；r≪d，参数量从百万降到万级。</text>

  <!-- Left panel: Full FT -->
  <rect x="90" y="196" width="560" height="516" rx="18" class="warn" style="stroke:#c4836a;stroke-width:2"/>
  <text x="120" y="236" class="mono" font-size="14" font-weight="700" fill="#a04020">FULL FINE-TUNING</text>
  <text x="120" y="264" class="sans ink" font-size="22" font-weight="700">直接更新整个权重矩阵 W</text>

  <!-- W matrix visualization -->
  <rect x="150" y="290" width="220" height="220" rx="10" fill="#fde8de" stroke="#c4836a" stroke-width="2"/>
  <text x="260" y="395" class="mono ink" font-size="36" font-weight="700" text-anchor="middle" fill="#a04020">W</text>
  <text x="260" y="435" class="sans muted" font-size="15" text-anchor="middle">d × d</text>
  <text x="260" y="458" class="sans muted" font-size="13" text-anchor="middle">（如 4096 × 4096）</text>

  <!-- dimension labels -->
  <text x="148" y="283" class="mono muted" font-size="13" text-anchor="end">d</text>
  <line x1="150" y1="286" x2="370" y2="286" stroke="#c4836a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="374" y="408" class="mono muted" font-size="13">d</text>
  <line x1="372" y1="290" x2="372" y2="510" stroke="#c4836a" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="120" y="530" width="500" height="60" rx="10" fill="#fde8de" stroke="#c4836a" stroke-width="1.5"/>
  <text x="140" y="558" class="sans ink" font-size="16" font-weight="700" fill="#a04020">可训练参数：d × d</text>
  <text x="140" y="580" class="sans muted" font-size="14">4096 × 4096 = 16,777,216 个参数</text>

  <rect x="120" y="606" width="500" height="82" rx="10" class="soft"/>
  <text x="140" y="632" class="sans ink" font-size="15">梯度 + Adam 优化器：参数量 × 4 倍显存</text>
  <text x="140" y="656" class="sans muted" font-size="14">8B 模型仅参数+梯度+优化器已需 64–80 GB，</text>
  <text x="140" y="676" class="sans muted" font-size="14">70B 模型需 6–8 张 A100 并行训练。</text>

  <!-- Right panel: LoRA -->
  <rect x="790" y="196" width="560" height="516" rx="18" class="accent" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="820" y="236" class="mono" font-size="14" font-weight="700" fill="#2f6f5f">LORA</text>
  <text x="820" y="264" class="sans ink" font-size="22" font-weight="700">冻结 W，新增低秩矩阵 A 和 B</text>

  <!-- Frozen W -->
  <rect x="820" y="290" width="160" height="160" rx="10" class="frozen"/>
  <text x="900" y="362" class="mono ink" font-size="28" font-weight="700" text-anchor="middle" fill="#5a4a8a">W</text>
  <text x="900" y="392" class="sans muted" font-size="13" text-anchor="middle">冻结 d×d</text>
  <text x="820" y="465" class="mono" font-size="12" fill="#5a4a8a" text-anchor="middle">🔒 不计算梯度</text>

  <!-- Plus sign -->
  <text x="1000" y="378" class="sans ink" font-size="36" font-weight="700" text-anchor="middle">+</text>

  <!-- B matrix (tall and narrow) -->
  <rect x="1030" y="290" width="60" height="160" rx="8" class="trainable"/>
  <text x="1060" y="362" class="mono ink" font-size="22" font-weight="700" text-anchor="middle" fill="#2f6f5f">B</text>
  <text x="1060" y="386" class="sans muted" font-size="12" text-anchor="middle">d×r</text>
  <!-- dimension label r -->
  <text x="1060" y="282" class="mono" font-size="13" fill="#2f6f5f" text-anchor="middle">r</text>
  <line x1="1030" y1="285" x2="1090" y2="285" stroke="#5a9a6a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- × sign -->
  <text x="1112" y="378" class="sans ink" font-size="28" font-weight="400" text-anchor="middle">×</text>

  <!-- A matrix (short and wide) -->
  <rect x="1130" y="350" width="160" height="50" rx="8" class="trainable"/>
  <text x="1210" y="380" class="mono ink" font-size="22" font-weight="700" text-anchor="middle" fill="#2f6f5f">A</text>
  <text x="1210" y="430" class="sans muted" font-size="12" text-anchor="middle">r×d</text>
  <!-- dimension label d -->
  <text x="1302" y="378" class="mono" font-size="13" fill="#2f6f5f">d</text>

  <!-- LoRA legend -->
  <rect x="820" y="475" width="220" height="30" rx="6" class="trainable"/>
  <text x="930" y="495" class="sans ink" font-size="13" text-anchor="middle" fill="#2f6f5f">✓ 可训练（梯度更新）</text>
  <rect x="1055" y="475" width="200" height="30" rx="6" class="frozen"/>
  <text x="1155" y="495" class="sans ink" font-size="13" text-anchor="middle" fill="#5a4a8a">🔒 冻结（无梯度）</text>

  <rect x="820" y="530" width="500" height="60" rx="10" fill="#d4e8d4" stroke="#5a9a6a" stroke-width="1.5"/>
  <text x="840" y="558" class="sans ink" font-size="16" font-weight="700" fill="#2f6f5f">可训练参数：2 × d × r</text>
  <text x="840" y="580" class="sans muted" font-size="14">d=4096, r=8 → 65,536 个参数（约 Full FT 的 1/256）</text>

  <rect x="820" y="606" width="500" height="82" rx="10" class="soft"/>
  <text x="840" y="632" class="sans ink" font-size="15">前向传播：y = W·x + B·A·x</text>
  <text x="840" y="656" class="sans muted" font-size="14">初始时 B=0，A 随机初始化，ΔW=0，不改变原始输出。</text>
  <text x="840" y="676" class="sans muted" font-size="14">训练结束后 ΔW=B×A 可直接合并回 W，零推理开销。</text>

  <!-- Center arrow between panels -->
  <path d="M660 456 H780" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="666" y="430" width="108" height="28" rx="8" class="soft"/>
  <text x="720" y="449" class="sans muted" font-size="13" text-anchor="middle">参数降 100–1000×</text>
</svg>
