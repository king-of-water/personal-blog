<svg xmlns="http://www.w3.org/2000/svg" width="780" height="355" viewBox="0 0 780 355" role="img" aria-labelledby="title desc"><title id="title">引用链：key 变弱，不会让 value 同时变弱</title><desc id="desc">工作线程经由 ThreadLocalMap、Entry 数组和 Entry 强引用业务 value，Entry 弱引用 ThreadLocal key；key 有效和 key 失效都可能留下过期业务值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="355" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">引用链：key 变弱，不会让 value 同时变弱</text><rect x="25" y="83" width="155" height="70" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="102.5" y="125" text-anchor="middle" font-size="20" fill="#2b2620">工作线程</text><rect x="215" y="83" width="175" height="70" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="302.5" y="112.5" text-anchor="middle" font-size="20" fill="#2b2620">ThreadLocalMap</text><text x="302.5" y="137.5" text-anchor="middle" font-size="20" fill="#2b2620">Entry 数组</text><rect x="425" y="83" width="145" height="70" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="497.5" y="125" text-anchor="middle" font-size="20" fill="#2b2620">Entry</text><rect x="610" y="83" width="145" height="70" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="682.5" y="125" text-anchor="middle" font-size="20" fill="#2b2620">业务 value</text><path d="M180,118 H215" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M390,118 H425" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M570,118 H610" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="388" y="235" width="220" height="64" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="498" y="274" text-anchor="middle" font-size="20" fill="#2b2620">ThreadLocal key</text><path d="M497,153 V235" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="576" y="200" text-anchor="middle" font-size="18" fill="#2b2620">弱引用</text><text x="25" y="198" text-anchor="start" font-size="18" fill="#2b2620">实线：强引用</text><text x="25" y="333" text-anchor="start" font-size="18" fill="#2b2620">key 有效：业务主动结束绑定；key 失效：后续表操作可能清理。</text></svg>
