<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Function Calling、能力接入、执行能力和安全边界的四层关系</title>
  <desc id="desc">模型用 Function Calling 提出动作，Agent Runtime 校验并路由，随后通过直接 RPC、CLI 或 MCP 接入浏览器、代码执行和业务服务，权限、沙箱、审计与恢复贯穿执行过程。</desc>
  <rect width="1200" height="840" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2b2620" font-size="34" font-weight="700">Agent 工具系统不是一排并列名词</text>
    <text x="60" y="96" fill="#6f6659" font-size="17">从模型提出动作，到 Runtime 接入能力，再到受控执行</text>

    <text x="60" y="154" fill="#2f5d8a" font-size="13" font-weight="700" letter-spacing="2">01 模型动作协议</text>
    <rect x="60" y="170" width="1080" height="92" rx="15" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="88" y="207" fill="#2b2620" font-size="23" font-weight="700">Function Calling</text>
    <text x="88" y="237" fill="#554d42" font-size="16">模型返回 name + arguments + call_id，只提出动作，不执行外部操作</text>

    <path d="M600 262 V294" stroke="#5b5245" stroke-width="3"/>
    <path d="M600 294 l-8 -12 h16 z" fill="#5b5245"/>

    <text x="60" y="330" fill="#2f5d8a" font-size="13" font-weight="700" letter-spacing="2">02 AGENT RUNTIME</text>
    <rect x="60" y="346" width="1080" height="98" rx="15" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="88" y="384" fill="#2b2620" font-size="22" font-weight="700">Registry · Schema 校验 · Policy · Dispatcher</text>
    <text x="88" y="416" fill="#554d42" font-size="16">找到实现，检查身份和资源范围，选择 Adapter，管理超时、取消与 Tool Result</text>

    <path d="M600 444 V476" stroke="#5b5245" stroke-width="3"/>
    <path d="M600 476 l-8 -12 h16 z" fill="#5b5245"/>

    <text x="60" y="512" fill="#2f5d8a" font-size="13" font-weight="700" letter-spacing="2">03 能力接入方式</text>
    <rect x="60" y="528" width="334" height="112" rx="14" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="86" y="569" fill="#2b2620" font-size="21" font-weight="700">直接函数 / RPC</text>
    <text x="86" y="601" fill="#554d42" font-size="15">当前应用直接调用 SDK 或服务</text>
    <rect x="433" y="528" width="334" height="112" rx="14" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="459" y="569" fill="#2b2620" font-size="21" font-weight="700">CLI</text>
    <text x="459" y="601" fill="#554d42" font-size="15">argv · stdout · stderr · exit code</text>
    <rect x="806" y="528" width="334" height="112" rx="14" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="832" y="569" fill="#2b2620" font-size="21" font-weight="700">MCP</text>
    <text x="832" y="601" fill="#554d42" font-size="15">tools/list · tools/call · JSON Schema</text>

    <path d="M227 640 V672" stroke="#5b5245" stroke-width="2"/>
    <path d="M600 640 V672" stroke="#5b5245" stroke-width="2"/>
    <path d="M973 640 V672" stroke="#5b5245" stroke-width="2"/>

    <text x="60" y="704" fill="#2f5d8a" font-size="13" font-weight="700" letter-spacing="2">04 具体能力与执行环境</text>
    <rect x="60" y="720" width="1080" height="76" rx="14" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="92" y="752" fill="#2b2620" font-size="19" font-weight="700">业务 RPC · 浏览器 · 代码执行 · 文件系统 · 外部 SaaS</text>
    <text x="92" y="780" fill="#554d42" font-size="15">权限、审批、沙箱、凭据、审计、Artifact 与故障恢复围绕真实动作生效</text>

    <path d="M227 672 H973" stroke="#5b5245" stroke-width="2"/>
    <path d="M600 672 V710" stroke="#5b5245" stroke-width="3"/>
    <path d="M600 710 l-8 -12 h16 z" fill="#5b5245"/>
  </g>
</svg>
