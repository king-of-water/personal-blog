<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Pi 最小 Harness 分层</title><desc id="desc">模型接口、Agent Core、Coding Agent 和终端界面构成四层结构，工具结果回到 Agent Loop。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.dark{fill:#222825}.white{fill:#fff}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">MINIMUM HARNESS</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">Pi 把 Agent 拆成四层</text><text x="88" y="180" class="sans muted" font-size="21">每层只解决一类变化，工具结果沿同一条循环返回模型。</text>
  <g transform="translate(90 235)">
    <rect x="0" y="0" width="1260" height="110" rx="10" class="box"/><rect x="0" y="0" width="225" height="110" rx="10" class="accent"/><text x="28" y="44" class="mono green" font-size="17">04 INTERFACE</text><text x="28" y="76" class="sans ink" font-size="23" font-weight="700">pi-tui</text><text x="265" y="48" class="sans ink" font-size="25" font-weight="650">输入、流式渲染、状态展示</text><text x="265" y="80" class="sans muted" font-size="18">界面消费事件，不拥有 Agent Loop</text>
    <path d="M630 110V145" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="0" y="150" width="1260" height="110" rx="10" class="box"/><rect x="0" y="150" width="225" height="110" rx="10" class="accent"/><text x="28" y="194" class="mono green" font-size="17">03 PRODUCT</text><text x="28" y="226" class="sans ink" font-size="23" font-weight="700">coding-agent</text><text x="265" y="198" class="sans ink" font-size="25" font-weight="650">文件、命令、Session、Extensions</text><text x="265" y="230" class="sans muted" font-size="18">把通用 Runtime 装配成可用产品</text>
    <path d="M630 260V295" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="0" y="300" width="1260" height="120" rx="10" class="dark"/><rect x="0" y="300" width="225" height="120" rx="10" fill="#176f55"/><text x="28" y="348" class="mono white" font-size="17">02 RUNTIME</text><text x="28" y="382" class="sans white" font-size="23" font-weight="700">agent-core</text><text x="265" y="350" class="sans white" font-size="26" font-weight="650">Agent Loop · State · Tools · Events</text><text x="265" y="385" class="sans" fill="#c9d2cd" font-size="18">决定继续、执行、接受中途输入或结束</text>
    <path d="M630 420V455" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="0" y="460" width="1260" height="110" rx="10" class="box"/><rect x="0" y="460" width="225" height="110" rx="10" class="accent"/><text x="28" y="504" class="mono green" font-size="17">01 MODEL API</text><text x="28" y="536" class="sans ink" font-size="23" font-weight="700">pi-ai</text><text x="265" y="508" class="sans ink" font-size="25" font-weight="650">Providers · Messages · Streaming · Usage</text><text x="265" y="540" class="sans muted" font-size="18">统一供应商差异，不决定任务策略</text>
  </g>
  <text x="90" y="850" class="sans muted" font-size="17">阅读顺序：先读 agent-core 的状态推进，再向下看模型事件，最后向上看产品和界面如何消费事件。</text>
</svg>
