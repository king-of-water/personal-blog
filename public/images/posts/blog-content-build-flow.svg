<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">从文章文件到静态网页</title><desc id="desc">读取 Markdown 后校验字段；校验不通过则停止构建。通过后过滤草稿，草稿不生成公开页面。非草稿使用文章模板生成正文和目录，同时生成栏目列表，输出到 dist 发布。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;text-anchor:middle;font-size:23px}.small{font-size:20px}.heading{font-size:29px;font-weight:600}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:2}.decision{fill:#ebe4d4;stroke:#8a7f6d;stroke-width:2}.done{fill:#dee3d6;stroke:#466b48;stroke-width:2}.link{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}</style><rect width="960" height="740" fill="#fdfaf3"/>
<text x="480" y="46" class="heading">写完文件以后，Astro 在构建时做什么？</text>
<rect x="300" y="85" width="360" height="75" rx="10" class="box"/><text x="480" y="116">读取文章 Markdown</text><text x="480" y="145" class="small">正文 + 标题、日期、分类</text>
<path d="M480 160V185" class="link"/>
<path d="M480 185L640 235L480 285L320 235Z" class="decision"/><text x="480" y="243">字段是否合法？</text>
<path d="M320 235H272" class="link"/><text x="289" y="214" class="small">否</text>
<rect x="25" y="197" width="245" height="78" rx="10" class="box"/><text x="147" y="229">报告错误，停止构建</text><text x="147" y="258" class="small">修正字段后重新构建</text>
<path d="M480 285V320" class="link"/><text x="507" y="308" class="small">是</text>
<path d="M480 320L640 370L480 420L320 370Z" class="decision"/><text x="480" y="378">是不是草稿？</text>
<path d="M640 370H697" class="link"/><text x="669" y="350" class="small">是</text>
<rect x="700" y="332" width="235" height="78" rx="10" class="box"/><text x="817" y="364">跳过公开路由和列表</text><text x="817" y="393" class="small">源码仍留在仓库中</text>
<path d="M480 420V465" class="link"/><text x="507" y="448" class="small">否</text>
<rect x="290" y="465" width="380" height="100" rx="10" class="box"/><text x="480" y="495">列出文章地址，套用模板</text><text x="480" y="524" class="small">render() 生成正文与章节目录</text><text x="480" y="552" class="small">栏目页同步筛选、排序文章</text>
<path d="M480 565V610" class="link"/>
<rect x="290" y="610" width="380" height="80" rx="10" class="done"/><text x="480" y="642">输出 dist，交给 Pages 发布</text><text x="480" y="672" class="small">HTML、CSS、脚本与图片</text>
<text x="480" y="722" class="small">读者访问时，正文已经生成，不再查询文章数据库。</text></svg>
