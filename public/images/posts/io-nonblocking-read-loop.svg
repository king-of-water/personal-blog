<svg xmlns="http://www.w3.org/2000/svg" width="780" height="650" viewBox="0 0 780 650" role="img" aria-labelledby="title desc"><title id="title">可读之后：实际读取决定下一步</title><desc id="desc">收到可读事件后执行非阻塞 recv。正数则保存并解析，继续读；EINTR 重试；EAGAIN 返回调度；返回零则按协议收尾；其他错误按策略关闭。ET 因预算提前让出时需要应用主动续读。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="650" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">可读之后：实际读取决定下一步</text><rect x="230" y="75" width="320" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="101" font-size="19" text-anchor="middle" fill="#2b2620">收到可读通知</text><text x="390" y="126" font-size="19" text-anchor="middle" fill="#2b2620">调用非阻塞 recv</text><path d="M390 140 V195" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="230" y="195" width="320" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="233.5" font-size="19" text-anchor="middle" fill="#2b2620">检查实际返回值</text><path d="M230 225 H170 V315" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="166" y="290" font-size="17" text-anchor="middle" fill="#2b2620">大于 0</text><rect x="35" y="315" width="270" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="170" y="346" font-size="19" text-anchor="middle" fill="#2b2620">追加输入，按协议解析</text><text x="170" y="371" font-size="19" text-anchor="middle" fill="#2b2620">继续读取</text><path d="M35 352 H15 V107 H230" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M550 225 H610 V315" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="610" y="290" font-size="17" text-anchor="middle" fill="#2b2620">EAGAIN</text><rect x="475" y="315" width="270" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="610" y="346" font-size="19" text-anchor="middle" fill="#2b2620">当前暂时无更多数据</text><text x="610" y="371" font-size="19" text-anchor="middle" fill="#2b2620">交回调度，等待下一次通知</text><path d="M390 260 V440" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="420" font-size="17" text-anchor="middle" fill="#2b2620">0 / 其他错误</text><rect x="230" y="440" width="320" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="471" font-size="19" text-anchor="middle" fill="#2b2620">对端发送结束 / 读取失败</text><text x="390" y="496" font-size="19" text-anchor="middle" fill="#2b2620">按协议收尾并清理连接</text><path d="M550 245 H765 V107 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="682" y="179" font-size="16" text-anchor="middle" fill="#2b2620">EINTR：重试</text><text x="390" y="575" font-size="17" text-anchor="middle" fill="#2b2620">ET 若因处理预算提前停止：放入应用待处理队列，之后主动续读。</text><text x="390" y="610" font-size="17" text-anchor="middle" fill="#2b2620">事件返回只说明可以尝试；请求完整性和业务完成要由上层判断。</text></svg>
