<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc"><title id="title">提交订单：资源确认成功后才开放支付</title><desc id="desc">先保存提交身份，再预占两件商品并锁券。成功开放支付；明确失败释放已取得资源；未知结果按原身份查询并恢复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="420" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">提交订单：资源确认成功后才开放支付</text><rect x="24" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">交易端保存提交身份</text><text x="134" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">绑定用户与购买参数</text><rect x="280" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">申请 A、B 预占</text><text x="390" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">再锁定本次优惠券</text><rect x="536" y="80" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="646" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">全部确认成功</text><text x="646" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">保存待支付订单</text><path d="M244 118 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 118 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="518" y="103" font-size="16" text-anchor="middle" fill="#2b2620">成功</text><path d="M345 156 V212 H134 V252" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="205" y="201" font-size="16" text-anchor="middle" fill="#2b2620">明确失败</text><path d="M435 156 V252" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="475" y="210" font-size="16" text-anchor="middle" fill="#2b2620">未知</text><rect x="24" y="252" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">关闭本次提交</text><text x="134" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">释放已取得的资源</text><rect x="280" y="252" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">按原身份查占用</text><text x="390" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">保留未完成进度</text><rect x="536" y="252" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">依据已确认结果</text><text x="646" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">继续原步骤或释放</text><path d="M500 290 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M646 328 V360 H390 V328" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="399" font-size="16" text-anchor="middle" fill="#2b2620">虚线：仍未知则继续查询，不新建占用</text></svg>
