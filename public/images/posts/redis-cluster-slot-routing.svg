<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Redis Cluster 的 Key 到槽到节点路由链</title>
  <desc id="desc">Key 先经 CRC16 对 16384 取模得到固定槽号，槽号再按归属表映射到主节点。同一 Key 的槽永远不变，变的只是槽当前归哪个节点，因此扩缩容搬槽而不改公式。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">Key 落到槽，槽再落到节点</text>
  <text x="56" y="88" class="b">slot = CRC16(key) mod 16384；槽号固定不变，变的只是每个槽当前归哪个主节点。</text>

  <g transform="translate(55 150)">
    <rect width="230" height="120" rx="18" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="115" y="44" text-anchor="middle" class="t" fill="#725923">Key</text>
    <text x="115" y="82" text-anchor="middle" class="m">foo</text>
  </g>
  <line x1="285" y1="210" x2="335" y2="210" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(335 150)">
    <rect width="240" height="120" rx="18" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="120" y="44" text-anchor="middle" class="t" fill="#725923">CRC16 取模</text>
    <text x="120" y="82" text-anchor="middle" class="m">CRC16(key) % 16384</text>
  </g>
  <line x1="575" y1="210" x2="625" y2="210" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(625 150)">
    <rect width="190" height="120" rx="18" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="95" y="44" text-anchor="middle" class="t" fill="#725923">固定槽</text>
    <text x="95" y="82" text-anchor="middle" class="m">slot 12182</text>
  </g>
  <line x1="815" y1="210" x2="865" y2="210" stroke="#8a7f6d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(865 150)">
    <rect width="280" height="120" rx="18" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="140" y="44" text-anchor="middle" class="t" fill="#466b48">节点 C 持有该槽</text>
    <text x="140" y="82" text-anchor="middle" class="m">slots 11001–16383</text>
  </g>

  <g transform="translate(55 330)">
    <rect width="1090" height="150" rx="22" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="40" class="t">三个主节点的槽归属</text>
    <rect x="28" y="58" width="300" height="40" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="178" y="83" text-anchor="middle" class="m">A: 0–5500</text>
    <rect x="348" y="58" width="300" height="40" rx="10" fill="#d8dee0" stroke="#295279"/>
    <text x="498" y="83" text-anchor="middle" class="m">B: 5501–11000</text>
    <rect x="668" y="58" width="300" height="40" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="818" y="83" text-anchor="middle" class="m">C: 11001–16383</text>
    <text x="28" y="128" class="s">slot 12182 落在 C 的范围里；加节点 D 时，只需从 A/B/C 各搬一部分槽给 D，不改变取模公式。</text>
  </g>

  <g transform="translate(55 520)">
    <rect width="1090" height="150" rx="22" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="40" class="t">hash tag 把多个 Key 压进同一个槽</text>
    <text x="28" y="76" class="m">{user1000}.following</text>
    <text x="28" y="112" class="m">{user1000}.followers</text>
    <text x="420" y="76" class="b">只哈希花括号里的 user1000，两个 Key 得到同一个槽。</text>
    <text x="420" y="112" class="s">代价：tag 用得越宽，越可能人为制造热点槽。</text>
  </g>
</svg>
