<svg xmlns="http://www.w3.org/2000/svg" width="780" height="425" viewBox="0 0 780 425" role="img" aria-labelledby="title desc"><title id="title">同一组对象：A、C 存活，B、D 已不可达</title><desc id="desc">标记清除留下分散空闲块；复制把 A、C 搬到目标区域后释放来源；整理将来源范围内的 A、C 紧凑排列。格子是等宽示意，不表示真实对象等大或 JVM 必须采用半空间布局。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="425" fill="#fdfaf3"/><text x="24" y="34" text-anchor="start" font-size="22" fill="#2b2620">同一组对象：A、C 存活，B、D 已不可达</text><text x="24" y="83" text-anchor="start" font-size="18" fill="#2b2620">原布局</text><rect x="150" y="57" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="186" y="84" text-anchor="middle" font-size="17" fill="#2b2620">A</text><rect x="222" y="57" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="258" y="84" text-anchor="middle" font-size="17" fill="#2b2620">B</text><rect x="294" y="57" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="330" y="84" text-anchor="middle" font-size="17" fill="#2b2620">C</text><rect x="366" y="57" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="402" y="84" text-anchor="middle" font-size="17" fill="#2b2620">D</text><text x="24" y="158" text-anchor="start" font-size="18" fill="#2b2620">标记清除</text><rect x="150" y="132" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="186" y="159" text-anchor="middle" font-size="17" fill="#2b2620">A</text><rect x="222" y="132" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="258" y="159" text-anchor="middle" font-size="17" fill="#2b2620">空</text><rect x="294" y="132" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="330" y="159" text-anchor="middle" font-size="17" fill="#2b2620">C</text><rect x="366" y="132" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="402" y="159" text-anchor="middle" font-size="17" fill="#2b2620">空</text><text x="470" y="158" text-anchor="start" font-size="18" fill="#2b2620">不移动，空闲块分散</text><text x="24" y="245" text-anchor="start" font-size="18" fill="#2b2620">复制</text><rect x="150" y="217" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="186" y="244" text-anchor="middle" font-size="17" fill="#2b2620">空</text><rect x="222" y="217" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="258" y="244" text-anchor="middle" font-size="17" fill="#2b2620">空</text><rect x="294" y="217" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="330" y="244" text-anchor="middle" font-size="17" fill="#2b2620">空</text><rect x="366" y="217" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="402" y="244" text-anchor="middle" font-size="17" fill="#2b2620">空</text><path d="M445,238 H478" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="485" y="217" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="521" y="244" text-anchor="middle" font-size="17" fill="#2b2620">A</text><rect x="557" y="217" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="593" y="244" text-anchor="middle" font-size="17" fill="#2b2620">C</text><text x="294" y="284" text-anchor="middle" font-size="17" fill="#2b2620">来源释放</text><text x="557" y="284" text-anchor="middle" font-size="17" fill="#2b2620">另一个目标区</text><text x="24" y="351" text-anchor="start" font-size="18" fill="#2b2620">标记整理</text><rect x="150" y="325" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="186" y="352" text-anchor="middle" font-size="17" fill="#2b2620">A</text><rect x="222" y="325" width="72" height="42" fill="#d8dee0" stroke="#8a7f6d"/><text x="258" y="352" text-anchor="middle" font-size="17" fill="#2b2620">C</text><rect x="294" y="325" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="330" y="352" text-anchor="middle" font-size="17" fill="#2b2620">空</text><rect x="366" y="325" width="72" height="42" fill="#f5f0e4" stroke="#8a7f6d"/><text x="402" y="352" text-anchor="middle" font-size="17" fill="#2b2620">空</text><text x="470" y="351" text-anchor="start" font-size="18" fill="#2b2620">原范围内重新排列</text><text x="24" y="405" text-anchor="start" font-size="17" fill="#2b2620">蓝色表示存活对象；目标空间比例由具体实现决定。</text></svg>
