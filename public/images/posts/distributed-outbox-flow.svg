<svg xmlns="http://www.w3.org/2000/svg" width="780" height="630" viewBox="0 0 780 630" role="img" aria-labelledby="title desc"><title id="title">支付与权益：保存待办，再可靠补发</title><desc id="desc">账户数据库原子提交支付结果和待发事件。发送结果未知时发送进程重发；消费确认丢失时队列重投。消费者原子登记事件与开通权益，提交后确认，用同一事件编号去重。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="630" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">支付与权益：保存待办，再可靠补发</text><rect x="50" y="75" width="300" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="108.5" font-size="19" text-anchor="middle" fill="#2b2620">同一账户事务提交</text><text x="200" y="133.5" font-size="19" text-anchor="middle" fill="#2b2620">支付结果 + 待发事件</text><path d="M200 155 V205" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="50" y="205" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="236" font-size="19" text-anchor="middle" fill="#2b2620">发送进程读取待办</text><text x="200" y="261" font-size="19" text-anchor="middle" fill="#2b2620">沿同一事件编号发送</text><path d="M350 243 H440" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="440" y="205" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="236" font-size="19" text-anchor="middle" fill="#2b2620">队列按约定可靠接收</text><text x="590" y="261" font-size="19" text-anchor="middle" fill="#2b2620">向消费者投递事件</text><path d="M590 280 V345" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="440" y="345" width="300" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="378.5" font-size="19" text-anchor="middle" fill="#2b2620">消费者本地事务</text><text x="590" y="403.5" font-size="19" text-anchor="middle" fill="#2b2620">去重记录 + 开通权益</text><path d="M590 425 V500" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="440" y="500" width="300" height="60" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="590" y="536" font-size="19" text-anchor="middle" fill="#2b2620">提交后才确认消费</text><path d="M200 280 V325" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="50" y="325" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="356" font-size="19" text-anchor="middle" fill="#2b2620">发送结果未知</text><text x="200" y="381" font-size="19" text-anchor="middle" fill="#2b2620">发送进程重发原事件</text><path d="M50 362 H20 V243 H50" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="50" y="470" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="501" font-size="19" text-anchor="middle" fill="#2b2620">消费确认丢失</text><text x="200" y="526" font-size="19" text-anchor="middle" fill="#2b2620">队列重投原事件</text><path d="M440 530 H350" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M200 470 V435 H405 V302 H490 V280" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="610" font-size="17" text-anchor="middle" fill="#2b2620">消费者用同一事件编号去重，不重复开通权益。</text></svg>
