<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="title desc"><title id="title">支付确认：成功、关闭和未知分别处理</title><desc id="desc">订单建立原支付尝试。支付端校验渠道通知或查询原结果，成功后推进履约，确认关闭后释放，未知结果继续查询。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="400" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">支付确认：成功、关闭和未知分别处理</text><rect x="24" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">O01 待支付</text><text x="134" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">创建支付尝试 P01</text><rect x="280" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">用户付款或到期关闭</text><text x="390" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">渠道处理原尝试</text><rect x="536" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">支付端查 P01</text><text x="646" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">校验通知或查询结果</text><path d="M244 118 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 118 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M601 156 V205 H134 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="134" y="230" font-size="16" text-anchor="middle" fill="#2b2620">支付成功</text><path d="M646 156 V220 H390 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="241" font-size="16" text-anchor="middle" fill="#2b2620">确认关闭</text><path d="M700 156 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="733" y="208" font-size="16" text-anchor="middle" fill="#2b2620">未知</text><rect x="24" y="250" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="134" y="281.5" font-size="19" text-anchor="middle" fill="#2b2620">接受支付事实</text><text x="134" y="306.5" font-size="19" text-anchor="middle" fill="#2b2620">确认资源后安排履约</text><rect x="280" y="250" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="281.5" font-size="19" text-anchor="middle" fill="#2b2620">关闭原订单</text><text x="390" y="306.5" font-size="19" text-anchor="middle" fill="#2b2620">释放对应预占与券</text><rect x="536" y="250" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="281.5" font-size="19" text-anchor="middle" fill="#2b2620">保留 P01 查询</text><text x="646" y="306.5" font-size="19" text-anchor="middle" fill="#2b2620">不释放、不另号扣款</text><path d="M756 288 H768 V118 H756" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="24" y="378" font-size="17" text-anchor="start" fill="#2b2620">虚线：继续查询原尝试；确认付款不等于仓库已交付。</text></svg>
