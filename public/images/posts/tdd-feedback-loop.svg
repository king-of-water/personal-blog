<svg xmlns="http://www.w3.org/2000/svg" width="780" height="425" viewBox="0 0 780 425" role="img" aria-labelledby="title desc"><title id="title">TDD：一次选择一个具体行为</title><desc id="desc">从场景清单选一个行为，写测试并确认目标断言失败。环境或测试发现错误先修复验证条件。最小实现使新增与相关旧测试通过，再重构并复查，回到场景清单。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="425" fill="#fdfaf3"/><text x="24" y="34" text-anchor="start" font-size="22" fill="#2b2620">TDD：一次选择一个具体行为</text><rect x="24" y="76" width="210" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="105" text-anchor="middle" font-size="19" fill="#2b2620">场景清单</text><text x="129" y="129" text-anchor="middle" font-size="19" fill="#2b2620">选择一个行为</text><rect x="284" y="76" width="210" height="70" rx="6" fill="#d8dee0" stroke="#295279"/><text x="389" y="105" text-anchor="middle" font-size="19" fill="#2b2620">写测试并执行</text><text x="389" y="129" text-anchor="middle" font-size="19" fill="#2b2620">确认失败原因</text><rect x="544" y="76" width="212" height="70" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="650" y="105" text-anchor="middle" font-size="19" fill="#2b2620">停止：先修复</text><text x="650" y="129" text-anchor="middle" font-size="19" fill="#2b2620">环境 / 测试发现</text><path d="M234,111 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,111 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="650" y="65" text-anchor="middle" font-size="16" fill="#2b2620">不是目标行为失败</text><rect x="284" y="211" width="210" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="240" text-anchor="middle" font-size="19" fill="#2b2620">Green：最小实现</text><text x="389" y="264" text-anchor="middle" font-size="19" fill="#2b2620">新增与旧测试通过</text><path d="M389,146 V211" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="410" y="180" text-anchor="start" font-size="17" fill="#2b2620">Red：目标断言失败</text><rect x="24" y="211" width="210" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="240" text-anchor="middle" font-size="19" fill="#2b2620">Refactor：整理结构</text><text x="129" y="264" text-anchor="middle" font-size="19" fill="#2b2620">复查行为仍然通过</text><path d="M284,246 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M129,211 V146" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="211" width="212" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="240" text-anchor="middle" font-size="19" fill="#2b2620">相关测试仍失败</text><text x="650" y="264" text-anchor="middle" font-size="19" fill="#2b2620">继续定位与实现</text><path d="M494,246 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="24" y="337" text-anchor="start" font-size="18" fill="#2b2620">实线：正常循环；虚线：未满足推进条件。</text><text x="24" y="373" text-anchor="start" font-size="18" fill="#2b2620">需求有冲突时先确认规则，不改预期去迁就实现。</text><text x="24" y="405" text-anchor="start" font-size="17" fill="#2b2620">重构后测试不通过：先定位回归，不推进下一个行为。</text></svg>
