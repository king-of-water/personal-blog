<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">AI Native 团队的五个协同平面</title>
  <desc id="desc">业务空间提供共同边界，人位于控制面上方做目标和风险判断；控制面编排任务，知识面提供事实，执行面中的角色 Agent 调用工具，证据面保存可验证结果并反馈状态。</desc>
  <rect width="1440" height="940" fill="#fdfaf3"/>
  <style>
    .title{font:700 32px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#2b2620}.sub{font:400 16px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#6f6659}.k{font:700 13px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#2f5d8a;letter-spacing:1px}.h{font:700 19px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#2b2620}.p{font:400 14px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#554d42}.note{font:600 14px ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;fill:#943b37}
  </style>
  <text x="70" y="68" class="title">AI Native 团队：五个平面共享一个业务空间</text>
  <text x="70" y="101" class="sub">这是责任划分，不要求把现有文档、工单、代码和 CI 迁入一套产品</text>
  <rect x="55" y="135" width="1330" height="750" rx="18" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="2"/>
  <text x="85" y="175" class="k">BUSINESS SPACE · 共同目标、成员、权限与任务作用域</text>
  <rect x="85" y="205" width="1270" height="105" rx="10" fill="#eee3dc" stroke="#943b37"/>
  <text x="115" y="240" class="k">HUMAN CONTROL</text><text x="115" y="277" class="h">人：设定目标与护栏 · 处理冲突和例外 · 批准高风险动作 · 承担结果责任</text>
  <rect x="85" y="350" width="1270" height="105" rx="10" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
  <text x="115" y="385" class="k">CONTROL PLANE</text><text x="115" y="422" class="h">目标契约 · 任务图 · 状态机 · 路由 · 权限策略 · 预算 · 审批 · 恢复</text>
  <rect x="85" y="495" width="330" height="220" rx="10" fill="#ebe4d4" stroke="#8a7f6d"/>
  <text x="115" y="532" class="k">KNOWLEDGE PLANE</text><text x="115" y="574" class="h">Agent 依据什么行动</text><text x="115" y="612" class="p">业务规则与领域模型</text><text x="115" y="642" class="p">团队规范与责任边界</text><text x="115" y="672" class="p">仓库事实、版本和来源</text>
  <rect x="455" y="495" width="530" height="220" rx="10" fill="#f5f0e4" stroke="#466b48" stroke-width="2"/>
  <text x="485" y="532" class="k">EXECUTION PLANE</text><text x="485" y="574" class="h">角色 Agent 与可执行工具</text>
  <rect x="485" y="605" width="105" height="70" rx="8" fill="#fbf8f1" stroke="#8a7f6d"/><text x="507" y="646" class="p">产品 Agent</text><rect x="608" y="605" width="105" height="70" rx="8" fill="#fbf8f1" stroke="#8a7f6d"/><text x="630" y="646" class="p">研发 Agent</text><rect x="731" y="605" width="105" height="70" rx="8" fill="#fbf8f1" stroke="#8a7f6d"/><text x="753" y="646" class="p">测试 Agent</text><rect x="854" y="605" width="105" height="70" rx="8" fill="#fbf8f1" stroke="#8a7f6d"/><text x="876" y="646" class="p">运维 Agent</text>
  <rect x="1025" y="495" width="330" height="220" rx="10" fill="#dee3d6" stroke="#466b48"/>
  <text x="1055" y="532" class="k">EVIDENCE PLANE</text><text x="1055" y="574" class="h">凭什么继续推进</text><text x="1055" y="612" class="p">决定与审批</text><text x="1055" y="642" class="p">Diff、测试与系统回执</text><text x="1055" y="672" class="p">运行指标与审计轨迹</text>
  <path d="M720 455V495M415 605H455M985 605H1025" stroke="#5b5245" stroke-width="2"/>
  <rect x="455" y="760" width="530" height="78" rx="10" fill="#fbf8f1" stroke="#8a7f6d"/>
  <text x="485" y="792" class="k">TOOLS</text><text x="485" y="821" class="p">数据查询 · 代码仓库 · 工单 · CI/CD · 配置 · 监控 · 客服系统</text>
  <path d="M720 715V760" stroke="#5b5245" stroke-width="2"/>
  <text x="85" y="918" class="note">控制面管状态与边界，模型处理语义，证据决定流程能否前进</text>
</svg>
