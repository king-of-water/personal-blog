<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="title desc"><title id="title">回填资格：空缓存也要记住版本水位</title><desc id="desc">floor=42 已生效且低版本值已清理，候选在同一原子操作内与 floor 和当前值版本比较，低版本候选被拒绝。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="360" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">回填资格：空缓存也要记住版本水位</text><rect x="30" y="75" width="225" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="142.5" y="102" text-anchor="middle" font-size="20" fill="#2b2620">floor 已推进到 42</text><text x="142.5" y="127" text-anchor="middle" font-size="20" fill="#2b2620">低版本值已清除</text><rect x="310" y="75" width="225" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="422.5" y="102" text-anchor="middle" font-size="20" fill="#2b2620">旧 loader</text><text x="422.5" y="127" text-anchor="middle" font-size="20" fill="#2b2620">尝试回填 v41</text><path d="M255,107 H310" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M423,180 L530.5,230 L423,280 L315.5,230 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="423" y="237" text-anchor="middle" font-size="20" fill="#2b2620">版本满足门槛？</text><path d="M423,140 V180" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="630" y="173" text-anchor="middle" font-size="18" fill="#2b2620">读取 floor 与当前版本</text><text x="630" y="200" text-anchor="middle" font-size="18" fill="#2b2620">比较和写入不可交错</text><rect x="35" y="200" width="225" height="65" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="147.5" y="227" text-anchor="middle" font-size="20" fill="#2b2620">拒绝回填</text><text x="147.5" y="252" text-anchor="middle" font-size="20" fill="#2b2620">需要新值则重查</text><path d="M315,230 H260" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="285" y="211" text-anchor="middle" font-size="18" fill="#2b2620">否</text><rect x="580" y="240" width="170" height="65" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="665" y="267" text-anchor="middle" font-size="20" fill="#2b2620">写入候选</text><text x="665" y="292" text-anchor="middle" font-size="20" fill="#2b2620">并设置 TTL</text><path d="M530,230 H552 V272 H580" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="557" y="219" text-anchor="middle" font-size="18" fill="#2b2620">是</text><text x="35" y="330" text-anchor="start" font-size="18" fill="#2b2620">前提：水位可靠存在；缺失水位不能直接当成版本零</text></svg>
