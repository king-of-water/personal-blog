<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img"><title>需要读到新数据时如何选择副本</title><desc>检查所选副本是否应用指定事务，未应用则短暂等待，等待超时回当前主库。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="760" fill="#fdfaf3"/><text class="title" x="480" y="45">关键查询：先确认副本追到了哪笔事务</text><rect class="box" x="100" y="75" width="460" height="60" rx="8"/><text x="330" y="112">查询携带本次写入的事务位置</text><path class="line" d="M330 135 V165"/><path class="box" d="M330 165 L510 225 L330 285 L150 225 Z"/><text class="small" x="330" y="232">所选副本已应用？</text><path class="line" d="M510 225 H740 V520"/><text class="small" x="570" y="211">是</text><path class="line" d="M330 285 V330"/><text class="small" x="350" y="310">否</text><rect class="box" x="100" y="330" width="460" height="60" rx="8"/><text x="330" y="367">在这个副本上短暂等待</text><path class="line" d="M330 390 V425"/><path class="box" d="M330 425 L510 485 L330 545 L150 485 Z"/><text class="small" x="330" y="492">等待期限内追上？</text><path class="line" d="M510 485 H740 V520"/><text class="small" x="568" y="470">是</text><rect class="ok" x="615" y="520" width="280" height="60" rx="8"/><text x="755" y="557">在同一副本查询</text><path class="line" d="M330 545 V625"/><text class="small" x="350" y="579">否 / 等待失败</text><rect class="box" x="100" y="625" width="460" height="60" rx="8"/><text x="330" y="662">回当前主库查询，或明确报错</text><text class="small" x="480" y="730">不能换到另一台副本，再假定它也已追上</text></svg>
