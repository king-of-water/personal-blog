<svg xmlns="http://www.w3.org/2000/svg" width="780" height="245" viewBox="0 0 780 245" role="img" aria-labelledby="title desc"><title id="title">先走一遍：O100 怎样预占一件库存</title><desc id="desc">订单进程调用本地代理，代理将方法与参数编成网络请求，库存进程执行预占并提交事务，再发回结果供本地方法返回。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="245" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先走一遍：O100 怎样预占一件库存</text><rect x="20" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="105" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">① 调用本地代理</text><text x="105" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">接住 reserve 调用</text><rect x="210" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="295" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">② 请求发到远端</text><text x="295" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">携带 O100 和参数</text><rect x="400" y="80" width="170" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="485" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">③ 库存方法执行</text><text x="485" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">提交减库存与记录</text><rect x="590" y="80" width="170" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="675" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">④ 响应回到本地</text><text x="675" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">解析结果后返回</text><path d="M190 120 H210" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M380 120 H400" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M570 120 H590" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="208" font-size="17" text-anchor="middle" fill="#2b2620">前半程把调用送过去，后半程把执行结果带回来。</text></svg>
