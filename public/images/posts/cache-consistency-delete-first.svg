<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">先删缓存：旧值在提交前被重新装回</title><desc id="desc">写者删除缓存，读者未命中并读取数据库 v41，回填 v41 后写者才提交 v42。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">先删缓存：旧值在提交前被重新装回</text><rect x="31" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="100" y="85" text-anchor="middle" font-size="20" fill="#2b2620">写请求 W</text><path d="M100,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="221" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="290" y="85" text-anchor="middle" font-size="20" fill="#2b2620">读请求 R</text><path d="M290,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="421" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="490" y="85" text-anchor="middle" font-size="20" fill="#2b2620">数据库</text><path d="M490,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="611" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="680" y="85" text-anchor="middle" font-size="20" fill="#2b2620">缓存</text><path d="M680,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><path d="M100,135 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="125" text-anchor="middle" font-size="18" fill="#2b2620">1. DEL v41</text><path d="M290,183 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485" y="173" text-anchor="middle" font-size="18" fill="#2b2620">2. GET：miss</text><path d="M290,231 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="221" text-anchor="middle" font-size="18" fill="#2b2620">3. 查询 → 返回 v41</text><path d="M290,279 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485" y="269" text-anchor="middle" font-size="18" fill="#2b2620">4. SET v41</text><path d="M100,327 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="317" text-anchor="middle" font-size="18" fill="#2b2620">5. COMMIT v42</text><rect x="35" y="362" width="710" height="36" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="390" y="387" text-anchor="middle" font-size="20" fill="#2b2620">最终：数据库 v42，缓存 v41；提交后没有再次失效</text></svg>
