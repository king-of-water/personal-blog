<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="title desc"><title id="title">同一订单的三次恢复，始终使用原业务键</title><desc id="desc">支付后未发送由 Outbox 恢复；发送确认丢失重发同一事件；消费确认丢失重投并读取发券结果。对账核对业务应发与实发。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="480" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">同一订单的三次恢复，始终使用原业务键</text><rect x="24" y="80" width="265" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="156.5" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">支付已提交，尚未发送</text><text x="156.5" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">Outbox = PENDING</text><rect x="395" y="80" width="361" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="575.5" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">扫描发送原事件</text><text x="575.5" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">等待符合契约的发送确认</text><path d="M289,120 H395" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="205" width="265" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="156.5" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">Broker 已接收，确认未知</text><text x="156.5" y="263.5" font-size="19" text-anchor="middle" fill="#2b2620">Outbox 仍待发送</text><rect x="395" y="205" width="361" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="575.5" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">重发同一事件</text><text x="575.5" y="263.5" font-size="19" text-anchor="middle" fill="#2b2620">重复由业务唯一约束处理</text><path d="M289,245 H395" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="330" width="265" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="156.5" y="363.5" font-size="19" text-anchor="middle" fill="#2b2620">券已提交，消费确认未知</text><text x="156.5" y="388.5" font-size="19" text-anchor="middle" fill="#2b2620">存在成功发放结果</text><rect x="395" y="330" width="361" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="575.5" y="363.5" font-size="19" text-anchor="middle" fill="#2b2620">重投后读取成功结果</text><text x="575.5" y="388.5" font-size="19" text-anchor="middle" fill="#2b2620">不再发券，完成消费确认</text><path d="M289,370 H395" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="450" font-size="18" text-anchor="start" fill="#2b2620">业务对账：核对应发与实发，发现已确认但业务遗漏的情况。</text></svg>
