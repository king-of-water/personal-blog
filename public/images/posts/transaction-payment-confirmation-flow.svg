<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img"><title>扣款响应丢失后的查单恢复</title><desc>支付超时不表示失败。保留支付待确认状态，查询原单号，成功后保存已支付，明确失败才停止，未知则安排下次查询。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="850" fill="#fdfaf3"/><text class="title" x="480" y="45">支付超时：先查原单号，不能再扣一笔</text><rect class="box" x="270" y="85" width="420" height="60" rx="8"/><text x="480" y="122">调用钱包后，扣款响应超时</text><path class="line" d="M480 145 V195"/><rect class="box" x="270" y="195" width="420" height="60" rx="8"/><text x="480" y="232">保留支付待确认 PAYING</text><path class="line" d="M480 255 V305"/><rect class="box" x="270" y="305" width="420" height="60" rx="8"/><text x="480" y="342">向钱包查询原单号 P1001</text><path class="line" d="M480 365 V415"/><path class="box" d="M480 415 L660 465 L480 515 L300 465 Z"/><text class="small" x="480" y="472">钱包确认了什么？</text><path class="line" d="M300 465 H180 V575"/><text class="small" x="200" y="451">已成功</text><rect class="ok" x="35" y="575" width="290" height="60" rx="8"/><text x="180" y="612">本地保存已支付</text><path class="line" d="M660 465 H785 V575"/><text class="small" x="762" y="451">确定最终失败</text><rect class="box" x="640" y="575" width="290" height="60" rx="8"/><text x="785" y="612">本地保存支付失败</text><path class="line" d="M480 515 V685"/><text class="small" x="515" y="592">处理中 / 无法确认</text><rect class="box" x="270" y="685" width="420" height="60" rx="8"/><text x="480" y="722">留下待办，退避后再查询</text><path class="line" d="M480 745 V800 H15 V335 H270"/><text class="small" x="480" y="836">记录可能落后于钱包事实，查询用来补齐进度</text></svg>
