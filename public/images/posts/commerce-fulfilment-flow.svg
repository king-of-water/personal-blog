<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" role="img" aria-labelledby="title desc"><title id="title">履约与取消：按实物交付进度决定下一步</title><desc id="desc">商家确认并分配仓库，仓库拣货核对后出库运输。取消到达仓库后，核对能否停止；可停止则撤销和退款，不能停止则拦截或退货。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="380" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">履约与取消：按实物交付进度决定下一步</text><rect x="24" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">商家确认订单</text><text x="134" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">分配仓库交付任务</text><rect x="280" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">仓库接受任务</text><text x="390" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">拣货、核对与打包</text><rect x="536" y="80" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="646" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">记录实物出库</text><text x="646" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">交承运方运输</text><path d="M244 118 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 118 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 156 V194 H134 V235" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="225" y="181" font-size="16" text-anchor="middle" fill="#2b2620">取消到达</text><rect x="24" y="235" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="266.5" font-size="19" text-anchor="middle" fill="#2b2620">仓库收到取消</text><text x="134" y="291.5" font-size="19" text-anchor="middle" fill="#2b2620">核对能否停止交付</text><rect x="280" y="235" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="266.5" font-size="19" text-anchor="middle" fill="#2b2620">仓库确认撤销</text><text x="390" y="291.5" font-size="19" text-anchor="middle" fill="#2b2620">按规则释放与退款</text><rect x="536" y="235" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="266.5" font-size="19" text-anchor="middle" fill="#2b2620">尝试物流拦截</text><text x="646" y="291.5" font-size="19" text-anchor="middle" fill="#2b2620">或转入退货售后</text><path d="M244 273 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="264" y="226" font-size="16" text-anchor="middle" fill="#2b2620">可停止</text><path d="M134 311 V340 H646 V311" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="365" font-size="16" text-anchor="middle" fill="#2b2620">不可停止或已出库</text></svg>
