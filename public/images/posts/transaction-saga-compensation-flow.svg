<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img"><title>Saga的补偿流程</title><desc>订单和扣款分别提交，库存成功则购买完成，库存最终拒绝且不再执行后退款并关闭订单。未知库存结果先按原单号查询，补偿失败继续恢复。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="850" fill="#fdfaf3"/><text class="title" x="480" y="45">Saga：已经提交的步骤，用后续操作补偿</text><rect class="box" x="270" y="85" width="420" height="60" rx="8"/><text x="480" y="122">订单服务：创建订单并提交</text><path class="line" d="M480 145 V185"/><rect class="box" x="270" y="185" width="420" height="60" rx="8"/><text x="480" y="222">钱包：扣款并提交</text><path class="line" d="M480 245 V285"/><rect class="box" x="270" y="285" width="420" height="60" rx="8"/><text x="480" y="322">发起或查询本单库存占用</text><path class="line" d="M480 345 V385"/><path class="box" d="M480 385 L660 435 L480 485 L300 435 Z"/><text class="small" x="480" y="442">库存的确定结果？</text><path class="line" d="M300 435 H170 V540"/><text class="small" x="183" y="420">占用成功</text><rect class="ok" x="30" y="540" width="280" height="60" rx="8"/><text x="170" y="577">记录购买成功</text><path class="line" d="M480 485 V540"/><text class="small" x="510" y="515">未知</text><rect class="box" x="340" y="540" width="280" height="60" rx="8"/><text x="480" y="577">退避后查原单号</text><path class="line" d="M480 600 V650 H15 V315 H270"/><path class="line" d="M660 435 H790 V540"/><text class="small" x="795" y="403">最终拒绝</text><text class="small" x="795" y="429">不会再占用</text><rect class="box" x="645" y="540" width="290" height="60" rx="8"/><text x="790" y="577">按固定退款单号退款</text><path class="line" d="M790 600 V700"/><text class="small" x="790" y="646">确认退款完成后</text><rect class="box" x="645" y="700" width="290" height="60" rx="8"/><text x="790" y="737">关闭订单，完成补偿</text><text class="small" x="340" y="738">退款未知或失败：留下补偿待办</text><text class="small" x="340" y="771">继续查单或重试，不能直接结束</text><text class="small" x="480" y="826">进度与补偿都需持久化，进程退出后还能恢复</text></svg>
