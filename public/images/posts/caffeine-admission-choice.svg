<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc"><title id="title">容量已满：选出两者，再比较估算频率</title><desc id="desc">窗口最旧的商品 X 是候选，主缓存试用区最旧的商品 A 是待淘汰者。读取二者的估算频率，通常保留频率更高者。图中展示通常路径，源码另有小概率防碰撞攻击放行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="420" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">容量已满：选出两者，再比较估算频率</text><rect x="35" y="85" width="310" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="190" y="116" font-size="19" text-anchor="middle" fill="#2b2620">窗口最旧者 X</text><text x="190" y="141" font-size="19" text-anchor="middle" fill="#2b2620">希望继续留在主缓存</text><rect x="435" y="85" width="310" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="116" font-size="19" text-anchor="middle" fill="#2b2620">试用区最旧者 A</text><text x="590" y="141" font-size="19" text-anchor="middle" fill="#2b2620">主缓存待淘汰者</text><path d="M190 160 V192 H390 V215" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M590 160 V192 H390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="255" y="215" width="270" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="253.5" font-size="19" text-anchor="middle" fill="#2b2620">比较 X 与 A 的估算频率</text><path d="M255 247 H190 V320" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M525 247 H590 V320" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="125" y="292" font-size="18" text-anchor="middle" fill="#2b2620">X = 7，A = 3</text><text x="655" y="292" font-size="18" text-anchor="middle" fill="#2b2620">X = 1，A = 6</text><rect x="35" y="320" width="310" height="65" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="190" y="358.5" font-size="19" text-anchor="middle" fill="#2b2620">保留 X，删除 A</text><rect x="435" y="320" width="310" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="358.5" font-size="19" text-anchor="middle" fill="#2b2620">保留 A，删除 X</text><text x="390" y="408" font-size="16" text-anchor="middle" fill="#2b2620">通常同频倾向保留旧条目；图中数值为说明决策的假设。</text></svg>
