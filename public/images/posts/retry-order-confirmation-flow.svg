<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>下单超时后的确认与重试</title><desc>保留购买编号 R100 并查询。查到返回原订单；暂未查到，在预算内用原编号重试，超出预算稍后继续确认。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="45">下单超时后，不换购买编号</text><rect class="box" x="300" y="80" width="360" height="60" rx="8"/><text x="480" y="117">保留第一次购买编号 R100</text><path class="line" d="M480 140 V170"/><rect class="box" x="300" y="170" width="360" height="60" rx="8"/><text x="480" y="207">按 R100 查询订单</text><path class="line" d="M480 230 V260"/><path class="box" d="M480 260 L630 320 L480 380 L330 320 Z"/><text x="480" y="328">查到原订单？</text><path class="line" d="M630 320 H720"/><text class="small" x="678" y="305">查到</text><rect class="ok" x="720" y="290" width="210" height="60" rx="8"/><text x="825" y="327">返回 O900</text><path class="line" d="M480 380 V430"/><text class="small" x="554" y="411">暂未查到</text><rect class="box" x="280" y="430" width="400" height="60" rx="8"/><text x="480" y="467">预算内：用 R100 重试创建</text><path class="line" d="M280 460 H150 V200 H300"/><text class="small" x="172" y="335">继续确认</text><path class="line" d="M480 490 V545"/><text class="small" x="551" y="526">预算耗尽</text><rect class="box" x="280" y="545" width="400" height="60" rx="8"/><text x="480" y="582">保留编号，稍后继续查询</text><text class="small" x="480" y="647">重试安全的前提：服务端对同一编号防重复创建</text></svg>
