<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">队列位置先定位索引，再定位正文</title><desc id="desc">消费请求以 Topic、queueId 和逻辑 offset 找到固定索引条目，过滤后读取 CommitLog，并将业务提交与消费进度区分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">队列位置先定位索引，再定位正文</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">拉取请求</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">Topic / queue / offset</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">ConsumeQueue</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">地址、长度、过滤信息</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">CommitLog</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">按物理位置读取正文</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="245" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="276" font-size="19" text-anchor="middle" fill="#2b2620">SDK 交付</text><text x="650" y="301" font-size="19" text-anchor="middle" fill="#2b2620">可能先进入本地缓存</text><rect x="284" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="276" font-size="19" text-anchor="middle" fill="#2b2620">业务事务</text><text x="389" y="301" font-size="19" text-anchor="middle" fill="#2b2620">效果与幂等一起提交</text><rect x="24" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="276" font-size="19" text-anchor="middle" fill="#2b2620">消费进度</text><text x="129" y="301" font-size="19" text-anchor="middle" fill="#2b2620">恢复从持久位置开始</text><path d="M650,155 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,282 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,282 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="378" font-size="18" text-anchor="start" fill="#2b2620">消息在存储中存在，只能证明正文责任，不能证明业务效果。</text></svg>
