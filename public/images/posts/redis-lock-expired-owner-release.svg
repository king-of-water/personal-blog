<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>过期后的旧持有者不能删除新锁</title><desc>A 的锁过期，B 获取新锁。A 恢复后必须在 Redis 内原子比较 owner-A 与当前 owner-B，不匹配则不删除。该检查不阻止 A 已经发出的业务写入。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="45">旧任务恢复时，锁可能已经属于别人</text><rect class="box" x="35" y="80" width="220" height="60" rx="8"/><text x="145" y="117">实例 A</text><rect class="box" x="370" y="80" width="220" height="60" rx="8"/><text x="480" y="117">Redis 锁键</text><rect class="box" x="705" y="80" width="220" height="60" rx="8"/><text x="815" y="117">实例 B</text><path d="M145 140 V625" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path d="M480 140 V625" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path d="M815 140 V625" stroke="#8a7f6d" stroke-dasharray="5 5" fill="none"/><path class="line" d="M145 205 H480"/><text class="small" x="310" y="184">① A 加锁：owner-A</text><rect class="box" x="40" y="250" width="210" height="60" rx="8"/><text x="145" y="287">A 长时间暂停</text><rect class="box" x="350" y="250" width="260" height="60" rx="8"/><text x="480" y="287">② A 的锁到期</text><path class="line" d="M815 360 H480"/><text class="small" x="650" y="339">③ B 加锁：owner-B</text><rect class="box" x="695" y="385" width="240" height="60" rx="8"/><text x="815" y="422">B 开始重建</text><path class="line" d="M145 490 H480"/><text class="small" x="310" y="469">④ A 恢复，尝试释放</text><rect class="ok" x="355" y="520" width="550" height="60" rx="8"/><text x="630" y="557">脚本比较：owner-B ≠ owner-A</text><text class="small" x="625" y="611">不删除：保留 B 的锁</text><text class="small" x="480" y="657">注意：这只防止误删锁，不会撤回 A 的业务写入</text></svg>
