<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness 运行循环</title>
  <desc id="desc">任务进入运行时后，经过上下文构建、模型决策、权限检查、工具执行和验证，失败则携带反馈进入下一轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17684f"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#f7f7f4"/>
  <text x="72" y="75" fill="#1d201e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" font-weight="700">Agent Harness 的一次运行</text>
  <text x="72" y="112" fill="#70756f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18">模型只是循环中的一个节点，状态与执行权始终由运行时掌握</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="70" y="190" width="180" height="90" rx="18" fill="#1d201e"/><text x="116" y="226" fill="#fff" font-size="20" font-weight="700">用户任务</text><text x="100" y="255" fill="#cfd4cf" font-size="15">目标 · 范围 · 授权</text>
    <rect x="330" y="190" width="210" height="90" rx="18" fill="#e6f0eb" stroke="#17684f" stroke-width="2"/><text x="371" y="226" fill="#17684f" font-size="20" font-weight="700">构建 Context</text><text x="368" y="255" fill="#285f4d" font-size="15">状态 · 证据 · 约束</text>
    <rect x="620" y="190" width="180" height="90" rx="18" fill="#fcfcfa" stroke="#1d201e" stroke-width="2"/><text x="667" y="226" fill="#1d201e" font-size="20" font-weight="700">调用模型</text><text x="650" y="255" fill="#70756f" font-size="15">回答或工具请求</text>
    <rect x="880" y="190" width="240" height="90" rx="18" fill="#fff6df" stroke="#b47a16" stroke-width="2"/><text x="926" y="226" fill="#7b5314" font-size="20" font-weight="700">校验与授权</text><text x="919" y="255" fill="#87672d" font-size="15">Schema · 权限 · 副作用</text>

    <rect x="880" y="390" width="240" height="90" rx="18" fill="#e6f0eb" stroke="#17684f" stroke-width="2"/><text x="938" y="426" fill="#17684f" font-size="20" font-weight="700">执行工具</text><text x="922" y="455" fill="#285f4d" font-size="15">超时 · 幂等 · 审计</text>
    <rect x="620" y="390" width="180" height="90" rx="18" fill="#fcfcfa" stroke="#1d201e" stroke-width="2"/><text x="660" y="426" fill="#1d201e" font-size="20" font-weight="700">记录结果</text><text x="648" y="455" fill="#70756f" font-size="15">状态 · 证据引用</text>
    <rect x="330" y="390" width="210" height="90" rx="18" fill="#fff6df" stroke="#b47a16" stroke-width="2"/><text x="384" y="426" fill="#7b5314" font-size="20" font-weight="700">完成验证</text><text x="365" y="455" fill="#87672d" font-size="15">结果 · 过程 · 质量</text>
    <rect x="70" y="390" width="180" height="90" rx="18" fill="#1d201e"/><text x="114" y="426" fill="#fff" font-size="20" font-weight="700">最终状态</text><text x="90" y="455" fill="#cfd4cf" font-size="15">完成 / 暂停 / 失败</text>
  </g>

  <g stroke="#17684f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M250 235 H322"/><path d="M540 235 H612"/><path d="M800 235 H872"/><path d="M1000 280 V382"/><path d="M880 435 H808"/><path d="M620 435 H548"/><path d="M330 435 H258"/>
  </g>

  <path d="M435 390 V335 H710 V288" fill="none" stroke="#b47a16" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="465" y="326" fill="#7b5314" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16">未通过：携带具体反馈进入下一轮</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <rect x="70" y="575" width="210" height="72" rx="14" fill="#eceee9"/><text x="96" y="605" fill="#1d201e">completed</text><text x="96" y="630" fill="#70756f">证据满足验收</text>
    <rect x="300" y="575" width="210" height="72" rx="14" fill="#eceee9"/><text x="326" y="605" fill="#1d201e">needs_input</text><text x="326" y="630" fill="#70756f">等待用户补充</text>
    <rect x="530" y="575" width="210" height="72" rx="14" fill="#eceee9"/><text x="556" y="605" fill="#1d201e">result_unknown</text><text x="556" y="630" fill="#70756f">副作用待核对</text>
    <rect x="760" y="575" width="170" height="72" rx="14" fill="#eceee9"/><text x="786" y="605" fill="#1d201e">failed</text><text x="786" y="630" fill="#70756f">不可恢复失败</text>
    <rect x="950" y="575" width="170" height="72" rx="14" fill="#eceee9"/><text x="976" y="605" fill="#1d201e">cancelled</text><text x="976" y="630" fill="#70756f">用户主动终止</text>
  </g>
  <text x="72" y="710" fill="#70756f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16">“没有继续调用工具”只是输出形态；是否真正完成，必须由外部验收条件决定。</text>
</svg>
