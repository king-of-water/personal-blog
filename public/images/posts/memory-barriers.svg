<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">四种内存屏障与 volatile 读写的插入位置</title>
  <desc id="desc">JMM 定义四种屏障：LoadLoad 禁止读读重排、StoreStore 禁止写写重排、LoadStore 禁止读写重排、StoreLoad 禁止写读重排。前三者在 x86 上几乎是空操作，只有 StoreLoad 需真实指令、开销最大。volatile 写前插 StoreStore、写后插 StoreLoad；volatile 读后插 LoadLoad 和 LoadStore。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="740" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">四种屏障，只有一种真的花钱</text>
  <text x="56" y="84" class="b">x86 是 TSO 模型，读读/写写/读写天然有序，前三者编译后多为空操作。</text>

  <!-- 四种屏障表 -->
  <g transform="translate(70 120)">
    <rect width="1060" height="200" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t">四种屏障各自禁止什么重排</text>

    <rect x="30" y="56" width="240" height="120" rx="12" fill="#d8dee0" stroke="#295279"/>
    <text x="150" y="88" text-anchor="middle" class="m">LoadLoad</text>
    <text x="150" y="118" text-anchor="middle" class="b">读 ↛ 读</text>
    <text x="150" y="148" text-anchor="middle" class="s">x86 上≈空操作</text>

    <rect x="290" y="56" width="240" height="120" rx="12" fill="#d8dee0" stroke="#295279"/>
    <text x="410" y="88" text-anchor="middle" class="m">StoreStore</text>
    <text x="410" y="118" text-anchor="middle" class="b">写 ↛ 写</text>
    <text x="410" y="148" text-anchor="middle" class="s">x86 上≈空操作</text>

    <rect x="550" y="56" width="240" height="120" rx="12" fill="#d8dee0" stroke="#295279"/>
    <text x="670" y="88" text-anchor="middle" class="m">LoadStore</text>
    <text x="670" y="118" text-anchor="middle" class="b">读 ↛ 写</text>
    <text x="670" y="148" text-anchor="middle" class="s">x86 上≈空操作</text>

    <rect x="810" y="56" width="220" height="120" rx="12" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
    <text x="920" y="88" text-anchor="middle" class="m" fill="#943b37">StoreLoad</text>
    <text x="920" y="118" text-anchor="middle" class="b" fill="#943b37">写 ↛ 读</text>
    <text x="920" y="148" text-anchor="middle" class="s" fill="#943b37">开销最大，要真指令</text>
  </g>

  <!-- volatile 写 -->
  <g transform="translate(70 350)">
    <rect width="510" height="240" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="255" y="36" text-anchor="middle" class="t" fill="#466b48">volatile 写：墙挡在前面</text>

    <rect x="40" y="56" width="430" height="44" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="255" y="84" text-anchor="middle" class="b">普通写（如 config = buildConfig()）</text>

    <rect x="40" y="108" width="430" height="44" rx="10" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="255" y="136" text-anchor="middle" class="m">StoreStore 屏障</text>

    <rect x="40" y="160" width="430" height="44" rx="10" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
    <text x="255" y="188" text-anchor="middle" class="m" fill="#5e5083">volatile 写（ready = true）</text>

    <text x="40" y="228" class="s">写之前的普通写不能翻到 volatile 写之后</text>
  </g>

  <!-- volatile 读 -->
  <g transform="translate(620 350)">
    <rect width="510" height="240" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="255" y="36" text-anchor="middle" class="t" fill="#295279">volatile 读：墙挡在后面</text>

    <rect x="40" y="56" width="430" height="44" rx="10" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
    <text x="255" y="84" text-anchor="middle" class="m" fill="#5e5083">volatile 读（if (ready)）</text>

    <rect x="40" y="108" width="430" height="44" rx="10" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="255" y="136" text-anchor="middle" class="m">LoadLoad + LoadStore 屏障</text>

    <rect x="40" y="160" width="430" height="44" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="255" y="188" text-anchor="middle" class="b">后续读写（如 use(config)）</text>

    <text x="40" y="228" class="s">读之后的读写不能翻到 volatile 读之前</text>
  </g>

  <!-- 实现 -->
  <g transform="translate(70 620)">
    <rect width="1060" height="100" rx="16" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="34" class="t">x86 上 volatile 写的真实指令</text>
    <text x="28" y="64" class="m">lock addl $0x0, (%rsp)     // 给栈顶加 0：借 lock 前缀的全屏障副作用</text>
    <text x="28" y="90" class="s">比 mfence 更快；字节码层面字段带 ACC_VOLATILE 标志，由 JVM 决定是否插屏障。</text>
  </g>
</svg>
