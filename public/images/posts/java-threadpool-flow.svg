<svg xmlns="http://www.w3.org/2000/svg" width="780" height="550" viewBox="0 0 780 550" role="img" aria-labelledby="title desc"><title id="title">execute：新建、入队、扩容、拒绝</title><desc id="desc">少于核心数量时尝试新建；否则尝试入队并复查状态；入队失败则尝试按最大数量新建，仍失败则拒绝。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="550" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">execute：新建、入队、扩容、拒绝</text><path d="M270,70 L410,115 L270,160 L130,115 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="270" y="122" text-anchor="middle" font-size="20" fill="#2b2620">按 core 新建成功？</text><rect x="550" y="85" width="200" height="60" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="650" y="122" text-anchor="middle" font-size="20" fill="#2b2620">执行首次任务</text><path d="M410,115 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="100" text-anchor="middle" font-size="18" fill="#2b2620">是</text><path d="M270,200 L410,245 L270,290 L130,245 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="270" y="252" text-anchor="middle" font-size="20" fill="#2b2620">运行且入队成功？</text><path d="M270,160 V200" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="185" text-anchor="middle" font-size="18" fill="#2b2620">否</text><rect x="550" y="212" width="200" height="66" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="239.5" text-anchor="middle" font-size="20" fill="#2b2620">复查关闭状态</text><text x="650" y="264.5" text-anchor="middle" font-size="20" fill="#2b2620">必要时尝试补线程</text><path d="M410,245 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="230" text-anchor="middle" font-size="18" fill="#2b2620">是</text><path d="M270,330 L410,375 L270,420 L130,375 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="270" y="382" text-anchor="middle" font-size="20" fill="#2b2620">按 max 新建成功？</text><path d="M270,290 V330" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="315" text-anchor="middle" font-size="18" fill="#2b2620">否</text><rect x="550" y="345" width="200" height="60" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="650" y="382" text-anchor="middle" font-size="20" fill="#2b2620">执行首次任务</text><path d="M410,375 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="360" text-anchor="middle" font-size="18" fill="#2b2620">是</text><rect x="155" y="460" width="230" height="54" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="270" y="494" text-anchor="middle" font-size="20" fill="#2b2620">调用拒绝处理器</text><path d="M270,420 V460" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="445" text-anchor="middle" font-size="18" fill="#2b2620">否</text><text x="26" y="540" text-anchor="start" font-size="18" fill="#2b2620">已关闭且能移除刚入队任务时，同样进入拒绝处理器。</text></svg>
