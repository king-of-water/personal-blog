<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Jev-Mem 的三层结构</title><desc id="desc">System One 控制面处理记忆类型、关系、路由、预算与停止，结构化记忆面存储节点与关系，System Two 推理面只在需要时做复杂推理与生成。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.dark{fill:#222825}.white{fill:#fff}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">JEV-MEM</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">把记忆的频繁判断交给控制面</text><text x="88" y="180" class="sans muted" font-size="21">生成模型只在需要推理和综合答案时出现。</text>
  <g transform="translate(90 245)">
    <rect x="0" y="0" width="1260" height="150" rx="12" class="dark"/><rect x="0" y="0" width="250" height="150" rx="12" fill="#176f55"/><text x="28" y="52" class="mono white" font-size="16">SYSTEM ONE</text><text x="28" y="90" class="sans white" font-size="25" font-weight="700">控制面</text><text x="285" y="52" class="sans white" font-size="24" font-weight="650">类型 · 关系 · 路由 · 预算 · 打分 · 停止</text><text x="285" y="92" class="sans" fill="#c9d2cd" font-size="18">高频、有界、可类型化的决策，不调用生成模型</text><text x="285" y="122" class="sans" fill="#9bd4bd" font-size="17">回答“这条记忆是什么、该不该检索、够了没有”</text>
    <path d="M630 150V205" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="0" y="210" width="1260" height="150" rx="12" class="box"/><rect x="0" y="210" width="250" height="150" rx="12" class="accent"/><text x="28" y="262" class="mono green" font-size="16">MEMORY</text><text x="28" y="300" class="sans ink" font-size="25" font-weight="700">结构化记忆面</text><text x="285" y="262" class="sans ink" font-size="24" font-weight="650">多类型节点与关系</text><text x="285" y="302" class="sans muted" font-size="18">事实、偏好、事件与它们的边；控制面负责组织与遍历</text>
    <path d="M630 360V415" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="0" y="420" width="1260" height="150" rx="12" class="box"/><rect x="0" y="420" width="250" height="150" rx="12" class="accent"/><text x="28" y="472" class="mono green" font-size="16">SYSTEM TWO</text><text x="28" y="510" class="sans ink" font-size="25" font-weight="700">推理面</text><text x="285" y="472" class="sans ink" font-size="24" font-weight="650">复杂推理与答案生成</text><text x="285" y="512" class="sans muted" font-size="18">只在需要跨记忆推理或综合回答时被调用</text>
  </g>
  <text x="90" y="850" class="sans muted" font-size="17">读取顺序：控制面筛选，记忆面提供证据，推理面只在必要时综合。</text>
</svg>
