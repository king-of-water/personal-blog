<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">验证失败触发 Reflection 的恢复轨迹</title>
  <desc id="desc">Agent 定位并修改 refresh token 错误映射，单元测试通过但 API schema 验证失败，Reflection 根据证据局部修正当前节点，重新验证后完成。</desc>
  <rect width="1200" height="720" fill="#fdfaf3"/>
  <text x="60" y="62" fill="#2b2620" font-family="system-ui, sans-serif" font-size="34" font-weight="700">失败不一定推翻计划，先判断影响范围</text>
  <text x="60" y="94" fill="#6f6659" font-family="system-ui, sans-serif" font-size="17">一个 schema 回归如何触发局部 Reflection，再回到当前计划节点</text>
  <g font-family="system-ui, sans-serif">
    <rect x="60" y="136" width="1080" height="70" rx="14" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="86" y="165" fill="#2f5d8a" font-size="14" font-weight="700" letter-spacing="2">GOAL</text>
    <text x="86" y="190" fill="#2b2620" font-size="18" font-weight="650">修复过期 refresh token 返回 500；保持公开响应 schema 不变</text>

    <rect x="60" y="260" width="190" height="126" rx="13" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="82" y="294" fill="#2f5d8a" font-size="13" font-weight="700">01 LOCATE</text><text x="82" y="327" fill="#2b2620" font-size="19" font-weight="650">定位异常映射</text><text x="82" y="356" fill="#554d42" font-size="14">证据：middleware.ts:88</text>
    <rect x="290" y="260" width="190" height="126" rx="13" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="312" y="294" fill="#2f5d8a" font-size="13" font-weight="700">02 PATCH</text><text x="312" y="327" fill="#2b2620" font-size="19" font-weight="650">修改 HTTP 状态</text><text x="312" y="356" fill="#554d42" font-size="14">误改公开 error code</text>
    <rect x="520" y="260" width="190" height="126" rx="13" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
    <text x="542" y="294" fill="#943b37" font-size="13" font-weight="700">03 VERIFY FAIL</text><text x="542" y="327" fill="#2b2620" font-size="19" font-weight="650">Schema diff</text><text x="542" y="356" fill="#554d42" font-size="14">TOKEN_EXPIRED 被改名</text>
    <rect x="750" y="260" width="190" height="126" rx="13" fill="#ebe4d4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="772" y="294" fill="#2f5d8a" font-size="13" font-weight="700">04 REFLECT</text><text x="772" y="327" fill="#2b2620" font-size="19" font-weight="650">局部修正</text><text x="772" y="356" fill="#554d42" font-size="14">计划与根因仍然有效</text>
    <rect x="980" y="260" width="160" height="126" rx="13" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="1002" y="294" fill="#3d6340" font-size="13" font-weight="700">05 PASS</text><text x="1002" y="327" fill="#2b2620" font-size="19" font-weight="650">重新验证</text><text x="1002" y="356" fill="#554d42" font-size="14">行为与 schema 通过</text>
    <path d="M250 323 H280" stroke="#5b5245" stroke-width="3"/><path d="M280 323 l-12 -8 v16 z" fill="#5b5245"/>
    <path d="M480 323 H510" stroke="#5b5245" stroke-width="3"/><path d="M510 323 l-12 -8 v16 z" fill="#5b5245"/>
    <path d="M710 323 H740" stroke="#943b37" stroke-width="3"/><path d="M740 323 l-12 -8 v16 z" fill="#943b37"/>
    <path d="M940 323 H970" stroke="#5b5245" stroke-width="3"/><path d="M970 323 l-12 -8 v16 z" fill="#5b5245"/>

    <rect x="146" y="462" width="908" height="146" rx="16" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="176" y="500" fill="#2f5d8a" font-size="14" font-weight="700" letter-spacing="2">REFLECTION DECISION</text>
    <text x="176" y="538" fill="#2b2620" font-size="18"><tspan font-weight="700">失败归因：</tspan>响应 code 改名违反公开 schema</text>
    <text x="176" y="571" fill="#2b2620" font-size="18"><tspan font-weight="700">影响范围：</tspan>当前 patch；根因、目标和计划节点仍然成立</text>
    <text x="688" y="538" fill="#2b2620" font-size="18"><tspan font-weight="700">动作：</tspan>恢复原 code，保留 401 映射</text>
    <text x="688" y="571" fill="#2b2620" font-size="18"><tspan font-weight="700">证据：</tspan>schema snapshot diff</text>
    <path d="M845 386 V452" stroke="#8a7f6d" stroke-width="2" stroke-dasharray="6 6"/><path d="M845 452 l-8 -13 h16 z" fill="#8a7f6d"/>
  </g>
  <text x="600" y="668" text-anchor="middle" fill="#6f6659" font-family="system-ui, sans-serif" font-size="15">只有新证据让全局方案失效时才重规划；实现错误先修正当前节点。</text>
</svg>
