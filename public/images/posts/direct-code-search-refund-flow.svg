<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">重复退款问题中，Coding Agent 从关键词逐步收敛到修改和验证的过程</title>
  <desc id="desc">Agent 先列出仓库模块，再搜索退款回调入口，读取 Handler 后沿渠道退款号、状态机、版本条件和事件发布继续搜索。发现状态写入被版本号阻止但事件仍重复发布后，补重复与并发测试，修改条件并验证全部发布入口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5245"/></marker>
    <style>.t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620}.h{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#6f6659}.n{font-size:15px;font-weight:700;letter-spacing:.08em;fill:#7a5c33}.nh{font-size:20px;font-weight:700}.b{font-size:15px;fill:#554d42}.small{font-size:14px;fill:#6f6659}.box{fill:#f5f0e4;stroke:#b8aa94;stroke-width:2}.active{fill:#e9dfca;stroke:#7a5c33;stroke-width:2}.done{fill:#e4eee8;stroke:#56705e;stroke-width:2}.line{stroke:#5b5245;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.warn{fill:#fff8eb;stroke:#b0874f;stroke-width:2}</style>
  </defs>
  <rect width="1440" height="900" fill="#fdfaf3"/>
  <text x="70" y="68" class="t h">一条搜索链怎样把“重复退款”收敛成可验证根因</text>
  <text x="70" y="104" class="t sub">每轮读到的新符号都会成为下一轮查询词，直到正常路径、反例和测试都能互相解释</text>

  <rect x="70" y="150" width="248" height="126" rx="10" class="box"/>
  <text x="96" y="184" class="t n">01 看边界</text><text x="96" y="220" class="t nh">rg --files</text><text x="96" y="250" class="t small">发现 API、Domain、Infra、Job</text>
  <rect x="350" y="150" width="248" height="126" rx="10" class="box"/>
  <text x="376" y="184" class="t n">02 找入口</text><text x="376" y="220" class="t nh">refund + callback</text><text x="376" y="250" class="t small">命中 Controller、Handler、测试</text>
  <rect x="630" y="150" width="248" height="126" rx="10" class="box"/>
  <text x="656" y="184" class="t n">03 读主链路</text><text x="656" y="220" class="t nh">读取 Handler</text><text x="656" y="250" class="t small">查单 → 迁移 → 保存 → 发事件</text>
  <rect x="910" y="150" width="248" height="126" rx="10" class="box"/>
  <text x="936" y="184" class="t n">04 沿身份搜索</text><text x="936" y="220" class="t nh">channelRefundNo</text><text x="936" y="250" class="t small">检查唯一性与并发入口</text>
  <path d="M318 213H324" class="line"/><path d="M598 213H604" class="line"/><path d="M878 213H884" class="line"/>

  <rect x="350" y="350" width="360" height="150" rx="10" class="warn"/>
  <text x="378" y="386" class="t n">05 主动寻找反例</text>
  <text x="378" y="424" class="t b">状态机是否拒绝重复迁移？</text><text x="378" y="456" class="t b">UPDATE 是否带 version 条件？</text><text x="378" y="484" class="t small">避免在第一个合理猜测上停止</text>
  <rect x="758" y="350" width="360" height="150" rx="10" class="active"/>
  <text x="786" y="386" class="t n">06 证据汇合</text>
  <text x="786" y="424" class="t b">第二次状态写入被 version 拒绝</text><text x="786" y="456" class="t b">事件发布却没有检查迁移结果</text><text x="786" y="484" class="t small">根因落到具体分支和调用位置</text>
  <path d="M1034 276V320H530V324" class="line"/><path d="M710 425H732" class="line"/>

  <rect x="70" y="586" width="300" height="138" rx="10" class="box"/>
  <text x="98" y="622" class="t n">07 查测试与历史</text><text x="98" y="660" class="t b">缺少重复、并发用例</text><text x="98" y="692" class="t small">git log -S 补提交线索</text>
  <rect x="414" y="586" width="300" height="138" rx="10" class="box"/>
  <text x="442" y="622" class="t n">08 修改</text><text x="442" y="660" class="t b">迁移成功才发布事件</text><text x="442" y="692" class="t small">补重复与并发回调测试</text>
  <rect x="758" y="586" width="300" height="138" rx="10" class="done"/>
  <text x="786" y="622" class="t n">09 验证</text><text x="786" y="660" class="t b">目标测试 + 全部发布入口</text><text x="786" y="692" class="t small">git diff --check / 检查差异</text>
  <rect x="1102" y="586" width="268" height="138" rx="10" class="done"/>
  <text x="1130" y="622" class="t n">完成证据</text><text x="1130" y="660" class="t b">行为、测试、影响范围</text><text x="1130" y="692" class="t small">三者同时收口</text>
  <path d="M938 500V548H220V560" class="line"/><path d="M370 655H388" class="line"/><path d="M714 655H732" class="line"/><path d="M1058 655H1076" class="line"/>

  <rect x="350" y="792" width="768" height="58" rx="8" fill="#f2eadb" stroke="#b8aa94" stroke-width="2"/>
  <text x="378" y="828" class="t b">任何一步证据不足，都回到上一层缩小范围或换查询词；不是靠模型自评“已经理解”。</text>
  <text x="70" y="884" class="t small">读图：搜索链既要找支持当前假设的证据，也要主动寻找能推翻假设的状态保护、唯一约束和其他入口。</text>
</svg>
