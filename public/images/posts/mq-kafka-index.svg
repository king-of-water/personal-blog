<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="title desc"><title id="title">稀疏索引先缩小范围，再扫描批次</title><desc id="desc">查询 offset 105，先选择起点为 100 的日志段，再查到不大于目标的最近索引 102 对应字节位置 300，从该位置扫描正文批次定位记录。数值为示例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="370" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">稀疏索引先缩小范围，再扫描批次</text><rect x="24" y="82" width="220" height="76" rx="6" fill="#d8dee0" stroke="#295279"/><text x="134" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">目标 offset 105</text><text x="134" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">选择起点为 100 的段</text><rect x="280" y="82" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">索引查找 ≤ 105</text><text x="390" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">最近映射：102 → 300</text><rect x="536" y="82" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">从字节位置 300</text><text x="646" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">向后扫描日志批次</text><path d="M244 120 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 120 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M646 158 V222 H390 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="250" y="250" width="280" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="281.5" font-size="19" text-anchor="middle" fill="#2b2620">找到包含目标的批次</text><text x="390" y="306.5" font-size="19" text-anchor="middle" fill="#2b2620">再确定可交付的记录</text><text x="24" y="200" font-size="17" text-anchor="start" fill="#2b2620">逻辑 offset 与文件字节 position 是两种位置。</text></svg>
