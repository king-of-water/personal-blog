<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">五种代码与知识工程方案在共同事实层上的分工</title>
  <desc id="desc">RAG提供问题相关证据，Skills提供规则与验收，Repo Map提供仓库地图，FastCode提供任务相关代码路径，LLM Wiki提供稳定知识页面，五者共享文档、代码、结构关系、版本和权限事实。</desc>
  <defs><style>.t{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620}.h{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#6f6659}.k{font-size:16px;font-weight:700;letter-spacing:.08em;fill:#7a5c33}.nh{font-size:21px;font-weight:700}.b{font-size:15px;fill:#554d42}.small{font-size:14px;fill:#6f6659}.box{fill:#f5f0e4;stroke:#b8aa94;stroke-width:2}.wiki{fill:#e4eee8;stroke:#56705e;stroke-width:2}.base{fill:#e9dfca;stroke:#7a5c33;stroke-width:2}.line{stroke:#9b8d78;stroke-width:2;fill:none}</style></defs>
  <rect width="1440" height="820" fill="#fdfaf3"/>
  <text x="70" y="68" class="t h">不是五个知识库，而是五种知识产物</text>
  <text x="70" y="104" class="t sub">共享同一份来源与版本，分别解决找证据、定规则、看结构、找路径和建认识</text>
  <text x="70" y="158" class="t k">面向任务的知识产品</text>
  <rect x="70" y="184" width="238" height="178" rx="10" class="box"/><text x="94" y="224" class="t nh">RAG</text><text x="94" y="264" class="t b">产物：相关证据片段</text><text x="94" y="298" class="t small">回答一个明确问题</text><text x="94" y="328" class="t small">强调召回、重排与引用</text>
  <rect x="335" y="184" width="238" height="178" rx="10" class="box"/><text x="359" y="224" class="t nh">Skills</text><text x="359" y="264" class="t b">产物：规则与工作方法</text><text x="359" y="298" class="t small">约束 Agent 怎样做事</text><text x="359" y="328" class="t small">强调触发、步骤与验收</text>
  <rect x="600" y="184" width="238" height="178" rx="10" class="box"/><text x="624" y="224" class="t nh">Repo Map</text><text x="624" y="264" class="t b">产物：压缩仓库地图</text><text x="624" y="298" class="t small">先看模块、符号和关系</text><text x="624" y="328" class="t small">强调结构导航</text>
  <rect x="865" y="184" width="238" height="178" rx="10" class="box"/><text x="889" y="224" class="t nh">FastCode</text><text x="889" y="264" class="t b">产物：任务相关路径</text><text x="889" y="298" class="t small">多步侦察影响范围</text><text x="889" y="328" class="t small">强调最小有效上下文</text>
  <rect x="1130" y="184" width="240" height="178" rx="10" class="wiki"/><text x="1154" y="224" class="t nh">LLM Wiki</text><text x="1154" y="264" class="t b">产物：有证据的页面</text><text x="1154" y="298" class="t small">反复阅读与整体理解</text><text x="1154" y="328" class="t small">强调导航、版本与更新</text>
  <text x="70" y="440" class="t k">共享事实与治理能力</text>
  <rect x="70" y="464" width="1300" height="142" rx="10" class="base"/>
  <text x="98" y="506" class="t nh">同一份来源，不要重复解析五遍</text>
  <text x="98" y="548" class="t b">文档章节与元数据　·　AST、符号与依赖　·　业务实体与关系　·　原始证据与来源锚点</text>
  <text x="98" y="580" class="t b">版本与新鲜度　·　访问权限　·　删除状态　·　使用反馈与评测样本</text>
  <path d="M189 464V392" class="line"/><path d="M454 464V392" class="line"/><path d="M719 464V392" class="line"/><path d="M984 464V392" class="line"/><path d="M1250 464V392" class="line"/>
  <text x="70" y="672" class="t k">共同消费者</text>
  <rect x="70" y="696" width="620" height="72" rx="8" class="box"/><text x="98" y="740" class="t nh">开发者：学习、定位、修改、排障</text>
  <rect x="750" y="696" width="620" height="72" rx="8" class="box"/><text x="778" y="740" class="t nh">Agent：检索、规划、执行、验证</text>
  <text x="70" y="802" class="t small">读图：五种方案可以单独部署；规模扩大后，真正值得共享的是解析、版本和权限，而不是强行统一所有上层产品。</text>
</svg>
