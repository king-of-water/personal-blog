<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">一条 SQL 从文本到结果集的处理链路</title>
  <desc id="desc">SQL 依次经过解析和预处理、查询重写与代价优化、迭代器执行，再由 InnoDB 访问索引和数据页，结果沿执行树返回客户端。统计信息同时输入优化器。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b5245"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2620; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2620; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #554d42; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6f6659; }
      .box { fill: #f5f0e4; stroke: #8a7f6d; stroke-width: 2; rx: 14; }
      .accent { fill: #d8dee0; stroke: #295279; stroke-width: 2; rx: 14; }
      .nested { fill: #ebe4d4; stroke: #8a7f6d; stroke-width: 2; rx: 14; }
      .arrow { fill: none; stroke: #5b5245; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #8a7f6d; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fdfaf3"/>
  <text x="60" y="62" class="title">一条 SQL 怎样变成执行结果</text>
  <text x="60" y="94" class="small">优化器选择路径，执行器驱动路径，InnoDB 读取真实数据</text>

  <rect x="60" y="150" width="190" height="145" class="box"/>
  <text x="155" y="190" text-anchor="middle" class="label">解析与预处理</text>
  <text x="155" y="226" text-anchor="middle" class="body">语法树</text>
  <text x="155" y="253" text-anchor="middle" class="body">对象与列解析</text>
  <text x="155" y="280" text-anchor="middle" class="body">权限和语义检查</text>

  <rect x="315" y="150" width="225" height="145" class="accent"/>
  <text x="427" y="190" text-anchor="middle" class="label">重写与优化</text>
  <text x="427" y="226" text-anchor="middle" class="body">等价变换</text>
  <text x="427" y="253" text-anchor="middle" class="body">访问路径与连接顺序</text>
  <text x="427" y="280" text-anchor="middle" class="body">比较估算代价</text>

  <rect x="605" y="150" width="220" height="145" class="box"/>
  <text x="715" y="190" text-anchor="middle" class="label">迭代器执行</text>
  <text x="715" y="226" text-anchor="middle" class="body">扫描与过滤</text>
  <text x="715" y="253" text-anchor="middle" class="body">连接与聚合</text>
  <text x="715" y="280" text-anchor="middle" class="body">排序与 LIMIT</text>

  <rect x="890" y="150" width="250" height="145" class="nested"/>
  <text x="1015" y="190" text-anchor="middle" class="label">InnoDB</text>
  <text x="1015" y="226" text-anchor="middle" class="body">B+ 树与 Buffer Pool</text>
  <text x="1015" y="253" text-anchor="middle" class="body">记录读取与 MVCC</text>
  <text x="1015" y="280" text-anchor="middle" class="body">数据页和索引页</text>

  <path d="M250 222 H303" class="arrow"/>
  <path d="M540 222 H593" class="arrow"/>
  <path d="M825 222 H878" class="arrow"/>
  <path d="M890 274 H837" class="arrow"/>

  <rect x="315" y="390" width="225" height="120" class="box"/>
  <text x="427" y="430" text-anchor="middle" class="label">统计信息</text>
  <text x="427" y="464" text-anchor="middle" class="body">基数、分布、直方图</text>
  <text x="427" y="491" text-anchor="middle" class="body">用于估算，不是真实执行</text>
  <path d="M427 390 V310" class="dashed"/>

  <rect x="605" y="390" width="220" height="120" class="box"/>
  <text x="715" y="430" text-anchor="middle" class="label">执行计划</text>
  <text x="715" y="464" text-anchor="middle" class="body">一棵有父子关系的树</text>
  <text x="715" y="491" text-anchor="middle" class="body">EXPLAIN 展示它</text>
  <path d="M540 258 C570 300 590 342 650 390" class="dashed"/>

  <text x="60" y="576" class="small">返回路径：存储引擎产出记录，执行器逐层处理，根节点把结果集发送给客户端。</text>
</svg>
