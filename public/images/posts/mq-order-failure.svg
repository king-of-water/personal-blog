<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">版本 2 失败，版本 3 是否允许执行</title><desc id="desc">支付版本 2 失败后，严格依赖链等待修复；持久接管可在本地恢复，但不能假装业务完成；快照投影可以查询权威新版本重建。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="460" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">版本 2 失败，版本 3 是否允许执行</text><rect x="24" y="80" width="210" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="129" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">版本 1 创建</text><text x="129" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">已提交</text><rect x="284" y="80" width="210" height="80" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="389" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">版本 2 支付</text><text x="389" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">处理失败</text><rect x="544" y="80" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">版本 3 发货</text><text x="650" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">前置状态未满足</text><path d="M234,120 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,120 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="24" y="280" width="230" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="139" y="316" font-size="19" text-anchor="middle" fill="#2b2620">严格增量链</text><text x="139" y="341" font-size="19" text-anchor="middle" fill="#2b2620">等待版本 2 修复</text><rect x="275" y="280" width="230" height="85" rx="6" fill="#d8dee0" stroke="#295279"/><text x="390" y="316" font-size="19" text-anchor="middle" fill="#2b2620">持久接管</text><text x="390" y="341" font-size="19" text-anchor="middle" fill="#2b2620">本地保存断点与待办</text><rect x="526" y="280" width="230" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="641" y="316" font-size="19" text-anchor="middle" fill="#2b2620">快照型投影</text><text x="641" y="341" font-size="19" text-anchor="middle" fill="#2b2620">按权威版本重建</text><path d="M389,160 V220 H139 V280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M389,220 V280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M389,220 H641 V280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="420" font-size="18" text-anchor="start" fill="#2b2620">跳过消息不等于补上业务效果；扣款、权益等不能用快照替代。</text></svg>
