<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc"><title id="title">追加、刷盘、复制、可见性不是同一进度</title><desc id="desc">正文追加后本地刷盘、副本复制、派生索引分别推进，各自决定不同的故障条件；消费业务提交属于更后面的责任边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="430" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">追加、刷盘、复制、可见性不是同一进度</text><rect x="275" y="80" width="230" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="390" y="111" font-size="19" text-anchor="middle" fill="#2b2620">正文追加</text><text x="390" y="136" font-size="19" text-anchor="middle" fill="#2b2620">得到日志位置</text><rect x="24" y="250" width="230" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="139" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">本地刷盘</text><text x="139" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">影响本地持久窗口</text><rect x="275" y="250" width="230" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">副本复制</text><text x="390" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">影响节点故障恢复</text><rect x="526" y="250" width="230" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="641" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">索引分发</text><text x="641" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">影响消费可见性</text><path d="M390,155 V205 H139 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390,205 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390,205 H641 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="397" font-size="18" text-anchor="start" fill="#2b2620">这是独立边界示意，实际确认依赖所用版本、模式与配置。</text></svg>
