<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ThreadLocal 的值存在每个 Thread 自己的表里</title>
  <desc id="desc">同一个 ThreadLocal 对象作为 key，在不同线程的 ThreadLocalMap 里映射到不同的 value。Entry 的 key 是弱引用（指向 ThreadLocal），value 是强引用（存线程私有值）。值跟着线程走，线程结束表回收。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">同一个 ThreadLocal 对象，是不同线程表里的 key</text>
  <text x="56" y="88" class="b">value 存在 Thread 的 ThreadLocalMap 里，不在 ThreadLocal 对象里。</text>

  <g transform="translate(480 140)">
    <rect width="240" height="70" rx="14" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="120" y="40" text-anchor="middle" class="t" fill="#725923">ThreadLocal 对象</text>
    <text x="120" y="62" text-anchor="middle" class="s">（key，弱引用）</text>
  </g>

  <g transform="translate(70 330)">
    <rect width="480" height="250" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="240" y="36" text-anchor="middle" class="t" fill="#5e5083">线程 A 的 ThreadLocalMap</text>
    <rect x="40" y="60" width="180" height="60" rx="10" fill="#e3dde2" stroke="#5e5083"/>
    <text x="130" y="86" text-anchor="middle" class="m">弱引用 key</text>
    <text x="130" y="106" text-anchor="middle" class="s">→ ThreadLocal</text>
    <rect x="250" y="60" width="180" height="60" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="340" y="86" text-anchor="middle" class="m">强引用 value</text>
    <text x="340" y="106" text-anchor="middle" class="s">= "alice"</text>
    <text x="240" y="190" text-anchor="middle" class="s">线程 A 拿到 "alice"</text>
  </g>

  <g transform="translate(650 330)">
    <rect width="480" height="250" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="240" y="36" text-anchor="middle" class="t" fill="#5e5083">线程 B 的 ThreadLocalMap</text>
    <rect x="40" y="60" width="180" height="60" rx="10" fill="#e3dde2" stroke="#5e5083"/>
    <text x="130" y="86" text-anchor="middle" class="m">弱引用 key</text>
    <text x="130" y="106" text-anchor="middle" class="s">→ 同一个 ThreadLocal</text>
    <rect x="250" y="60" width="180" height="60" rx="10" fill="#dee3d6" stroke="#466b48"/>
    <text x="340" y="86" text-anchor="middle" class="m">强引用 value</text>
    <text x="340" y="106" text-anchor="middle" class="s">= "bob"</text>
    <text x="240" y="190" text-anchor="middle" class="s">线程 B 拿到 "bob"</text>
  </g>

  <line x1="600" y1="210" x2="220" y2="330" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="210" x2="980" y2="330" stroke="#8a7f6d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70 620)">
    <rect width="1060" height="48" rx="14" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="32" class="b">同一个 ThreadLocal，在不同线程的 map 里映射到不同 value——线程私有就是这样实现的。</text>
  </g>
</svg>
