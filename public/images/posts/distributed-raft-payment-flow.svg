<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" role="img" aria-labelledby="title desc"><title id="title">Raft：哪一步才能确认扣款</title><desc id="desc">Leader 保存当前任期日志并复制。包含自身的多数派持久化后可按规则推进提交，应用带去重的命令再返回业务结果。未达到提交条件时不返回业务成功；响应丢失时客户端沿原编号恢复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="620" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">Raft：哪一步才能确认扣款</text><rect x="50" y="70" width="300" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="98.5" font-size="19" text-anchor="middle" fill="#2b2620">N1 保存日志</text><text x="200" y="123.5" font-size="19" text-anchor="middle" fill="#2b2620">记录 pay-001 扣款命令</text><path d="M200 140 V185" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="50" y="185" width="300" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="213.5" font-size="19" text-anchor="middle" fill="#2b2620">复制给 N2、N3</text><text x="200" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">等待持久化确认</text><path d="M200 255 V300" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="50" y="300" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="331" font-size="19" text-anchor="middle" fill="#2b2620">当前任期满足提交条件？</text><text x="200" y="356" font-size="19" text-anchor="middle" fill="#2b2620">包括多数派持久化</text><path d="M200 375 V425" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="223" y="405" font-size="17" text-anchor="middle" fill="#2b2620">是</text><rect x="50" y="425" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="200" y="456" font-size="19" text-anchor="middle" fill="#2b2620">推进提交并按序应用</text><text x="200" y="481" font-size="19" text-anchor="middle" fill="#2b2620">去重、检查余额、存结果</text><path d="M200 500 V540" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="50" y="540" width="300" height="60" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="200" y="576" font-size="19" text-anchor="middle" fill="#2b2620">返回保存的业务结果</text><path d="M350 338 H450" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="395" y="321" font-size="17" text-anchor="middle" fill="#2b2620">否</text><rect x="450" y="300" width="280" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="331" font-size="19" text-anchor="middle" fill="#2b2620">等待或超时</text><text x="590" y="356" font-size="19" text-anchor="middle" fill="#2b2620">不能返回业务成功</text><path d="M590 300 V220 H350" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="591" y="202" font-size="17" text-anchor="middle" fill="#2b2620">可继续复制</text><rect x="450" y="465" width="280" height="100" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="496" font-size="19" text-anchor="middle" fill="#2b2620">即使已提交</text><text x="590" y="521" font-size="19" text-anchor="middle" fill="#2b2620">响应仍可能丢失</text><text x="590" y="546" font-size="19" text-anchor="middle" fill="#2b2620">客户端用原编号恢复</text><path d="M350 570 H410 V515 H450" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
