<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">先持久转移责任，再推进原消费进度</title><desc id="desc">失败任务持久写入重试路径，目标接管后原进度可以推进；转移结果未知则恢复查询或重读，并通过稳定身份防重复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先持久转移责任，再推进原消费进度</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">原输入处理失败</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">保留事件与来源</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">写入恢复任务</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">必须持久接管</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">推进原进度</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">不能提前确认</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="544" y="245" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="276" font-size="19" text-anchor="middle" fill="#2b2620">恢复执行者</text><text x="650" y="301" font-size="19" text-anchor="middle" fill="#2b2620">按预算到期重试</text><rect x="284" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="276" font-size="19" text-anchor="middle" fill="#2b2620">业务条件与幂等</text><text x="389" y="301" font-size="19" text-anchor="middle" fill="#2b2620">原身份不能改变</text><rect x="24" y="245" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="276" font-size="19" text-anchor="middle" fill="#2b2620">完成或持久隔离</text><text x="129" y="301" font-size="19" text-anchor="middle" fill="#2b2620">业务终态继续可查</text><path d="M650,155 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,282 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,282 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="378" font-size="18" text-anchor="start" fill="#2b2620">迁移到重试路径会改变交付顺序，业务前置条件仍然有效。</text></svg>
