<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" role="img" aria-labelledby="title desc"><title id="title">扣款超时：沿原编号找结果</title><desc id="desc">客户端超时后保留原请求编号，查询权威结果。成功返回原流水，确定失败展示失败，未知或查询不到时退避后查询或使用原编号安全重试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="510" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">扣款超时：沿原编号找结果</text><rect x="270" y="70" width="240" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="98.5" font-size="19" text-anchor="middle" fill="#2b2620">支付 pay-001 超时</text><text x="390" y="123.5" font-size="19" text-anchor="middle" fill="#2b2620">客户端尚不知结果</text><path d="M390 140 V190" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="270" y="190" width="240" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="221" font-size="19" text-anchor="middle" fill="#2b2620">保留 pay-001</text><text x="390" y="246" font-size="19" text-anchor="middle" fill="#2b2620">沿权威路径查询</text><path d="M390 265 V300 H140 V350" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 265 V350" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 265 V300 H640 V350" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="140" y="326" font-size="17" text-anchor="middle" fill="#2b2620">原结果成功</text><text x="444" y="324" font-size="17" text-anchor="middle" fill="#2b2620">未知</text><text x="640" y="326" font-size="17" text-anchor="middle" fill="#2b2620">原结果确定失败</text><rect x="30" y="350" width="220" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="140" y="383.5" font-size="19" text-anchor="middle" fill="#2b2620">返回原扣款流水</text><text x="140" y="408.5" font-size="19" text-anchor="middle" fill="#2b2620">不再次扣款</text><rect x="280" y="350" width="220" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="383.5" font-size="19" text-anchor="middle" fill="#2b2620">继续查询或安全重试</text><text x="390" y="408.5" font-size="19" text-anchor="middle" fill="#2b2620">仍使用原编号</text><rect x="530" y="350" width="220" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="640" y="383.5" font-size="19" text-anchor="middle" fill="#2b2620">展示确定失败</text><text x="640" y="408.5" font-size="19" text-anchor="middle" fill="#2b2620">结束本次处理</text><path d="M390 430 V460 H765 V225 H510" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="637" y="208" font-size="17" text-anchor="middle" fill="#2b2620">退避后重试</text><text x="390" y="495" font-size="17" text-anchor="middle" fill="#2b2620">暂时查不到 ≠ 原扣款失败；不要换新编号再扣一次。</text></svg>
