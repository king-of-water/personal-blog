<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img"><title>权益确认和退款决策</title><desc>查询本单权益，必要时原子关闭发放。已发放记录购买成功，未知保持待确认，确认关闭且不会迟到发放才允许退款。退款未知时查询同一单号，确认成功才能保存终态。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="940" fill="#fdfaf3"/><text class="title" x="480" y="45">权益超时：先确认发放状态，再决定退款</text><rect class="box" x="230" y="85" width="500" height="60" rx="8"/><text x="480" y="122">查询本单权益；必要时请求关闭发放</text><path class="line" d="M480 145 V195"/><path class="box" d="M480 195 L660 245 L480 295 L300 245 Z"/><text class="small" x="480" y="252">本单的确定状态？</text><path class="line" d="M300 245 H170 V365"/><text class="small" x="185" y="228">已发放</text><rect class="ok" x="30" y="365" width="280" height="60" rx="8"/><text x="170" y="402">保存购买成功</text><path class="line" d="M480 295 V365"/><text class="small" x="513" y="328">未知</text><rect class="box" x="340" y="365" width="280" height="60" rx="8"/><text x="480" y="402">保持待确认，继续查</text><text class="small" x="480" y="469">不能因为超时就退款</text><text class="small" x="480" y="500">长期未知则告警、对账</text><path class="line" d="M660 245 H790 V365"/><text class="small" x="781" y="221">已关闭</text><text class="small" x="781" y="247">不会再发放</text><rect class="box" x="645" y="365" width="290" height="60" rx="8"/><text x="790" y="402">保存退款待确认</text><path class="line" d="M790 425 V495"/><rect class="box" x="645" y="495" width="290" height="60" rx="8"/><text x="790" y="532">用 R-P1001 发起退款</text><path class="line" d="M790 555 V625"/><rect class="box" x="645" y="625" width="290" height="60" rx="8"/><text x="790" y="662">查询同一退款单号</text><path class="line" d="M790 685 V705"/><path class="box" d="M790 705 L930 750 L790 795 L650 750 Z"/><text class="small" x="790" y="757">确认退成功？</text><path class="line" d="M790 795 V835"/><text class="small" x="815" y="818">是</text><rect class="ok" x="645" y="835" width="290" height="60" rx="8"/><text x="790" y="872">保存已退款</text><path class="line" d="M650 750 H590 V655 H645"/><text class="small" x="445" y="747">否 / 未知：退避后再查</text><text class="small" x="380" y="902">关闭必须阻止迟到发放；退款也需要恢复</text></svg>
