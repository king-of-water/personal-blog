<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>主库提交与副本可见是两个时间点</title><desc>主库提交后返回成功，同时传输复制日志。副本收到日志后还需应用，应用前查询可能找不到记录。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="50">写成功，不等于副本已经能查到</text><rect class="box" x="290" y="85" width="380" height="60" rx="8"/><text x="480" y="122">主库提交短链接 L100</text><path class="line" d="M400 145 V175 H220 V205"/><path class="line" d="M560 145 V175 H720 V205"/><rect class="box" x="50" y="205" width="340" height="60" rx="8"/><text x="220" y="242">调用方收到创建成功</text><rect class="box" x="550" y="205" width="340" height="60" rx="8"/><text x="720" y="242">主库发送复制日志</text><path class="line" d="M220 265 V315"/><path class="line" d="M720 265 V315"/><rect class="box" x="50" y="315" width="340" height="60" rx="8"/><text x="220" y="352">立即到从库查询 L100</text><rect class="box" x="550" y="315" width="340" height="60" rx="8"/><text x="720" y="352">从库接收并保存日志</text><path class="line" d="M220 375 V435"/><path class="line" d="M720 375 V435"/><rect class="box" x="50" y="435" width="340" height="60" rx="8"/><text x="220" y="472">若尚未应用：查不到记录</text><rect class="box" x="550" y="435" width="340" height="60" rx="8"/><text x="720" y="472">从库应用日志，写入记录</text><path class="line" d="M720 495 V555"/><rect class="ok" x="550" y="555" width="340" height="60" rx="8"/><text x="720" y="592">此后新查询能找到 L100</text><text class="small" x="230" y="570">两条路径并行推进</text><text class="small" x="230" y="602">左边的查询可能赶在应用之前</text></svg>
