<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">同一个日志 RPC 通过 CLI 与 MCP 提供给 Agent</title>
  <desc id="desc">模型产生 Function Call 后，Agent Runtime 可以走 CLI Adapter 或 MCP Client。CLI 与 MCP Server 都把参数转换为同一个日志查询 RPC 请求，差别集中在入口协议、发现方式和结果契约。</desc>
  <rect width="1200" height="760" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="60" y="62" fill="#2b2620" font-size="34" font-weight="700">CLI 与 MCP 可以封装同一个 RPC</text>
    <text x="60" y="96" fill="#6f6659" font-size="17">业务能力相同，入口协议和使用者不同</text>

    <rect x="350" y="132" width="500" height="88" rx="15" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="600" y="168" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">Function Call：query_log(...)</text>
    <text x="600" y="198" text-anchor="middle" fill="#554d42" font-size="15">模型只表达业务动作</text>

    <path d="M600 220 V256" stroke="#5b5245" stroke-width="3"/>
    <path d="M600 256 l-8 -12 h16 z" fill="#5b5245"/>

    <rect x="350" y="266" width="500" height="88" rx="15" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="600" y="302" text-anchor="middle" fill="#2b2620" font-size="22" font-weight="700">Agent Runtime：校验、权限、路由</text>
    <text x="600" y="332" text-anchor="middle" fill="#554d42" font-size="15">根据 Tool Registry 选择 Adapter</text>

    <path d="M600 354 V386 H300 V414" stroke="#5b5245" stroke-width="3" fill="none"/>
    <path d="M600 386 H900 V414" stroke="#5b5245" stroke-width="3" fill="none"/>
    <path d="M300 414 l-8 -12 h16 z" fill="#5b5245"/>
    <path d="M900 414 l-8 -12 h16 z" fill="#5b5245"/>

    <rect x="80" y="424" width="440" height="174" rx="16" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="108" y="463" fill="#2f5d8a" font-size="14" font-weight="700" letter-spacing="2">CLI 路径</text>
    <text x="108" y="503" fill="#2b2620" font-size="21" font-weight="700">log-cli query --trace-id abc123</text>
    <text x="108" y="538" fill="#554d42" font-size="15">参数：argv</text>
    <text x="108" y="566" fill="#554d42" font-size="15">结果：stdout / stderr / exit code</text>
    <text x="108" y="588" fill="#6f6659" font-size="13">人、脚本和拥有 Shell 的 Coding Agent 可直接使用</text>

    <rect x="680" y="424" width="440" height="174" rx="16" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="708" y="463" fill="#2f5d8a" font-size="14" font-weight="700" letter-spacing="2">MCP 路径</text>
    <text x="708" y="503" fill="#2b2620" font-size="21" font-weight="700">tools/call：query_log</text>
    <text x="708" y="538" fill="#554d42" font-size="15">参数：JSON + inputSchema</text>
    <text x="708" y="566" fill="#554d42" font-size="15">结果：Tool Result / structuredContent</text>
    <text x="708" y="588" fill="#6f6659" font-size="13">支持 MCP 的 Host 可统一发现和调用</text>

    <path d="M300 598 V634 H600" stroke="#5b5245" stroke-width="3" fill="none"/>
    <path d="M900 598 V634 H600" stroke="#5b5245" stroke-width="3" fill="none"/>
    <path d="M600 634 V656" stroke="#5b5245" stroke-width="3"/>
    <path d="M600 656 l-8 -12 h16 z" fill="#5b5245"/>

    <rect x="270" y="666" width="660" height="62" rx="14" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
    <text x="600" y="692" text-anchor="middle" fill="#2b2620" font-size="19" font-weight="700">同一个 LogQueryService / RPC Client</text>
    <text x="600" y="716" text-anchor="middle" fill="#554d42" font-size="14">相同数据源 · 相同业务权限 · 相同查询语义</text>
  </g>
</svg>
