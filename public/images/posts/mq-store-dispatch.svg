<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc"><title id="title">正文集中追加，按 Topic 与队列派生索引</title><desc id="desc">经典存储将不同队列正文写入 CommitLog，Reput 顺序解析日志，再构建各条 ConsumeQueue 和 Key 检索索引。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="420" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">正文集中追加，按 Topic 与队列派生索引</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">订单与支付消息</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">不同 Topic、queueId</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">CommitLog</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">集中保存正文</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">Reput 分发</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">解析新增记录</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="250" width="230" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="139" y="281" font-size="19" text-anchor="middle" fill="#2b2620">订单队列索引</text><text x="139" y="306" font-size="19" text-anchor="middle" fill="#2b2620">正文地址与过滤信息</text><rect x="275" y="250" width="230" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="281" font-size="19" text-anchor="middle" fill="#2b2620">支付队列索引</text><text x="390" y="306" font-size="19" text-anchor="middle" fill="#2b2620">独立逻辑位置</text><rect x="526" y="250" width="230" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="641" y="281" font-size="19" text-anchor="middle" fill="#2b2620">Key 检索索引</text><text x="641" y="306" font-size="19" text-anchor="middle" fill="#2b2620">定位候选正文</text><path d="M650,155 V210 H139 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,210 H390 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,210 H641 V250" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="390" font-size="18" text-anchor="start" fill="#2b2620">正文日志、索引分发、消费进度各自推进，不能混成一个 offset。</text></svg>
