<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">从用户峰值换算到各层资源预算</title>
  <desc id="desc">一百万关注用户形成三万九千入口 QPS，经过身份校验、缓存命中和写放大后，应用、数据库与异步消费者分别面对不同负载，热点和重试会改变有效容量。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a7f6d"/></marker></defs>
  <rect width="1440" height="780" fill="#fdfaf3"/>
  <g font-family="system-ui, sans-serif">
    <text x="70" y="70" fill="#2b2620" font-size="34" font-weight="700">入口 QPS 不是数据库和消费者看到的负载</text>
    <text x="70" y="110" fill="#6f6659" font-size="20">缓存会收缩读取，重试与多次访问会放大写入，热点会让集群提前到达局部上限</text>
    <rect x="65" y="165" width="300" height="150" rx="20" fill="#f5f0e4" stroke="#8a7f6d" stroke-width="2"/>
    <text x="215" y="214" text-anchor="middle" fill="#2b2620" font-size="23" font-weight="700">用户峰值</text>
    <text x="215" y="254" text-anchor="middle" fill="#554d42" font-size="18">100 万 × 30% × 1.3 ÷ 10s</text>
    <text x="215" y="286" text-anchor="middle" fill="#8a6b12" font-size="22" font-weight="700">39,000 QPS</text>
    <rect x="560" y="165" width="320" height="150" rx="20" fill="#d8dee0" stroke="#295279" stroke-width="3"/>
    <text x="720" y="214" text-anchor="middle" fill="#2b2620" font-size="23" font-weight="700">应用实例</text>
    <text x="720" y="254" text-anchor="middle" fill="#554d42" font-size="18">目标 p99 下 1,500 QPS / 实例</text>
    <text x="720" y="286" text-anchor="middle" fill="#295279" font-size="22" font-weight="700">46 实例（含余量）</text>
    <rect x="1060" y="165" width="315" height="150" rx="20" fill="#f4eace" stroke="#8a6b12" stroke-width="3"/>
    <text x="1217" y="214" text-anchor="middle" fill="#2b2620" font-size="23" font-weight="700">权威写入</text>
    <text x="1217" y="254" text-anchor="middle" fill="#554d42" font-size="18">唯一检查 + 库存更新 + 记录</text>
    <text x="1217" y="286" text-anchor="middle" fill="#8a6b12" font-size="21" font-weight="700">约 3 次 DB 操作 / 请求</text>
    <path d="M365 240 H545" fill="none" stroke="#8a7f6d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M880 240 H1045" fill="none" stroke="#8a7f6d" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="455" y="217" text-anchor="middle" fill="#6f6659" font-size="16">身份校验 · 限流</text>
    <text x="962" y="217" text-anchor="middle" fill="#6f6659" font-size="16">写放大</text>
    <rect x="115" y="420" width="1210" height="220" rx="22" fill="#fbf8f1" stroke="#8a7f6d" stroke-width="2"/>
    <text x="150" y="463" fill="#6f6659" font-size="17" font-weight="700">改变有效容量的四个倍率</text>
    <g text-anchor="middle">
      <rect x="165" y="500" width="235" height="95" rx="16" fill="#dee3d6"/><text x="282" y="538" fill="#2b2620" font-size="20" font-weight="700">缓存命中</text><text x="282" y="568" fill="#554d42" font-size="16">减少可陈旧读取</text>
      <rect x="455" y="500" width="235" height="95" rx="16" fill="#eed9d3"/><text x="572" y="538" fill="#2b2620" font-size="20" font-weight="700">重试</text><text x="572" y="568" fill="#554d42" font-size="16">增加入口与下游调用</text>
      <rect x="745" y="500" width="235" height="95" rx="16" fill="#f4eace"/><text x="862" y="538" fill="#2b2620" font-size="20" font-weight="700">热点</text><text x="862" y="568" fill="#554d42" font-size="16">局部分片先到上限</text>
      <rect x="1035" y="500" width="235" height="95" rx="16" fill="#d8dee0"/><text x="1152" y="538" fill="#2b2620" font-size="20" font-weight="700">异步批处理</text><text x="1152" y="568" fill="#554d42" font-size="16">降低固定操作成本</text>
    </g>
    <rect x="180" y="687" width="1080" height="42" rx="10" fill="#f5f0e4"/>
    <text x="205" y="714" fill="#554d42" font-size="17">预算中的倍率先用假设占位，压测后必须用版本化的实测数据替换。</text>
  </g>
</svg>
