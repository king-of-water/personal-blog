<svg xmlns="http://www.w3.org/2000/svg" width="780" height="585" viewBox="0 0 780 585" role="img" aria-labelledby="title desc"><title id="title">跨库转账：先准备，再统一决定</title><desc id="desc">协调者要求账户 A 与 B 准备。全部可以提交时可靠记录提交并重复通知，否则在尚未决定提交时按协议记录撤销。已准备参与者若未知最终决定，需要查询和等待，不能自行撤销。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="585" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">跨库转账：先准备，再统一决定</text><rect x="240" y="70" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="101" font-size="19" text-anchor="middle" fill="#2b2620">协调者发送准备请求</text><text x="390" y="126" font-size="19" text-anchor="middle" fill="#2b2620">A 准备扣款，B 准备入账</text><path d="M390 145 V195" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="240" y="195" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="213.5" font-size="19" text-anchor="middle" fill="#2b2620">检查能否准备</text><text x="390" y="238.5" font-size="19" text-anchor="middle" fill="#2b2620">同意前可靠存准备态</text><text x="390" y="263.5" font-size="19" text-anchor="middle" fill="#2b2620">回复同意或拒绝</text><path d="M390 270 V315 H200 V355" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 270 V315 H590 V355" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="200" y="337" font-size="17" text-anchor="middle" fill="#2b2620">全部准备成功</text><text x="590" y="337" font-size="17" text-anchor="middle" fill="#2b2620">未决定提交且准备失败</text><rect x="50" y="355" width="300" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="200" y="386" font-size="19" text-anchor="middle" fill="#2b2620">可靠记录提交决定</text><text x="200" y="411" font-size="19" text-anchor="middle" fill="#2b2620">重复通知并收集确认</text><rect x="440" y="355" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="386" font-size="19" text-anchor="middle" fill="#2b2620">按协议可靠记录撤销</text><text x="590" y="411" font-size="19" text-anchor="middle" fill="#2b2620">重复通知并收集确认</text><rect x="170" y="475" width="440" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="506" font-size="19" text-anchor="middle" fill="#2b2620">已准备，却收不到最终决定？</text><text x="390" y="531" font-size="19" text-anchor="middle" fill="#2b2620">保留准备态，查询并等待可靠决定</text><path d="M200 430 V465 H390 V475" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M590 430 V465 H390 V475" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="200" y="450" font-size="17" text-anchor="middle" fill="#2b2620">通知不可达</text><text x="590" y="450" font-size="17" text-anchor="middle" fill="#2b2620">通知不可达</text><text x="390" y="573" font-size="17" text-anchor="middle" fill="#2b2620">通知失败不改口；参与者不能仅凭超时自行撤销。</text></svg>
