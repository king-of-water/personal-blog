<svg xmlns="http://www.w3.org/2000/svg" width="780" height="405" viewBox="0 0 780 405" role="img" aria-labelledby="title desc"><title id="title">业务先提交，重复由持久结果收敛</title><desc id="desc">收到事件后提交发券事务，随后确认。提交前崩溃则重试；提交后确认前崩溃则重投并读取已有结果。先确认再执行业务会留下遗漏窗口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="405" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">业务先提交，重复由持久结果收敛</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">收到事件</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">业务尚未完成</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">发券数据库事务</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">提交成功</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">发送 ACK</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">或提交消费进度</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="243" width="210" height="80" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="129" y="276.5" font-size="19" text-anchor="middle" fill="#2b2620">提交前崩溃</text><text x="129" y="301.5" font-size="19" text-anchor="middle" fill="#2b2620">回滚后重试</text><rect x="284" y="243" width="210" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="389" y="276.5" font-size="19" text-anchor="middle" fill="#2b2620">提交后、ACK 前崩溃</text><text x="389" y="301.5" font-size="19" text-anchor="middle" fill="#2b2620">重投后查已有结果</text><rect x="544" y="243" width="212" height="80" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="650" y="276.5" font-size="19" text-anchor="middle" fill="#2b2620">错误：先 ACK</text><text x="650" y="301.5" font-size="19" text-anchor="middle" fill="#2b2620">再执行发券</text><path d="M129,155 V243" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M389,155 V243" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="24" y="373" font-size="18" text-anchor="start" fill="#2b2620">异步线程入队不等于持久完成，不能据此提前返回成功。</text></svg>
