<svg xmlns="http://www.w3.org/2000/svg" width="780" height="355" viewBox="0 0 780 355" role="img" aria-labelledby="title desc"><title id="title">版本失效：推进门槛，但不误删更高版本</title><desc id="desc">事件 v42 到达后原子推进 floor 到至少 42，仅删除低于门槛的已有值，保留空缓存或更高版本值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="355" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">版本失效：推进门槛，但不误删更高版本</text><rect x="30" y="75" width="225" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="142.5" y="102" text-anchor="middle" font-size="20" fill="#2b2620">收到事件 v42</text><text x="142.5" y="127" text-anchor="middle" font-size="20" fill="#2b2620">当前 floor = 41</text><rect x="310" y="75" width="225" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="422.5" y="102" text-anchor="middle" font-size="20" fill="#2b2620">floor = max(41, 42)</text><text x="422.5" y="127" text-anchor="middle" font-size="20" fill="#2b2620">门槛推进到 42</text><path d="M255,107 H310" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M423,180 L528,230 L423,280 L318,230 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="423" y="237" text-anchor="middle" font-size="20" fill="#2b2620">存在低版本值？</text><path d="M423,140 V180" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="35" y="200" width="220" height="65" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="145" y="239.5" text-anchor="middle" font-size="20" fill="#2b2620">删除旧值 v41</text><path d="M318,230 H255" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="285" y="211" text-anchor="middle" font-size="18" fill="#2b2620">是</text><rect x="580" y="200" width="170" height="65" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="665" y="227" text-anchor="middle" font-size="20" fill="#2b2620">保留空缓存</text><text x="665" y="252" text-anchor="middle" font-size="20" fill="#2b2620">或 v42 / v43</text><path d="M528,230 H580" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="554" y="211" text-anchor="middle" font-size="18" fill="#2b2620">否</text><text x="35" y="329" text-anchor="start" font-size="18" fill="#2b2620">推进门槛与清理低版本值：同一个不可交错的操作</text></svg>
