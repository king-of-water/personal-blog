<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>固定购买编号与数据库唯一约束</title><desc>同一用户同一购买编号的并发插入由数据库协调。提交者创建订单，重复者在原事务结束后读取原订单并检查参数。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="45">两个请求争同一个购买编号</text><rect class="box" x="270" y="80" width="420" height="60" rx="8"/><text x="480" y="117">尝试插入（用户 42，R100）</text><path class="line" d="M480 140 V185"/><path class="box" d="M480 185 L670 250 L480 315 L290 250 Z"/><text x="480" y="258">数据库返回什么？</text><path class="line" d="M290 250 H145 V350"/><text class="small" x="161" y="234">插入成功</text><rect class="box" x="35" y="350" width="220" height="60" rx="8"/><text x="145" y="387">提交事务</text><path class="line" d="M145 410 V485"/><rect class="ok" x="35" y="485" width="220" height="60" rx="8"/><text x="145" y="522">返回新订单 O900</text><path class="line" d="M480 315 V350"/><text class="small" x="546" y="339">唯一键重复</text><rect class="box" x="310" y="350" width="340" height="60" rx="8"/><text x="480" y="387">结束事务，读取原订单</text><path class="line" d="M480 410 V440"/><path class="box" d="M480 440 L620 495 L480 550 L340 495 Z"/><text x="480" y="503">参数一致？</text><path class="line" d="M480 550 V590"/><text class="small" x="522" y="580">一致</text><rect class="ok" x="325" y="590" width="310" height="60" rx="8"/><text x="480" y="627">返回原订单 O900</text><path class="line" d="M620 495 H720"/><text class="small" x="671" y="478">不一致</text><rect class="box" x="720" y="465" width="205" height="60" rx="8"/><text x="822.5" y="502">拒绝复用编号</text><path class="line" d="M670 250 H820 V350"/><text class="small" x="821" y="235">其他错误</text><rect class="box" x="700" y="350" width="245" height="60" rx="8"/><text x="822.5" y="387">按实际错误处理</text></svg>
