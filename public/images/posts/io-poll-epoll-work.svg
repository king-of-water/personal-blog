<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="title desc"><title id="title">两条路径：名单每次提交，还是登记后复用</title><desc id="desc">poll 每次提交数组，检查监听项并建立本轮等待关系，无就绪事件时睡眠，唤醒后重查并在原位标记。epoll 先登记，通知将候选项入队，等待时复查候选并紧凑返回，之后继续复用登记。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="680" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">两条路径：名单每次提交，还是登记后复用</text><rect x="35" y="80" width="325" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="197.5" y="118.5" font-size="19" text-anchor="middle" fill="#2b2620">poll：每次传完整数组</text><rect x="420" y="80" width="325" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="582.5" y="118.5" font-size="19" text-anchor="middle" fill="#2b2620">epoll_ctl：先登记关注项</text><path d="M197 145 V195" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M582 145 V195" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="35" y="195" width="325" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="197.5" y="226" font-size="19" text-anchor="middle" fill="#2b2620">逐项检查并挂接等待关系</text><text x="197.5" y="251" font-size="19" text-anchor="middle" fill="#2b2620">有对象就绪？</text><rect x="420" y="195" width="325" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="582.5" y="226" font-size="19" text-anchor="middle" fill="#2b2620">登记时检查；后续状态变化</text><text x="582.5" y="251" font-size="19" text-anchor="middle" fill="#2b2620">回调把候选项加入就绪列表</text><path d="M197 270 V330" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="197" y="305" font-size="17" text-anchor="middle" fill="#2b2620">没有</text><rect x="35" y="330" width="325" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="197.5" y="361" font-size="19" text-anchor="middle" fill="#2b2620">无就绪事件则睡眠</text><text x="197.5" y="386" font-size="19" text-anchor="middle" fill="#2b2620">通知唤醒后重查集合</text><path d="M35 367 H15 V233 H35" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M360 233 H390 V470 H360" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="374" y="450" font-size="16" text-anchor="middle" fill="#2b2620">有</text><rect x="35" y="470" width="325" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="197.5" y="501" font-size="19" text-anchor="middle" fill="#2b2620">返回原位置的事件标记</text><text x="197.5" y="526" font-size="19" text-anchor="middle" fill="#2b2620">应用检查数组中的结果</text><path d="M582 270 V330" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="420" y="330" width="325" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="582.5" y="361" font-size="19" text-anchor="middle" fill="#2b2620">epoll_wait 等候候选项</text><text x="582.5" y="386" font-size="19" text-anchor="middle" fill="#2b2620">为空则睡眠，通知到达后唤醒</text><path d="M582 405 V470" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="420" y="470" width="325" height="75" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="582.5" y="501" font-size="19" text-anchor="middle" fill="#2b2620">复查候选，返回一批事件</text><text x="582.5" y="526" font-size="19" text-anchor="middle" fill="#2b2620">应用只遍历本批有效结果</text><path d="M582 545 V580 H765 V367 H745" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="625" font-size="18" text-anchor="middle" fill="#2b2620">两边都能睡眠；关键是跨调用保留什么、唤醒后检查什么。</text><text x="390" y="655" font-size="17" text-anchor="middle" fill="#2b2620">图示简化并发细节；就绪结果不包含请求正文。</text></svg>
