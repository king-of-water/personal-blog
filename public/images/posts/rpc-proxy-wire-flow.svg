<svg xmlns="http://www.w3.org/2000/svg" width="780" height="690" viewBox="0 0 780 690" role="img" aria-labelledby="title desc"><title id="title">一行方法调用，经过两个进程</title><desc id="desc">订单服务调用本地代理并发送方法和参数，库存服务解码、查找处理器并执行本地业务，提交后编码响应。客户端匹配本次调用并结束等待；若超时，保留订单号查询，未知时才按约定安全重试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="690" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">一行方法调用，经过两个进程</text><text x="185" y="70" font-size="18" text-anchor="middle" fill="#2b2620">订单服务进程</text><text x="595" y="70" font-size="18" text-anchor="middle" fill="#2b2620">库存服务进程</text><rect x="40" y="95" width="290" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="185" y="128.5" font-size="19" text-anchor="middle" fill="#2b2620">调用本地代理</text><text x="185" y="153.5" font-size="19" text-anchor="middle" fill="#2b2620">编码方法与参数</text><rect x="450" y="95" width="290" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="128.5" font-size="19" text-anchor="middle" fill="#2b2620">读取完整消息</text><text x="595" y="153.5" font-size="19" text-anchor="middle" fill="#2b2620">解码并查找处理器</text><path d="M330 135 H450" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="120" font-size="17" text-anchor="middle" fill="#2b2620">请求</text><path d="M185 175 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="40" y="245" width="290" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="185" y="278.5" font-size="19" text-anchor="middle" fill="#2b2620">为本次调用等待结果</text><text x="185" y="303.5" font-size="19" text-anchor="middle" fill="#2b2620">同步等待或异步回调</text><path d="M595 175 V245" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="450" y="245" width="290" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="595" y="278.5" font-size="19" text-anchor="middle" fill="#2b2620">校验通过后执行 reserve</text><text x="595" y="303.5" font-size="19" text-anchor="middle" fill="#2b2620">本地事务预占库存</text><path d="M595 325 V405" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="595" y="368" font-size="17" text-anchor="middle" fill="#2b2620">事务提交后</text><rect x="450" y="405" width="290" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="595" y="438.5" font-size="19" text-anchor="middle" fill="#2b2620">编码业务结果</text><text x="595" y="463.5" font-size="19" text-anchor="middle" fill="#2b2620">发送响应与完成状态</text><path d="M740 135 H765 V445 H740" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="595" y="392" font-size="16" text-anchor="middle" fill="#2b2620">方法不存在 / 校验失败：返回错误</text><path d="M450 445 H330" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="430" font-size="17" text-anchor="middle" fill="#2b2620">响应</text><rect x="40" y="405" width="290" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="185" y="438.5" font-size="19" text-anchor="middle" fill="#2b2620">匹配调用、解码结果</text><text x="185" y="463.5" font-size="19" text-anchor="middle" fill="#2b2620">正常返回或抛出异常</text><path d="M185 325 V405" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="185" y="368" font-size="17" text-anchor="middle" fill="#2b2620">完整响应到达</text><path d="M40 285 H18 V595 H40" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="40" y="555" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="145" y="588.5" font-size="19" text-anchor="middle" fill="#2b2620">超时结束本地等待</text><text x="145" y="613.5" font-size="19" text-anchor="middle" fill="#2b2620">远端结果仍可能未知</text><path d="M250 595 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="285" y="555" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="588.5" font-size="19" text-anchor="middle" fill="#2b2620">保留订单号 O100</text><text x="390" y="613.5" font-size="19" text-anchor="middle" fill="#2b2620">查询已提交结果</text><path d="M495 595 H530" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="530" y="555" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="635" y="588.5" font-size="19" text-anchor="middle" fill="#2b2620">仍未知：继续查询</text><text x="635" y="613.5" font-size="19" text-anchor="middle" fill="#2b2620">或按原编号安全重试</text><text x="390" y="671" font-size="17" text-anchor="middle" fill="#2b2620">请求 / 响应配对属于通信层；预占成功以业务事务提交为准。</text></svg>
