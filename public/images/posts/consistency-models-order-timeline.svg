<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">同一订单在不同一致性模型下的可见性</title><desc id="desc">订单支付成功后，最终一致读可能仍显示旧状态，会话保证要求自己看到已写版本，因果一致要求依赖事件不倒序，线性一致要求后发起的读取看见支付成功。</desc><style>.bg{fill:#f7f7f3}.p{fill:#fff;stroke:#d6ded7;stroke-width:2}.g{fill:#17684f}.soft{fill:#e7f1eb}.w{fill:#f4eee1}.t{font:700 25px Arial,'PingFang SC',sans-serif;fill:#1d2823}.b{font:500 18px Arial,'PingFang SC',sans-serif;fill:#3d4b43}.s{font:500 15px Arial,'PingFang SC',sans-serif;fill:#5d6a62}.l{stroke:#637269;stroke-width:3}.d{stroke:#8c998f;stroke-width:3;stroke-dasharray:9 8}</style><rect class="bg" width="1440" height="620"/><text x="70" y="65" class="t">支付成功已经返回后，读取路径被允许看到什么？</text><text x="70" y="98" class="s">同一条订单状态，不同承诺约束的是客户端可观察历史。</text><line x1="170" y1="168" x2="1280" y2="168" class="l"/><circle cx="330" cy="168" r="12" class="g"/><text x="260" y="145" class="b">支付写入返回 PAID v8</text><circle cx="1020" cy="168" r="12" class="g"/><text x="948" y="145" class="b">页面开始读取</text><rect x="70" y="230" width="290" height="265" rx="14" class="p"/><text x="98" y="274" class="t" style="font-size:22px">最终一致</text><text x="98" y="315" class="b">允许：PENDING_PAYMENT v7</text><text x="98" y="350" class="s">副本还未收敛时可读旧值</text><text x="98" y="386" class="s">需要版本、延迟与冲突规则</text><rect x="390" y="230" width="290" height="265" rx="14" class="soft" stroke="#a9c7b5" stroke-width="2"/><text x="418" y="274" class="t" style="font-size:22px">会话保证</text><text x="418" y="315" class="b">要求：至少 PAID v8</text><text x="418" y="350" class="s">携带 minVersion 或路由主库</text><text x="418" y="386" class="s">只保证该会话不倒退</text><rect x="710" y="230" width="290" height="265" rx="14" class="p"/><text x="738" y="274" class="t" style="font-size:22px">因果一致</text><text x="738" y="315" class="b">要求：先见支付，再见发货</text><text x="738" y="350" class="s">保留因果依赖，不管无关并发</text><text x="738" y="386" class="s">需要携带依赖上下文</text><rect x="1030" y="230" width="330" height="265" rx="14" class="w" stroke="#dfcfae" stroke-width="2"/><text x="1058" y="274" class="t" style="font-size:22px">线性一致</text><text x="1058" y="315" class="b">要求：读取必须见 PAID v8</text><text x="1058" y="350" class="s">已返回的写不能被后续读遗漏</text><text x="1058" y="386" class="s">单对象实时语义，常要协调</text><path d="M330 180 V220 M535 180 V220 M855 180 V220 M1195 180 V220" class="d"/><rect x="70" y="535" width="1290" height="43" rx="9" class="g"/><text x="96" y="563" style="font:700 17px Arial,'PingFang SC',sans-serif;fill:#fff">多个对象一起变化另需事务语义：单 Key 线性一致不能让转账的两次更新自动原子化。</text></svg>
