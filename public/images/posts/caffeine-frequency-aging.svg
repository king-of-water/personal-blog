<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc"><title id="title">频率草图：近似计数，再逐渐淡化历史</title><desc id="desc">商品 X 通过哈希定位四个小计数器，假设计数为 5、8、5、6，取最小值得到估算频率 5。采样推进到阈值后计数减半向下取整为 2、4、2、3，估算变成 2。不同 key 可能共享计数位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="440" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">频率草图：近似计数，再逐渐淡化历史</text><rect x="25" y="85" width="180" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="115" y="123.5" font-size="19" text-anchor="middle" fill="#2b2620">商品 key：X</text><path d="M205 117 H285" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="245" y="98" font-size="17" text-anchor="middle" fill="#2b2620">哈希定位</text><rect x="285" y="75" width="215" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="392.5" y="111" font-size="19" text-anchor="middle" fill="#2b2620">四个计数位置</text><text x="392.5" y="136" font-size="19" text-anchor="middle" fill="#2b2620">5 / 8 / 5 / 6</text><path d="M500 117 H565" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="565" y="85" width="190" height="65" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="660" y="123.5" font-size="19" text-anchor="middle" fill="#2b2620">取最小值：5</text><path d="M392 160 V265" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="515" y="218" font-size="18" text-anchor="middle" fill="#2b2620">采样推进到阈值</text><rect x="285" y="265" width="215" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="392.5" y="301" font-size="19" text-anchor="middle" fill="#2b2620">计数减半取整</text><text x="392.5" y="326" font-size="19" text-anchor="middle" fill="#2b2620">2 / 4 / 2 / 3</text><path d="M500 307 H565" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="565" y="275" width="190" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="660" y="313.5" font-size="19" text-anchor="middle" fill="#2b2620">估算变成：2</text><text x="390" y="390" font-size="17" text-anchor="middle" fill="#2b2620">持续访问会补充新计数；停止访问的旧热点逐渐减弱。</text><text x="390" y="423" font-size="17" text-anchor="middle" fill="#2b2620">计数器最多到 15；碰撞与饱和意味着它不是精确访问量。</text></svg>
