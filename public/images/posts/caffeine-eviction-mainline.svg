<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">先看主线：窗口机会 → 比较 → 主缓存流转</title><desc id="desc">新商品进入按最近访问排序的窗口。窗口超预算时选出最旧条目；总容量超限时，用频率比较它与主缓存待淘汰者。胜者留在主缓存试用区，再次命中可晋升，保护区超预算则降级。图示表达逻辑去留。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先看主线：窗口机会 → 比较 → 主缓存流转</text><rect x="25" y="85" width="210" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="130" y="121" font-size="19" text-anchor="middle" fill="#2b2620">① 新商品进窗口</text><text x="130" y="146" font-size="19" text-anchor="middle" fill="#2b2620">命中时更新最近位置</text><path d="M235 127 H275" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="275" y="85" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="385" y="121" font-size="19" text-anchor="middle" fill="#2b2620">② 窗口超预算</text><text x="385" y="146" font-size="19" text-anchor="middle" fill="#2b2620">最旧条目成为候选</text><path d="M495 127 H535" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="535" y="85" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="645" y="121" font-size="19" text-anchor="middle" fill="#2b2620">③ 总容量超限时</text><text x="645" y="146" font-size="19" text-anchor="middle" fill="#2b2620">与主区候选比较频率</text><path d="M645 170 V220 H495" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="580" y="208" font-size="17" text-anchor="middle" fill="#2b2620">留下</text><rect x="275" y="220" width="220" height="85" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="385" y="256" font-size="19" text-anchor="middle" fill="#2b2620">④ 留在主缓存</text><text x="385" y="281" font-size="19" text-anchor="middle" fill="#2b2620">试用 ↔ 保护</text><path d="M645 170 V335 H235" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="25" y="300" width="210" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="130" y="341" font-size="19" text-anchor="middle" fill="#2b2620">淘汰比较中落选者</text><text x="435" y="385" font-size="17" text-anchor="middle" fill="#2b2620">主缓存尚有余量时，无需为了准入强行删除旧条目。</text></svg>
