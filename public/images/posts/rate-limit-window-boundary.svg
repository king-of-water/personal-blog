<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><title>固定窗口：跨秒就得到新额度</title><desc>0.990 秒放行 100 次，1.010 秒又放行 100 次；两个固定窗口分别合规，20 毫秒内总共进入 200 次。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#d8dee0;stroke:#295279;stroke-width:1.5}.no{fill:#eed9d3;stroke:#943b37;stroke-width:1.5}</style><rect width="960" height="520" fill="#fdfaf3"/><text x="480" y="48" class="title">固定窗口：两个窗口分别没超，交界处仍会拥挤</text><rect x="65" y="95" width="390" height="180" rx="10" class="box"/><text x="260" y="140" class="">窗口一：[0.000, 1.000)</text><rect x="505" y="95" width="390" height="180" rx="10" class="box"/><text x="700" y="140" class="">窗口二：[1.000, 2.000)</text><text x="260" y="195" class="">0.990 秒：100 次 → 全部放行</text><text x="700" y="195" class="">1.010 秒：100 次 → 全部放行</text><text x="260" y="240" class="small">本窗口：0 → 100 / 100</text><text x="700" y="240" class="small">新窗口：0 → 100 / 100</text><path d="M480 80 V300" fill="none" stroke="#8a7f6d" stroke-width="2" stroke-dasharray="6 6"/><text x="480" y="325" class="small">1.000 秒切换窗口：之前的计数不再参与判断</text><path class="line" d="M260 275 V360 H360"/><path class="line" d="M700 275 V360 H600"/><rect x="320" y="365" width="320" height="60" rx="10" class="no"/><text x="480" y="403" class="">仅隔 20 毫秒，进入 200 次</text><text x="480" y="472" class="small">限制每个整秒的数量 ≠ 限制任意一秒的数量</text></svg>
