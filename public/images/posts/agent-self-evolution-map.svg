<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 自进化的更新对象</title><desc id="desc">从上下文、记忆、技能、工作流、代码到模型权重，风险、成本和可解释性逐层变化。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">WHAT EVOLVES?</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">“自进化”包含六种不同改动</text><text x="88" y="180" class="sans muted" font-size="21">越靠右，修改越接近系统本体，验证与回滚成本也越高。</text>
  <g transform="translate(80 265)">
    <path d="M75 360H1190" stroke="#176f55" stroke-width="4" marker-end="url(#a)"/><text x="0" y="370" class="mono green" font-size="16">LOW RISK</text><text x="1190" y="400" class="mono green" font-size="16">HIGH RISK</text>
    <g transform="translate(90 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">01 CONTEXT</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">上下文</text><text x="22" y="125" class="sans muted" font-size="17">Prompt</text><text x="22" y="154" class="sans muted" font-size="17">Playbook</text><rect x="22" y="190" width="115" height="31" rx="15" class="accent"/><text x="40" y="211" class="sans green" font-size="15">ACE</text></g>
    <g transform="translate(290 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">02 MEMORY</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">记忆</text><text x="22" y="125" class="sans muted" font-size="17">写入规则</text><text x="22" y="154" class="sans muted" font-size="17">召回与遗忘</text></g>
    <g transform="translate(490 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">03 SKILL</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">技能</text><text x="22" y="125" class="sans muted" font-size="17">步骤与工具</text><text x="22" y="154" class="sans muted" font-size="17">验收方法</text><rect x="22" y="190" width="115" height="31" rx="15" class="accent"/><text x="40" y="211" class="sans green" font-size="15">EvoSkill</text></g>
    <g transform="translate(690 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">04 WORKFLOW</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">流程</text><text x="22" y="125" class="sans muted" font-size="17">规划与路由</text><text x="22" y="154" class="sans muted" font-size="17">工具组合</text></g>
    <g transform="translate(890 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">05 CODE</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">Agent 代码</text><text x="22" y="125" class="sans muted" font-size="17">Loop 与工具</text><text x="22" y="154" class="sans muted" font-size="17">系统实现</text><rect x="22" y="190" width="115" height="31" rx="15" class="accent"/><text x="40" y="211" class="sans green" font-size="15">DGM</text></g>
    <g transform="translate(1090 0)"><rect width="180" height="250" rx="10" class="box"/><text x="22" y="44" class="mono green" font-size="15">06 WEIGHTS</text><text x="22" y="88" class="sans ink" font-size="27" font-weight="700">模型权重</text><text x="22" y="125" class="sans muted" font-size="17">微调与 RL</text><text x="22" y="154" class="sans muted" font-size="17">持续训练</text></g>
  </g>
  <g transform="translate(175 700)"><rect width="1090" height="92" rx="10" class="accent"/><text x="30" y="38" class="mono green" font-size="16">COMMON LOOP</text><text x="30" y="68" class="sans ink" font-size="21" font-weight="650">轨迹 → 失败归因 → 候选修改 → 隔离评测 → 准入 → 发布与回滚</text></g>
  <text x="90" y="850" class="sans muted" font-size="17">一次任务里的反思不会自动成为进化；变化必须被选择、保存，并在下一次任务中复用。</text>
</svg>
