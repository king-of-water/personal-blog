<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Gateway 整体架构</title>
  <desc id="desc">聊天渠道、控制客户端和执行节点连接长驻 Gateway，Gateway 管理路由、会话和自动化，并调用内嵌 Agent Runtime、模型和工具。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5245"/></marker><style>.h{font:700 30px system-ui,"PingFang SC";fill:#2b2620}.s{font:16px system-ui,"PingFang SC";fill:#6f6659}.t{font:700 18px system-ui,"PingFang SC";fill:#2b2620}.b{font:15px system-ui,"PingFang SC";fill:#554d42}.x{font:13px system-ui,"PingFang SC";fill:#6f6659}.l{stroke:#5b5245;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="840" rx="28" fill="#fdfaf3"/>
  <text class="h" x="64" y="62">OpenClaw：Gateway 是跨渠道 Agent 的控制平面</text><text class="s" x="64" y="92">路由、会话、运行和自动化集中管理；模型推理与真实工具执行保持分层。</text>
  <rect x="56" y="148" width="244" height="308" rx="22" fill="#ebe4d4" stroke="#8a7f6d"/>
  <text class="t" x="178" y="185" text-anchor="middle">接入平面</text>
  <rect x="84" y="208" width="188" height="48" rx="11" fill="#fbf8f1"/><text class="b" x="178" y="238" text-anchor="middle">Telegram / WhatsApp</text>
  <rect x="84" y="268" width="188" height="48" rx="11" fill="#fbf8f1"/><text class="b" x="178" y="298" text-anchor="middle">Discord / Slack</text>
  <rect x="84" y="328" width="188" height="48" rx="11" fill="#d8dee0"/><text class="b" x="178" y="358" text-anchor="middle">WebChat / CLI / UI</text>
  <rect x="84" y="388" width="188" height="42" rx="11" fill="#eed9d3"/><text class="x" x="178" y="414" text-anchor="middle">Pairing · allowlist · policy</text>

  <rect x="356" y="122" width="520" height="560" rx="26" fill="#f5f0e4" stroke="#8a7f6d"/>
  <text class="t" x="616" y="160" text-anchor="middle">长驻 Gateway</text>
  <rect x="388" y="190" width="212" height="78" rx="14" fill="#d8dee0" stroke="#2f5d8a"/><text class="t" x="494" y="221" text-anchor="middle">Channel Router</text><text class="x" x="494" y="246" text-anchor="middle">bindings · session key · lastRoute</text>
  <rect x="632" y="190" width="212" height="78" rx="14" fill="#fbf8f1" stroke="#8a7f6d"/><text class="t" x="738" y="221" text-anchor="middle">Gateway Protocol</text><text class="x" x="738" y="246" text-anchor="middle">WebSocket · role · scope · events</text>
  <rect x="388" y="298" width="212" height="78" rx="14" fill="#fbf8f1" stroke="#8a7f6d"/><text class="t" x="494" y="329" text-anchor="middle">Session Store</text><text class="x" x="494" y="354" text-anchor="middle">SQLite · transcript · run ownership</text>
  <rect x="632" y="298" width="212" height="78" rx="14" fill="#dee3d6" stroke="#4f7a52"/><text class="t" x="738" y="329" text-anchor="middle">Automations</text><text class="x" x="738" y="354" text-anchor="middle">jobs · tasks · heartbeat · hooks</text>
  <rect x="388" y="408" width="456" height="192" rx="18" fill="#fbf8f1" stroke="#8a7f6d"/>
  <text class="t" x="616" y="444" text-anchor="middle">Embedded Agent Runtime</text>
  <rect x="416" y="470" width="122" height="88" rx="12" fill="#d8dee0"/><text class="b" x="477" y="503" text-anchor="middle">Prompt</text><text class="x" x="477" y="528" text-anchor="middle">bootstrap</text><text class="x" x="477" y="548" text-anchor="middle">skills</text>
  <rect x="555" y="470" width="122" height="88" rx="12" fill="#dee3d6"/><text class="b" x="616" y="503" text-anchor="middle">Agent Loop</text><text class="x" x="616" y="528" text-anchor="middle">steer</text><text class="x" x="616" y="548" text-anchor="middle">compact</text>
  <rect x="694" y="470" width="122" height="88" rx="12" fill="#eed9d3"/><text class="b" x="755" y="503" text-anchor="middle">Tool Policy</text><text class="x" x="755" y="528" text-anchor="middle">approval</text><text class="x" x="755" y="548" text-anchor="middle">delivery</text>

  <rect x="934" y="148" width="450" height="214" rx="22" fill="#ebe4d4" stroke="#8a7f6d"/>
  <text class="t" x="1159" y="185" text-anchor="middle">推理与知识</text>
  <rect x="964" y="210" width="188" height="58" rx="12" fill="#dee3d6"/><text class="b" x="1058" y="236" text-anchor="middle">Model Providers</text><text class="x" x="1058" y="257" text-anchor="middle">发现 · 路由 · 用量</text>
  <rect x="1168" y="210" width="188" height="58" rx="12" fill="#d8dee0"/><text class="b" x="1262" y="236" text-anchor="middle">Workspace</text><text class="x" x="1262" y="257" text-anchor="middle">AGENTS · MEMORY · Skills</text>
  <rect x="964" y="286" width="392" height="48" rx="12" fill="#fbf8f1"/><text class="b" x="1160" y="316" text-anchor="middle">每个 Agent 独立 state、auth、model 与 session store</text>

  <rect x="934" y="410" width="450" height="272" rx="22" fill="#ebe4d4" stroke="#8a7f6d"/>
  <text class="t" x="1159" y="447" text-anchor="middle">执行平面</text>
  <rect x="964" y="472" width="188" height="72" rx="12" fill="#fbf8f1"/><text class="b" x="1058" y="502" text-anchor="middle">Host Tools</text><text class="x" x="1058" y="527" text-anchor="middle">文件 · exec · browser</text>
  <rect x="1168" y="472" width="188" height="72" rx="12" fill="#d8dee0"/><text class="b" x="1262" y="502" text-anchor="middle">Sandbox</text><text class="x" x="1262" y="527" text-anchor="middle">Docker · SSH · OpenShell</text>
  <rect x="964" y="570" width="188" height="72" rx="12" fill="#dee3d6"/><text class="b" x="1058" y="600" text-anchor="middle">Remote Nodes</text><text class="x" x="1058" y="625" text-anchor="middle">设备与远程能力</text>
  <rect x="1168" y="570" width="188" height="72" rx="12" fill="#eed9d3"/><text class="b" x="1262" y="600" text-anchor="middle">External APIs</text><text class="x" x="1262" y="625" text-anchor="middle">最小凭证与回执</text>
  <path class="l" d="M300 302H348"/><path class="l" d="M876 250H926"/><path class="l" d="M876 520H926"/>
  <rect x="356" y="724" width="1028" height="62" rx="16" fill="#eed9d3"/>
  <text class="b" x="870" y="752" text-anchor="middle">一个 Gateway 是一个信任域：互不信任的用户应拆分 Gateway、OS 用户或主机</text><text class="x" x="870" y="775" text-anchor="middle">Workspace 隔离不等于恶意多租户隔离</text>
</svg>
