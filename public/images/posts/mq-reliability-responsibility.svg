<svg xmlns="http://www.w3.org/2000/svg" width="780" height="425" viewBox="0 0 780 425" role="img" aria-labelledby="title desc"><title id="title">确认交接责任，业务记录保留恢复依据</title><desc id="desc">支付和 Outbox 同事务提交，发送器等待 Broker 确认后标记已发布。消费者先提交发券结果再确认。发送确认不等于发券完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="425" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">确认交接责任，业务记录保留恢复依据</text><rect x="24" y="80" width="210" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">支付 + Outbox</text><text x="129" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">同一事务提交</text><rect x="284" y="80" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">发送器</text><text x="389" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">等待发送确认</text><rect x="544" y="80" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">Broker 接收</text><text x="650" y="138.5" font-size="19" text-anchor="middle" fill="#2b2620">耐久依配置而定</text><path d="M234,120 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,120 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M650,160 V208 H389 V160" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="389" y="198" font-size="17" text-anchor="middle" fill="#2b2620">收到确认才标记已发布</text><rect x="544" y="256" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">消费者</text><text x="650" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">收到支付事件</text><rect x="284" y="256" width="210" height="80" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="389" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">券数据库</text><text x="389" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">发券结果已提交</text><rect x="24" y="256" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">消费确认</text><text x="129" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">宣告处理完成</text><path d="M650,160 V256" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M544,296 H494" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,296 H234" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="385" font-size="18" text-anchor="start" fill="#2b2620">发送未知：Outbox 重发；消费确认未知：重投后查幂等结果。</text></svg>
