<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc"><title id="title">从业务约束收敛候选，不用固定吞吐排名</title><desc id="desc">先判断路由、回放、事务、顺序和延迟要求，再确定确认与恢复契约，最后用同一消息大小、副本和负载条件评估容量与运维成本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="420" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">从业务约束收敛候选，不用固定吞吐排名</text><rect x="24" y="80" width="732" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="121" font-size="19" text-anchor="middle" fill="#2b2620">业务模型：任务路由 / 日志回放 / 顺序 / 延迟 / 事务</text><path d="M390,150 V190" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="190" width="732" height="70" rx="6" fill="#d8dee0" stroke="#295279"/><text x="390" y="231" font-size="19" text-anchor="middle" fill="#2b2620">可靠性契约：确认边界 / 复制 / 保留 / 重试 / 幂等</text><path d="M390,260 V300" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="300" width="732" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="341" font-size="19" text-anchor="middle" fill="#2b2620">容量与维护：消息大小 / 峰值 / 消费能力 / 存储 / 团队经验</text><text x="24" y="404" font-size="18" text-anchor="start" fill="#2b2620">同一产品有多种部署和队列模型；候选需要按实际版本验证。</text></svg>
