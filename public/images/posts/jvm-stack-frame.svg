<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">一个栈帧的四块结构与方法调用链</title>
  <desc id="desc">每个方法被调用时，JVM 在虚拟机栈里压入一个栈帧，栈帧包含局部变量表、操作数栈、动态链接和方法返回地址。方法嵌套调用形成栈帧栈，最上面的栈帧是当前正在执行的方法。</desc>
  <defs>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">方法调用就是往虚拟机栈里压栈帧</text>
  <text x="56" y="88" class="b">最上面的栈帧是当前正在执行的方法；返回时出栈、丢弃。</text>

  <g transform="translate(70 140)">
    <rect width="360" height="450" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="180" y="36" text-anchor="middle" class="t" fill="#5e5083">虚拟机栈</text>
    <text x="180" y="60" text-anchor="middle" class="s">一个方法一个栈帧</text>

    <rect x="30" y="80" width="300" height="72" rx="12" fill="#e3dde2" stroke="#5e5083"/>
    <text x="180" y="112" text-anchor="middle" class="m">栈帧 3：bar()</text>
    <text x="180" y="136" text-anchor="middle" class="s">当前执行</text>

    <rect x="30" y="172" width="300" height="72" rx="12" fill="#e3dde2" stroke="#5e5083"/>
    <text x="180" y="204" text-anchor="middle" class="m">栈帧 2：foo()</text>

    <rect x="30" y="264" width="300" height="72" rx="12" fill="#e3dde2" stroke="#5e5083"/>
    <text x="180" y="296" text-anchor="middle" class="m">栈帧 1：main()</text>

    <text x="180" y="380" text-anchor="middle" class="s">调用链越深，栈帧越多；</text>
    <text x="180" y="404" text-anchor="middle" class="s">无限递归 → StackOverflowError</text>
  </g>

  <line x1="430" y1="365" x2="520" y2="365" stroke="#8a7f6d" stroke-width="3"/>

  <g transform="translate(520 140)">
    <rect width="610" height="450" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="305" y="36" text-anchor="middle" class="t" fill="#466b48">一个栈帧的四块</text>

    <rect x="30" y="60" width="550" height="70" rx="12" fill="#dee3d6" stroke="#466b48"/>
    <text x="305" y="88" text-anchor="middle" class="t" fill="#466b48">局部变量表</text>
    <text x="305" y="114" text-anchor="middle" class="s">参数 + this + 局部变量（按槽 slot 存放）</text>

    <rect x="30" y="145" width="550" height="70" rx="12" fill="#dee3d6" stroke="#466b48"/>
    <text x="305" y="173" text-anchor="middle" class="t" fill="#466b48">操作数栈</text>
    <text x="305" y="199" text-anchor="middle" class="s">字节码运算的工作区：压栈、运算、出栈</text>

    <rect x="30" y="230" width="550" height="70" rx="12" fill="#dee3d6" stroke="#466b48"/>
    <text x="305" y="258" text-anchor="middle" class="t" fill="#466b48">动态链接</text>
    <text x="305" y="284" text-anchor="middle" class="s">指向运行时常量池中该方法的引用</text>

    <rect x="30" y="315" width="550" height="70" rx="12" fill="#dee3d6" stroke="#466b48"/>
    <text x="305" y="343" text-anchor="middle" class="t" fill="#466b48">方法返回地址</text>
    <text x="305" y="369" text-anchor="middle" class="s">正常返回 / 异常返回，都要回到调用点</text>
  </g>
</svg>
