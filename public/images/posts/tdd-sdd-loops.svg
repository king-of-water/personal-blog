<svg xmlns="http://www.w3.org/2000/svg" width="780" height="414" viewBox="0 0 780 414" role="img" aria-labelledby="title desc"><title id="title">功能层面的 SDD，任务内部的 TDD</title><desc id="desc">规格确认需求，方案确定边界，任务内用失败测试、实现、重构循环推进，最后整体验收。技术发现返回方案，需求变化返回规格确认。TDD 是建议组合，不是 SDD 的强制步骤。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="414" fill="#fdfaf3"/><text x="24" y="34" text-anchor="start" font-size="22" fill="#2b2620">功能层面的 SDD，任务内部的 TDD</text><rect x="24" y="77" width="210" height="70" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="106" text-anchor="middle" font-size="19" fill="#2b2620">Spec：确认规则</text><text x="129" y="130" text-anchor="middle" font-size="19" fill="#2b2620">状态 / 幂等 / 范围</text><rect x="284" y="77" width="210" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="106" text-anchor="middle" font-size="19" fill="#2b2620">Plan → Tasks</text><text x="389" y="130" text-anchor="middle" font-size="19" fill="#2b2620">边界与任务拆分</text><rect x="544" y="77" width="212" height="70" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="106" text-anchor="middle" font-size="19" fill="#2b2620">Converge：验收</text><text x="650" y="130" text-anchor="middle" font-size="19" fill="#2b2620">链路与未覆盖风险</text><path d="M234,112 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="284" y="223" width="210" height="80" rx="6" fill="#d8dee0" stroke="#295279"/><text x="389" y="257" text-anchor="middle" font-size="19" fill="#2b2620">任务内 TDD</text><text x="389" y="281" text-anchor="middle" font-size="19" fill="#2b2620">失败 → 实现 → 重构</text><path d="M389,147 V223" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,263 H650 V147" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M284,263 H129 V147" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="145" y="235" text-anchor="start" font-size="17" fill="#2b2620">需求变化先确认</text><text x="24" y="350" text-anchor="start" font-size="18" fill="#2b2620">技术发现回写 Plan；业务规则变化回到 Spec。</text><text x="24" y="387" text-anchor="start" font-size="18" fill="#2b2620">整体验收不能只用任务内的单元测试结果替代。</text></svg>
