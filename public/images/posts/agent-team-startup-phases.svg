<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">任务启动的三个阶段</title>
  <desc id="desc">Leader 先给出初版方案，多个 Worker 并行从各自领域视角给出可行性反馈，Leader 整合反馈形成 OKR，各方确认后才进入执行。</desc>
  <defs>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ink{fill:#2b2620}.muted{fill:#6f6659}.green{fill:#2f6f5f}.line{stroke:#8a7f6d;stroke-width:2}.box{fill:#fffdf8;stroke:#b9ae9c;stroke-width:2}.soft{fill:#f5f0e4}.accent{fill:#dfe9df}.blue{fill:#dce6ee}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6659"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#fdfaf3"/>
  <text x="90" y="70" class="mono green" font-size="17" font-weight="700" letter-spacing="3">TASK STARTUP PROTOCOL</text>
  <text x="90" y="122" class="sans ink" font-size="40" font-weight="720">把执行层的约束提前到规划阶段</text>
  <text x="90" y="158" class="sans muted" font-size="19">三个阶段可以异步并行，代价远低于做到一半才发现方向错误。</text>

  <rect x="90" y="210" width="330" height="330" rx="18" class="soft"/>
  <text x="118" y="252" class="mono green" font-size="15" font-weight="700">PHASE 1 · LEADER PROPOSAL</text>
  <text x="118" y="292" class="sans ink" font-size="25" font-weight="700">给出初版方案</text>
  <text x="118" y="336" class="sans muted" font-size="16">目标与验收口径</text>
  <text x="118" y="366" class="sans muted" font-size="16">大致拆分与依赖关系</text>
  <text x="118" y="396" class="sans muted" font-size="16">每个岗位的职责边界</text>
  <text x="118" y="440" class="sans ink" font-size="16">明确写出：这是草案，</text>
  <text x="118" y="466" class="sans ink" font-size="16">不是已经定稿的命令。</text>

  <path d="M420 375 H480" class="line" marker-end="url(#arrow)"/>

  <rect x="480" y="210" width="480" height="330" rx="18" class="box"/>
  <text x="508" y="252" class="mono green" font-size="15" font-weight="700">PHASE 2 · WORKER FEEDBACK</text>
  <text x="508" y="292" class="sans ink" font-size="25" font-weight="700">并行给出领域反馈</text>
  <rect x="508" y="318" width="130" height="52" rx="10" class="blue"/>
  <text x="573" y="351" class="sans ink" font-size="17" text-anchor="middle">数据侧</text>
  <rect x="654" y="318" width="130" height="52" rx="10" class="accent"/>
  <text x="719" y="351" class="sans ink" font-size="17" text-anchor="middle">缓存侧</text>
  <rect x="800" y="318" width="130" height="52" rx="10" class="blue"/>
  <text x="865" y="351" class="sans ink" font-size="17" text-anchor="middle">压测侧</text>
  <text x="508" y="410" class="sans muted" font-size="16">可行性问题：按这个口径我拿不到数据</text>
  <text x="508" y="438" class="sans muted" font-size="16">资源约束：这个 KR 需要额外权限</text>
  <text x="508" y="466" class="sans muted" font-size="16">替代路径：换一个更省的实现方向</text>
  <text x="508" y="504" class="sans ink" font-size="16">反馈必须落到具体条款，而不是"感觉有风险"。</text>

  <path d="M960 375 H1020" class="line" marker-end="url(#arrow)"/>

  <rect x="1020" y="210" width="330" height="330" rx="18" class="soft"/>
  <text x="1048" y="252" class="mono green" font-size="15" font-weight="700">PHASE 3 · CONSENSUS</text>
  <text x="1048" y="292" class="sans ink" font-size="25" font-weight="700">整合反馈，形成 OKR</text>
  <text x="1048" y="336" class="sans muted" font-size="16">修订后的拆分与依赖</text>
  <text x="1048" y="366" class="sans muted" font-size="16">每条 KR 的 owner 与验收方式</text>
  <text x="1048" y="396" class="sans muted" font-size="16">未决问题与升级路径</text>
  <text x="1048" y="440" class="sans ink" font-size="16">各方确认后进入执行；</text>
  <text x="1048" y="466" class="sans ink" font-size="16">异议在这一步显式记录。</text>

  <path d="M720 540 V600" class="line" marker-end="url(#arrow)"/>
  <text x="742" y="578" class="sans muted" font-size="16">确认</text>

  <rect x="90" y="600" width="1260" height="112" rx="18" class="accent"/>
  <text x="120" y="640" class="mono green" font-size="15" font-weight="700">EXECUTION</text>
  <text x="120" y="676" class="sans ink" font-size="22">执行期同时运行：横向通信、OKR 进度跟踪、方案变更审查</text>
  <text x="120" y="702" class="sans muted" font-size="16">任何一条缺失，前面三个阶段就只是一次性的仪式。</text>
</svg>
