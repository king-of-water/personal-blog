<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="title desc"><title id="title">延迟双删：第二次删除能否赶上旧回填</title><desc id="desc">两条路径都先删除缓存并提交 v42；旧回填在第二次删除之前完成则被清除，在第二次删除之后完成则仍留下旧值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="370" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">延迟双删：第二次删除能否赶上旧回填</text><text x="30" y="68" text-anchor="start" font-size="18" fill="#2b2620">共同前提：DEL① → COMMIT v42；旧读已经拿到 v41</text><text x="30" y="102" text-anchor="start" font-size="18" fill="#2b2620">路径 A：旧回填先完成</text><rect x="30" y="117" width="200" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="130" y="156.5" text-anchor="middle" font-size="20" fill="#2b2620">旧读回填 v41</text><rect x="290" y="117" width="200" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="156.5" text-anchor="middle" font-size="20" fill="#2b2620">延迟 DEL②</text><rect x="550" y="117" width="200" height="65" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="650" y="144" text-anchor="middle" font-size="20" fill="#2b2620">缓存为空</text><text x="650" y="169" text-anchor="middle" font-size="20" fill="#2b2620">下次读回源</text><path d="M230,149 H290" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M490,149 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="228" text-anchor="start" font-size="18" fill="#2b2620">路径 B：旧读暂停得更久</text><rect x="30" y="243" width="200" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="130" y="282.5" text-anchor="middle" font-size="20" fill="#2b2620">延迟 DEL②</text><rect x="290" y="243" width="200" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="282.5" text-anchor="middle" font-size="20" fill="#2b2620">旧读回填 v41</text><rect x="550" y="243" width="200" height="65" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="650" y="270" text-anchor="middle" font-size="20" fill="#2b2620">缓存 v41</text><text x="650" y="295" text-anchor="middle" font-size="20" fill="#2b2620">旧值仍然存在</text><path d="M230,275 H290" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M490,275 H550" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="346" text-anchor="start" font-size="18" fill="#2b2620">固定延迟不能证明所有旧读都已结束</text></svg>
