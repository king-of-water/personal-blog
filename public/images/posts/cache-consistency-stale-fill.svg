<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc"><title id="title">先写库再删除：旧读仍能在删除后回填</title><desc id="desc">R 未命中并读到 v41 后暂停，W 提交 v42 并成功删除缓存，R 随后回填旧值 v41。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="410" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">先写库再删除：旧读仍能在删除后回填</text><rect x="31" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="100" y="85" text-anchor="middle" font-size="20" fill="#2b2620">读请求 R</text><path d="M100,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="221" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="290" y="85" text-anchor="middle" font-size="20" fill="#2b2620">写请求 W</text><path d="M290,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="421" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="490" y="85" text-anchor="middle" font-size="20" fill="#2b2620">数据库</text><path d="M490,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><rect x="611" y="57" width="138" height="42" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="680" y="85" text-anchor="middle" font-size="20" fill="#2b2620">缓存</text><path d="M680,101 V350" stroke="#8a7f6d" stroke-dasharray="5 5"/><path d="M100,135 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="125" text-anchor="middle" font-size="18" fill="#2b2620">1. GET：miss</text><path d="M100,183 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295" y="173" text-anchor="middle" font-size="18" fill="#2b2620">2. 查询 → v41；R 暂停</text><path d="M290,231 H490" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="221" text-anchor="middle" font-size="18" fill="#2b2620">3. COMMIT v42</text><path d="M290,279 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="485" y="269" text-anchor="middle" font-size="18" fill="#2b2620">4. DEL 成功</text><path d="M100,327 H680" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="317" text-anchor="middle" font-size="18" fill="#2b2620">5. R 恢复：SET v41</text><rect x="35" y="362" width="710" height="36" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="390" y="387" text-anchor="middle" font-size="20" fill="#2b2620">删除成功也不能撤销读请求已经拿到的旧快照</text></svg>
