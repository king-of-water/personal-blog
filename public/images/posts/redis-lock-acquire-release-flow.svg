<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img"><title>Redis 锁协调缓存重建的流程</title><desc>缓存未命中时原子获取带过期时间的锁。未获取就有限等待或降级；获取后再次检查缓存，必要时重建，最终比较持有者标识释放锁。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="790" fill="#fdfaf3"/><text class="title" x="480" y="45">缓存未命中后，先协调谁来重建</text><rect class="box" x="250" y="80" width="460" height="60" rx="8"/><text x="480" y="117">SET 锁键 owner NX PX 30000</text><path class="line" d="M480 140 V175"/><path class="box" d="M480 175 L630 230 L480 285 L330 230 Z"/><text class="" x="480" y="238">明确获取成功？</text><path class="line" d="M630 230 H735"/><text class="small" x="680" y="215">未获取</text><rect class="box" x="735" y="200" width="205" height="60" rx="8"/><text x="837.5" y="237">等待或降级</text><path class="line" d="M837 260 V300"/><rect class="box" x="735" y="300" width="205" height="60" rx="8"/><text x="837.5" y="337">再读商品缓存</text><path class="line" d="M480 285 V325"/><text class="small" x="537" y="311">获取成功</text><rect class="box" x="300" y="325" width="360" height="60" rx="8"/><text x="480" y="362">锁内再次读缓存</text><path class="line" d="M480 385 V420"/><path class="box" d="M480 420 L630 475 L480 530 L330 475 Z"/><text class="" x="480" y="483">缓存仍缺失？</text><path class="line" d="M480 530 V570"/><text class="small" x="526" y="556">是</text><rect class="box" x="300" y="570" width="360" height="60" rx="8"/><text x="480" y="607">查数据库，写回缓存</text><path class="line" d="M480 630 V690"/><path class="line" d="M330 475 H175 V720 H300"/><text class="small" x="196" y="461">否：无需重建</text><rect class="box" x="300" y="690" width="360" height="60" rx="8"/><text x="480" y="727">finally：校验 owner 后释放</text><text class="small" x="480" y="780">获取通信异常：不进入重建；任务异常也要尝试释放</text></svg>
