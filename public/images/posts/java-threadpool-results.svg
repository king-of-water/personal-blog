<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-labelledby="title desc"><title id="title">任务失败后：异常退出，还是保存进 Future</title><desc id="desc">直接执行普通 Runnable 的未捕获异常导致工作线程退出；submit 默认包装的 FutureTask 保存失败，通过 get 和 afterExecute 检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="350" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">任务失败后：异常退出，还是保存进 Future</text><rect x="25" y="80" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="102.5" y="111.5" text-anchor="middle" font-size="20" fill="#2b2620">execute</text><text x="102.5" y="136.5" text-anchor="middle" font-size="20" fill="#2b2620">普通 Runnable</text><rect x="217" y="80" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="294.5" y="124" text-anchor="middle" font-size="20" fill="#2b2620">run 抛异常</text><rect x="410" y="80" width="155" height="74" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="487.5" y="124" text-anchor="middle" font-size="20" fill="#2b2620">工作线程退出</text><rect x="602" y="80" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="679.5" y="111.5" text-anchor="middle" font-size="20" fill="#2b2620">未捕获异常</text><text x="679.5" y="136.5" text-anchor="middle" font-size="20" fill="#2b2620">处理器</text><path d="M180,117 H217" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M372,117 H410" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M565,117 H602" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="25" y="220" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="102.5" y="251.5" text-anchor="middle" font-size="20" fill="#2b2620">submit</text><text x="102.5" y="276.5" text-anchor="middle" font-size="20" fill="#2b2620">FutureTask</text><rect x="217" y="220" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="294.5" y="264" text-anchor="middle" font-size="20" fill="#2b2620">run 保存失败</text><rect x="410" y="220" width="155" height="74" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="487.5" y="264" text-anchor="middle" font-size="20" fill="#2b2620">工作线程复用</text><rect x="602" y="220" width="155" height="74" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="679.5" y="251.5" text-anchor="middle" font-size="20" fill="#2b2620">get 报告失败</text><text x="679.5" y="276.5" text-anchor="middle" font-size="20" fill="#2b2620">钩子可以观察</text><path d="M180,257 H217" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M372,257 H410" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M565,257 H602" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="25" y="330" text-anchor="start" font-size="18" fill="#2b2620">前提：普通工作线程执行；任务包装和 CallerRuns 会改变异常路径。</text></svg>
