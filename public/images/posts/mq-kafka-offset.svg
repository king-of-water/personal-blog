<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc"><title id="title">先完成业务，再提交恢复位点</title><desc id="desc">消费者读取订单事件，数据库事务完成去重与状态更新，随后提交下次读取位点。数据库成功但位点提交前崩溃时，新成员重读并命中业务幂等，再安全推进位点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="390" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先完成业务，再提交恢复位点</text><rect x="24" y="80" width="220" height="76" rx="6" fill="#d8dee0" stroke="#295279"/><text x="134" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">读取订单事件</text><text x="134" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">offset 105</text><rect x="280" y="80" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">数据库事务提交</text><text x="390" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">去重键与状态变更</text><rect x="536" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">提交消费位点</text><text x="646" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">下次从 106 继续</text><path d="M244 118 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 118 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 156 V235" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="280" y="235" width="220" height="76" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="390" y="266.5" font-size="19" text-anchor="middle" fill="#2b2620">若位点提交前崩溃</text><text x="390" y="291.5" font-size="19" text-anchor="middle" fill="#2b2620">恢复时重新读取</text><path d="M500 273 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="536" y="235" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="646" y="266.5" font-size="19" text-anchor="middle" fill="#2b2620">命中业务幂等</text><text x="646" y="291.5" font-size="19" text-anchor="middle" fill="#2b2620">再推进消费位点</text><text x="24" y="357" font-size="17" text-anchor="start" fill="#2b2620">示例假定 105 之前都已可靠完成，不能跨过未完成记录提交。</text></svg>
