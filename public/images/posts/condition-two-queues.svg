<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Condition 的条件队列与 AQS 同步队列</title>
  <desc id="desc">AQS 里同时存在两条队列：CLH 同步队列存放等锁的线程，每个 Condition 各有一条独立的条件队列。await 把线程加入条件队列并完全释放锁，被唤醒后从条件队列转移到同步队列重新抢锁；signal 只负责把条件队列头节点转移到同步队列尾部，线程并不会立刻执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466b48"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#295279"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">一个锁，两条队列</text>
  <text x="56" y="84" class="b">await 把线程搬进条件队列，signal 把它搬回同步队列。</text>

  <!-- 同步队列 -->
  <g transform="translate(70 130)">
    <rect width="1060" height="170" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t" fill="#295279">同步队列（CLH）—— 等「锁」的线程在这里</text>

    <rect x="50" y="60" width="120" height="70" rx="10" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
    <text x="110" y="102" text-anchor="middle" class="m">head</text>
    <rect x="230" y="60" width="120" height="70" rx="10" fill="#d8dee0" stroke="#295279"/>
    <text x="290" y="102" text-anchor="middle" class="m">Node A</text>
    <rect x="410" y="60" width="120" height="70" rx="10" fill="#d8dee0" stroke="#295279"/>
    <text x="470" y="102" text-anchor="middle" class="m">Node B</text>
    <rect x="590" y="60" width="120" height="70" rx="10" fill="#d8dee0" stroke="#295279"/>
    <text x="650" y="102" text-anchor="middle" class="m">tail</text>

    <line x1="170" y1="95" x2="230" y2="95" stroke="#295279" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <line x1="350" y1="95" x2="410" y2="95" stroke="#295279" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <line x1="530" y1="95" x2="590" y2="95" stroke="#295279" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <text x="800" y="90" class="s">head 是已拿到锁的节点</text>
    <text x="800" y="118" class="s">队首的后继才有资格抢锁</text>
  </g>

  <!-- 条件队列 -->
  <g transform="translate(70 330)">
    <rect width="1060" height="170" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="28" y="34" class="t" fill="#8a6b31">条件队列 —— 等「条件」的线程在这里（每个 Condition 一条）</text>

    <rect x="50" y="60" width="150" height="70" rx="10" fill="#f4eace" stroke="#8a6b31" stroke-width="2"/>
    <text x="125" y="102" text-anchor="middle" class="m">firstWaiter</text>
    <rect x="260" y="60" width="150" height="70" rx="10" fill="#f4eace" stroke="#8a6b31"/>
    <text x="335" y="102" text-anchor="middle" class="m">Waiter 1</text>
    <rect x="470" y="60" width="150" height="70" rx="10" fill="#f4eace" stroke="#8a6b31"/>
    <text x="545" y="102" text-anchor="middle" class="m">Waiter 2</text>
    <rect x="680" y="60" width="150" height="70" rx="10" fill="#f4eace" stroke="#8a6b31"/>
    <text x="755" y="102" text-anchor="middle" class="m">lastWaiter</text>

    <line x1="200" y1="95" x2="260" y2="95" stroke="#8a6b31" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="410" y1="95" x2="470" y2="95" stroke="#8a6b31" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="620" y1="95" x2="680" y2="95" stroke="#8a6b31" stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="880" y="90" class="s">await() 把线程放进这里</text>
    <text x="880" y="118" class="s">signal() 把队首搬回同步队列</text>
  </g>

  <!-- 搬运 -->
  <path d="M250 300 L250 230" stroke="#8a6b31" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="262" y="270" class="s" fill="#8a6b31">await：同步队列 → 条件队列（并完全释放锁）</text>

  <path d="M700 330 L700 300" stroke="#466b48" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="712" y="322" class="s" fill="#466b48">signal：条件队列 → 同步队列尾部</text>

  <g transform="translate(70 540)">
    <rect width="1060" height="120" rx="16" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="36" class="t">两个容易搞错的点</text>
    <text x="28" y="70" class="b">① await() 会「完全释放」锁（fullyRelease 一次把重入计数清零），否则别人进不来、也就没人 signal → 死锁。</text>
    <text x="28" y="100" class="b">② signal() 只是把节点搬到同步队列，被唤醒的线程还要排队抢锁 —— 所以 signal 之后它不会立刻执行。</text>
  </g>
</svg>
