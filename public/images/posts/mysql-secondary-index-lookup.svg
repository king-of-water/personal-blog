<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">InnoDB 二级索引通过主键回到聚簇索引读取完整行</title>
  <desc id="desc">查询先在 idx_abc 二级索引中按复合键定位并得到主键 id，再使用 id 查询聚簇索引获得 payload；覆盖索引则可在第一棵树结束。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5b5245"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b2620}.sub{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#6f6659}.head{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b2620}.body{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b2620}.mono{font:16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}.line{stroke:#8a7f6d;stroke-width:2;fill:none}.strong{stroke:#5b5245;stroke-width:3;fill:none}.panel{fill:#fbf8f1;stroke:#8a7f6d;stroke-width:2}.node{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:2}.accent{fill:#d8dee0;stroke:#295279;stroke-width:2}.good{fill:#dee3d6;stroke:#466b48;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="760" fill="#fdfaf3"/>
  <text x="76" y="72" class="title">“找到索引记录”和“拿到完整行”可能是两次查树</text>
  <text x="76" y="108" class="sub">二级索引叶子保存索引列与主键；查询其他列时，再按主键访问聚簇索引</text>

  <rect x="72" y="154" width="568" height="492" rx="20" class="panel"/>
  <text x="108" y="205" class="head">二级索引 idx_abc(a,b,c)</text>
  <rect x="226" y="250" width="260" height="62" rx="10" class="accent"/>
  <text x="268" y="289" class="mono">(a,b,c) 路由页</text>
  <path d="M292 312 L210 373 M356 312 L356 373 M420 312 L502 373" class="line"/>
  <rect x="126" y="390" width="168" height="92" rx="10" class="node"/>
  <rect x="308" y="390" width="168" height="92" rx="10" class="good"/>
  <rect x="490" y="390" width="116" height="92" rx="10" class="node"/>
  <text x="145" y="425" class="mono">(1,2,2)</text><text x="145" y="454" class="mono">id=105</text>
  <text x="327" y="425" class="mono">(1,2,3)</text><text x="327" y="454" class="mono">id=106</text>
  <text x="510" y="425" class="mono">…</text>
  <text x="108" y="548" class="body">索引条件命中后得到主键 id=106</text>
  <text x="108" y="582" class="sub">若所需列都在此处，覆盖索引可直接返回</text>

  <path d="M640 417 C740 417 730 417 822 417" class="strong" marker-end="url(#arrow)"/>
  <rect x="665" y="360" width="130" height="40" rx="20" class="accent"/>
  <text x="689" y="386" class="mono">回表 id=106</text>

  <rect x="824" y="154" width="544" height="492" rx="20" class="panel"/>
  <text x="860" y="205" class="head">聚簇索引 PRIMARY(id)</text>
  <rect x="968" y="250" width="256" height="62" rx="10" class="accent"/>
  <text x="1022" y="289" class="mono">id 路由页</text>
  <path d="M1030 312 L950 373 M1096 312 L1096 373 M1162 312 L1242 373" class="line"/>
  <rect x="862" y="390" width="170" height="105" rx="10" class="node"/>
  <rect x="1046" y="390" width="190" height="105" rx="10" class="good"/>
  <rect x="1250" y="390" width="82" height="105" rx="10" class="node"/>
  <text x="887" y="426" class="mono">id=105</text><text x="887" y="458" class="mono">完整行</text>
  <text x="1072" y="426" class="mono">id=106</text><text x="1072" y="458" class="mono">payload + 完整行</text>
  <text x="1272" y="445" class="mono">…</text>
  <text x="860" y="548" class="body">叶子记录直接包含表中其他列</text>
  <text x="860" y="582" class="sub">大量候选记录意味着大量聚簇索引访问</text>

  <text x="76" y="704" class="sub">联合索引缩小候选集；覆盖索引决定是否还要为候选记录支付回表成本</text>
</svg>

