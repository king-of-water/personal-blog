<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">评测的三个层次与三层数据</title><desc id="desc">左侧是结果、轨迹、运行三层评测，右侧是开发集、冻结回归集、隐藏留出集三层数据。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.dark{fill:#222825}.white{fill:#fff}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">EVALUATION LAYERS</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">评什么，用什么数据评</text><text x="88" y="180" class="sans muted" font-size="21">三层评测回答不同问题，三层数据控制过拟合与作弊。</text>
  <g transform="translate(90 240)">
    <text x="0" y="0" class="mono green" font-size="17">评测层次</text>
    <rect x="0" y="25" width="580" height="120" rx="12" class="box"/><text x="24" y="68" class="mono green" font-size="15">OUTCOME</text><text x="24" y="105" class="sans ink" font-size="23" font-weight="700">结果：世界状态与目标是否达成</text><text x="24" y="132" class="sans muted" font-size="16">确定性断言、状态比较</text>
    <rect x="0" y="160" width="580" height="120" rx="12" class="box"/><text x="24" y="203" class="mono green" font-size="15">TRAJECTORY</text><text x="24" y="240" class="sans ink" font-size="23" font-weight="700">轨迹：过程是否合规</text><text x="24" y="267" class="sans muted" font-size="16">结构化事件、权限规则</text>
    <rect x="0" y="295" width="580" height="120" rx="12" class="box"/><text x="24" y="338" class="mono green" font-size="15">OPERATION</text><text x="24" y="375" class="sans ink" font-size="23" font-weight="700">运行：成本、延迟与稳定性</text><text x="24" y="402" class="sans muted" font-size="16">pass@1 · pass^k · 成本前沿</text>
    <text x="700" y="0" class="mono green" font-size="17">数据分层</text>
    <rect x="700" y="25" width="560" height="120" rx="12" class="accent"/><text x="724" y="68" class="mono green" font-size="15">DEVELOPMENT</text><text x="724" y="105" class="sans ink" font-size="23" font-weight="700">开发集</text><text x="724" y="132" class="sans muted" font-size="16">复现问题、生成候选，可暴露给优化器</text>
    <rect x="700" y="160" width="560" height="120" rx="12" class="box"/><text x="724" y="203" class="mono green" font-size="15">FROZEN REGRESSION</text><text x="724" y="240" class="sans ink" font-size="23" font-weight="700">冻结回归集</text><text x="724" y="267" class="sans muted" font-size="16">只暴露任务，不暴露答案</text>
    <rect x="700" y="295" width="560" height="120" rx="12" class="dark"/><text x="724" y="338" class="mono" fill="#9bd4bd" font-size="15">HOLDOUT</text><text x="724" y="375" class="sans white" font-size="23" font-weight="700">隐藏留出集</text><text x="724" y="402" class="sans" fill="#c9d2cd" font-size="16">不暴露，检测过拟合与作弊</text>
  </g>
  <text x="90" y="850" class="sans muted" font-size="17">读取顺序：先确认评测的三层都覆盖，再确认数据的三层互相隔离。</text>
</svg>
