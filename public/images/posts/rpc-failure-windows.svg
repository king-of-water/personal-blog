<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>远程调用的失败窗口</title><desc>请求未发送时可确认本次尝试未执行。发出以后，调用方未获得完整结果时，远端可能正在处理、已经回滚或已经提交，需要按订单号查证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a7f6d" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2620;font-size:22px;text-anchor:middle}.small{font-size:18px}.title{font-size:28px;font-weight:600}.line{fill:none;stroke:#8a7f6d;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f0e4;stroke:#8a7f6d;stroke-width:1.5}.ok{fill:#dee3d6;stroke:#466b48;stroke-width:1.5}</style><rect width="960" height="680" fill="#fdfaf3"/><text class="title" x="480" y="45">断在哪一步，远端事实就可能不同</text><rect class="box" x="55" y="95" width="290" height="60" rx="8"/><text x="200" y="132">本地准备请求</text><path class="line"  d="M200 155 V205"/><rect class="box" x="55" y="205" width="290" height="60" rx="8"/><text x="200" y="242">请求发出、远端排队</text><path class="line"  d="M200 265 V315"/><rect class="box" x="55" y="315" width="290" height="60" rx="8"/><text x="200" y="352">执行预占事务</text><path class="line"  d="M200 375 V425"/><rect class="ok" x="55" y="425" width="290" height="60" rx="8"/><text x="200" y="462">数据库提交完成</text><path class="line"  d="M200 485 V535"/><rect class="ok" x="55" y="535" width="290" height="60" rx="8"/><text x="200" y="572">完整响应返回调用方</text><path class="line"  d="M345 125 H405"/><rect class="box" x="405" y="95" width="500" height="60" rx="8"/><text x="655" y="132">发出前失败：本次尝试未执行</text><path class="line"  d="M345 235 H405"/><rect class="box" x="405" y="205" width="500" height="60" rx="8"/><text x="655" y="242">此时断开：可能未执行，也可能继续</text><path class="line"  d="M345 345 H405"/><rect class="box" x="405" y="315" width="500" height="60" rx="8"/><text x="655" y="352">此时崩溃：可能回滚，调用方需查证</text><path class="line"  d="M345 455 H405"/><rect class="box" x="405" y="425" width="500" height="60" rx="8"/><text x="655" y="462">响应丢失：已预占，调用方仍可能超时</text><path class="line"  d="M345 565 H405"/><rect class="ok" x="405" y="535" width="500" height="60" rx="8"/><text x="655" y="572">成功响应：按接口约定确认已预占</text><text class="small" x="480" y="646">客户端的超时日志，无法单独指出远端停在哪一步</text></svg>
