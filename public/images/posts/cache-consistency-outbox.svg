<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="title desc"><title id="title">可靠失效：提交留下事件，失败保留重试</title><desc id="desc">同一数据库事务更新数据并写事件，提交失败则回滚；提交成功后 Worker 删除缓存，删除失败或超时保留事件重试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="450" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">可靠失效：提交留下事件，失败保留重试</text><rect x="30" y="76" width="260" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="160" y="103" text-anchor="middle" font-size="20" fill="#2b2620">同一数据库事务</text><text x="160" y="128" text-anchor="middle" font-size="20" fill="#2b2620">更新 v42 + 写事件</text><path d="M390,63 L460,108 L390,153 L320,108 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="390" y="115" text-anchor="middle" font-size="20" fill="#2b2620">提交？</text><rect x="535" y="78" width="215" height="60" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="642.5" y="115" text-anchor="middle" font-size="20" fill="#2b2620">回滚，无事件</text><path d="M290,108 H320" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M460,108 H535" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="497" y="94" text-anchor="middle" font-size="18" fill="#2b2620">否</text><rect x="260" y="197" width="260" height="60" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="221.5" text-anchor="middle" font-size="20" fill="#2b2620">Worker 处理事件</text><text x="390" y="246.5" text-anchor="middle" font-size="20" fill="#2b2620">删除缓存 key</text><path d="M390,153 V197" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="414" y="182" text-anchor="middle" font-size="18" fill="#2b2620">是</text><text x="172" y="185" text-anchor="middle" font-size="18" fill="#2b2620">写入确认已返回</text><path d="M390,284 L475,328 L390,372 L305,328 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="390" y="335" text-anchor="middle" font-size="20" fill="#2b2620">删除确认？</text><path d="M390,257 V284" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="555" y="299" width="190" height="60" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="650" y="336" text-anchor="middle" font-size="20" fill="#2b2620">标记已处理</text><path d="M475,328 H555" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="511" y="313" text-anchor="middle" font-size="18" fill="#2b2620">是</text><rect x="30" y="291" width="235" height="75" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="147.5" y="323" text-anchor="middle" font-size="20" fill="#2b2620">保留事件，退避重试</text><text x="147.5" y="348" text-anchor="middle" font-size="20" fill="#2b2620">积压告警 / 接管</text><path d="M305,328 H265" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230" y="279" text-anchor="middle" font-size="18" fill="#2b2620">否 / 超时</text><path d="M147,291 V226 H260" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="147" y="402" text-anchor="start" font-size="18" fill="#2b2620">下一次尝试仍来自可恢复记录</text></svg>
