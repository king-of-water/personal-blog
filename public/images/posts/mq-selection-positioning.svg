<svg xmlns="http://www.w3.org/2000/svg" width="780" height="325" viewBox="0 0 780 325" role="img" aria-labelledby="title desc"><title id="title">先比较消费模型，再比较实现与配置</title><desc id="desc">Kafka 以日志和消费位点组织数据，RocketMQ 提供日志存储及业务消息语义，RabbitMQ 提供交换机路由与多种队列模型。RabbitMQ Streams 支持日志回放，不能一概称为消费即删。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="325" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先比较消费模型，再比较实现与配置</text><rect x="24" y="80" width="230" height="155" rx="6" fill="#d8dee0" stroke="#295279"/><text x="139" y="126" font-size="19" text-anchor="middle" fill="#2b2620">Kafka</text><text x="139" y="151" font-size="19" text-anchor="middle" fill="#2b2620">分区日志与位点</text><text x="139" y="176" font-size="19" text-anchor="middle" fill="#2b2620">保留期内重读</text><text x="139" y="201" font-size="19" text-anchor="middle" fill="#2b2620">流处理与事件数据</text><rect x="275" y="80" width="230" height="155" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="126" font-size="19" text-anchor="middle" fill="#2b2620">RocketMQ</text><text x="390" y="151" font-size="19" text-anchor="middle" fill="#2b2620">日志存储 + 消息语义</text><text x="390" y="176" font-size="19" text-anchor="middle" fill="#2b2620">事务 / 顺序 / 延迟</text><text x="390" y="201" font-size="19" text-anchor="middle" fill="#2b2620">按版本与部署核对</text><rect x="526" y="80" width="230" height="155" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="641" y="126" font-size="19" text-anchor="middle" fill="#2b2620">RabbitMQ</text><text x="641" y="151" font-size="19" text-anchor="middle" fill="#2b2620">交换机与绑定路由</text><text x="641" y="176" font-size="19" text-anchor="middle" fill="#2b2620">Queue / Quorum / Streams</text><text x="641" y="201" font-size="19" text-anchor="middle" fill="#2b2620">模型不同，能力不同</text><text x="24" y="280" font-size="18" text-anchor="start" fill="#2b2620">模型决定接口与恢复方式；吞吐需在相同耐久条件下衡量。</text><text x="24" y="310" font-size="18" text-anchor="start" fill="#2b2620">确认、历史回放和业务完成是三个不同问题。</text></svg>
