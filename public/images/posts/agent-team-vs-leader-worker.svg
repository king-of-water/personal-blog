<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Leader-Worker 星型结构与 Agent Team 信息流对比</title>
  <desc id="desc">左侧 Leader-Worker 结构中 Worker 彼此隔离，信息只能经 Leader 中转；右侧 Agent Team 增加了 Worker 之间的横向通信、共同协商的 OKR 与任务结束后的集体复盘。</desc>
  <defs>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ink{fill:#2b2620}.muted{fill:#6f6659}.green{fill:#2f6f5f}.warn{fill:#a2553f}.line{stroke:#8a7f6d;stroke-width:2}.dash{stroke:#8a7f6d;stroke-width:2;stroke-dasharray:7 6}.box{fill:#fffdf8;stroke:#b9ae9c;stroke-width:2}.soft{fill:#f5f0e4}.accent{fill:#dfe9df}.blue{fill:#dce6ee}.rose{fill:#f0e2dc}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6659"/></marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#6f6659"/></marker>
  </defs>
  <rect width="1440" height="800" fill="#fdfaf3"/>
  <text x="80" y="70" class="mono green" font-size="17" font-weight="700" letter-spacing="3">INFORMATION FLOW</text>
  <text x="80" y="122" class="sans ink" font-size="40" font-weight="720">差别不在有几个 Agent，而在谁可以和谁说话</text>

  <rect x="80" y="170" width="600" height="560" rx="18" class="soft"/>
  <text x="110" y="212" class="mono warn" font-size="15" font-weight="700">LEADER-WORKER</text>
  <text x="110" y="248" class="sans ink" font-size="26" font-weight="700">星型结构：Worker 之间没有通道</text>

  <rect x="300" y="290" width="160" height="76" rx="14" class="box"/>
  <text x="380" y="336" class="sans ink" font-size="21" font-weight="700" text-anchor="middle">Leader</text>
  <text x="380" y="392" class="sans muted" font-size="15" text-anchor="middle">分发 + 验收</text>

  <rect x="140" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="215" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>
  <rect x="320" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="395" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>
  <rect x="500" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="575" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>

  <path d="M320 366 L215 560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M380 366 V560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M440 366 L575 560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>

  <path d="M290 596 H320" class="dash"/>
  <path d="M470 596 H500" class="dash"/>
  <text x="110" y="680" class="sans muted" font-size="16">A 踩到的坑，B 与 C 不会知道；</text>
  <text x="110" y="708" class="sans muted" font-size="16">重复劳动、冲突结论只能等 Leader 事后发现。</text>

  <rect x="760" y="170" width="600" height="560" rx="18" class="accent"/>
  <text x="790" y="212" class="mono green" font-size="15" font-weight="700">AGENT TEAM</text>
  <text x="790" y="248" class="sans ink" font-size="26" font-weight="700">Leader 仍在，但多出三条横向关系</text>

  <rect x="980" y="290" width="160" height="76" rx="14" class="box"/>
  <text x="1060" y="336" class="sans ink" font-size="21" font-weight="700" text-anchor="middle">Leader</text>
  <text x="1060" y="392" class="sans muted" font-size="15" text-anchor="middle">提案 + 兜底</text>

  <rect x="820" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="895" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>
  <rect x="1000" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="1075" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>
  <rect x="1180" y="560" width="150" height="70" rx="14" class="box"/>
  <text x="1255" y="603" class="sans ink" font-size="19" text-anchor="middle">Worker</text>

  <path d="M1000 366 L895 560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M1060 366 V560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M1120 366 L1255 560" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M970 596 H1000" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path d="M1150 596 H1180" class="line" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>

  <text x="790" y="470" class="sans green" font-size="16" font-weight="700">补上的三件事</text>
  <text x="790" y="498" class="sans ink" font-size="16">1 讨论后再执行的启动协议</text>
  <text x="790" y="522" class="sans ink" font-size="16">2 Worker 之间的广播、查询与求助</text>
  <text x="790" y="546" class="sans ink" font-size="16">3 共同协商的 OKR 与集体复盘</text>

  <text x="760" y="680" class="sans muted" font-size="16">横向通道不是全连接：按能力路由 + 通信预算，</text>
  <text x="760" y="708" class="sans muted" font-size="16">否则上下文成本会随 Worker 数量迅速失控。</text>
</svg>
