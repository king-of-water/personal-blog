<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Self-Attention 与 RNN 序列建模的对比：任意距离一步交互 vs 逐步传递</title>
  <desc id="desc">左侧展示 RNN 的序列建模：信息逐步从 h1 传递到 h2、h3、h4，每步都是串行计算，远距离信息经过多次压缩后衰减；右侧展示 Transformer Self-Attention：每个 Token 直接和序列中所有其他 Token 计算注意力权重，任意两点之间只需一步，完全并行。</desc>
  <defs>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ink{fill:#2b2620}.muted{fill:#6f6659}.green{fill:#2f6f5f}.box{fill:#fffdf8;stroke:#b9ae9c;stroke-width:2}.soft{fill:#f5f0e4}.accent{fill:#dfe9df}.blue{fill:#dce6ee}.warn{fill:#fef3ee}</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6659"/></marker>
    <marker id="arr-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c4836a"/></marker>
    <marker id="arr-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f5f"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#fdfaf3"/>

  <!-- Header -->
  <text x="90" y="70" class="mono green" font-size="17" font-weight="700" letter-spacing="3">SELF-ATTENTION VS RNN</text>
  <text x="90" y="122" class="sans ink" font-size="40" font-weight="720">任意两点一步交互，取代逐步传递</text>
  <text x="90" y="158" class="sans muted" font-size="19">Self-Attention 让序列中所有位置直接计算关系，消除 RNN 的串行依赖和长距离衰减。</text>

  <!-- LEFT: RNN -->
  <rect x="90" y="192" width="590" height="530" rx="16" class="warn" style="stroke:#c4836a;stroke-width:2"/>
  <text x="120" y="232" class="mono" font-size="14" font-weight="700" fill="#a04020">RNN（循环神经网络）</text>
  <text x="120" y="260" class="sans ink" font-size="20" font-weight="700">信息逐步传递，串行计算</text>

  <!-- Token inputs -->
  <text x="148" y="310" class="mono ink" font-size="15" text-anchor="middle">The</text>
  <text x="268" y="310" class="mono ink" font-size="15" text-anchor="middle">cat</text>
  <text x="388" y="310" class="mono ink" font-size="15" text-anchor="middle">sat</text>
  <text x="508" y="310" class="mono ink" font-size="15" text-anchor="middle">down</text>

  <!-- Down arrows to hidden states -->
  <path d="M148 318 V348" stroke="#6f6659" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M268 318 V348" stroke="#6f6659" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M388 318 V348" stroke="#6f6659" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M508 318 V348" stroke="#6f6659" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Hidden state boxes -->
  <rect x="116" y="348" width="64" height="44" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:2"/>
  <text x="148" y="376" class="mono ink" font-size="14" text-anchor="middle">h₁</text>

  <rect x="236" y="348" width="64" height="44" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:2"/>
  <text x="268" y="376" class="mono ink" font-size="14" text-anchor="middle">h₂</text>

  <rect x="356" y="348" width="64" height="44" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:2"/>
  <text x="388" y="376" class="mono ink" font-size="14" text-anchor="middle">h₃</text>

  <rect x="476" y="348" width="64" height="44" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:2"/>
  <text x="508" y="376" class="mono ink" font-size="14" text-anchor="middle">h₄</text>

  <!-- Sequential arrows between hidden states -->
  <path d="M180 370 H230" stroke="#c4836a" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <path d="M300 370 H350" stroke="#c4836a" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <path d="M420 370 H470" stroke="#c4836a" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <!-- Labels on arrows -->
  <text x="205" y="364" class="sans muted" font-size="11" text-anchor="middle">串行</text>
  <text x="325" y="364" class="sans muted" font-size="11" text-anchor="middle">串行</text>
  <text x="445" y="364" class="sans muted" font-size="11" text-anchor="middle">串行</text>

  <!-- Problem 1: serial -->
  <rect x="120" y="424" width="530" height="76" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:1.5"/>
  <text x="140" y="450" class="sans ink" font-size="15" font-weight="700" fill="#a04020">问题 1：串行依赖，无法并行</text>
  <text x="140" y="472" class="sans muted" font-size="13">计算 h₄ 必须等 h₃ 算完，h₃ 必须等 h₂……</text>
  <text x="140" y="492" class="sans muted" font-size="13">序列长 1000，就要串行走 1000 步，GPU 的并行能力被浪费</text>

  <!-- Problem 2: long range decay -->
  <rect x="120" y="514" width="530" height="76" rx="10" fill="#fde8de" style="stroke:#c4836a;stroke-width:1.5"/>
  <text x="140" y="540" class="sans ink" font-size="15" font-weight="700" fill="#a04020">问题 2：长距离信息衰减</text>
  <text x="140" y="562" class="sans muted" font-size="13">The（h₁）的信息要经过 h₂ → h₃ → h₄ 三次压缩才到达末端</text>
  <text x="140" y="582" class="sans muted" font-size="13">每次更新都有损失，距离越远越难保留完整语义</text>

  <!-- Distance label -->
  <rect x="120" y="604" width="530" height="96" rx="10" class="soft"/>
  <text x="140" y="630" class="sans ink" font-size="14" font-weight="700">任意两个 Token 之间的"交互距离"</text>
  <text x="140" y="652" class="sans muted" font-size="13">The ↔ down：需经过 3 个中间步骤，路径长度 = 序列长度 - 1</text>
  <text x="140" y="672" class="sans muted" font-size="13">1000 Token 的序列里，第 1 个 Token 和最后一个 Token</text>
  <text x="140" y="692" class="sans muted" font-size="13">之间隔了 999 步——信息能完整保留的概率极低</text>

  <!-- RIGHT: Self-Attention -->
  <rect x="760" y="192" width="590" height="530" rx="16" class="accent" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="790" y="232" class="mono" font-size="14" font-weight="700" fill="#2f6f5f">TRANSFORMER SELF-ATTENTION</text>
  <text x="790" y="260" class="sans ink" font-size="20" font-weight="700">直接计算，全并行</text>

  <!-- Token boxes for attention -->
  <rect x="800" y="290" width="64" height="44" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="832" y="318" class="mono ink" font-size="14" text-anchor="middle">The</text>

  <rect x="900" y="290" width="64" height="44" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="932" y="318" class="mono ink" font-size="14" text-anchor="middle">cat</text>

  <rect x="1000" y="290" width="64" height="44" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="1032" y="318" class="mono ink" font-size="14" text-anchor="middle">sat</text>

  <rect x="1100" y="290" width="64" height="44" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:2"/>
  <text x="1132" y="318" class="mono ink" font-size="14" text-anchor="middle">down</text>

  <!-- All-to-all connections (simplified as curves) -->
  <!-- The ↔ cat -->
  <path d="M864 312 Q898 270 900 312" stroke="#5a9a6a" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- The ↔ sat -->
  <path d="M864 308 Q998 256 1000 308" stroke="#5a9a6a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- The ↔ down (highlighted: long range) -->
  <path d="M864 304 Q1098 242 1100 304" stroke="#2f6f5f" stroke-width="2.5" fill="none"/>
  <!-- cat ↔ sat -->
  <path d="M964 312 Q998 270 1000 312" stroke="#5a9a6a" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- cat ↔ down -->
  <path d="M964 308 Q1098 256 1100 308" stroke="#5a9a6a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- sat ↔ down -->
  <path d="M1064 312 Q1098 270 1100 312" stroke="#5a9a6a" stroke-width="1.5" fill="none" opacity="0.7"/>

  <text x="990" y="248" class="sans ink" font-size="12" fill="#2f6f5f" text-anchor="middle">The ↔ down：1 步直达</text>

  <!-- Benefit 1 -->
  <rect x="790" y="380" width="530" height="76" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:1.5"/>
  <text x="810" y="406" class="sans ink" font-size="15" font-weight="700" fill="#2f6f5f">优势 1：完全并行</text>
  <text x="810" y="428" class="sans muted" font-size="13">所有位置的 Q、K、V 可以同时计算，Q·Kᵀ 是批量矩阵运算</text>
  <text x="810" y="448" class="sans muted" font-size="13">序列长 1000，仍然只需 1 步前向传播，GPU 利用率远高于 RNN</text>

  <!-- Benefit 2 -->
  <rect x="790" y="470" width="530" height="76" rx="10" fill="#d4e8d4" style="stroke:#5a9a6a;stroke-width:1.5"/>
  <text x="810" y="496" class="sans ink" font-size="15" font-weight="700" fill="#2f6f5f">优势 2：无长距离衰减</text>
  <text x="810" y="518" class="sans muted" font-size="13">任意两个 Token 之间的交互距离固定为 1，不管它们相距多远</text>
  <text x="810" y="538" class="sans muted" font-size="13">第 1 个 Token 和第 1000 个 Token 的关系直接通过注意力权重建立</text>

  <!-- Distance label right -->
  <rect x="790" y="560" width="530" height="140" rx="10" class="soft"/>
  <text x="810" y="586" class="sans ink" font-size="14" font-weight="700">代价：计算量 O(N²)</text>
  <text x="810" y="608" class="sans muted" font-size="13">每个 Token 都和所有其他 Token 计算点积，总计算量随序列长度平方增长</text>
  <text x="810" y="628" class="sans muted" font-size="13">1000 Token → 100 万次点积；32K Token → 10 亿次点积</text>
  <text x="810" y="656" class="sans ink" font-size="14" font-weight="700">Flash Attention 的意义</text>
  <text x="810" y="676" class="sans muted" font-size="13">通过分块计算减少显存读写，不改变数学结果，让长上下文 Attention</text>
  <text x="810" y="696" class="sans muted" font-size="13">在实际系统里快 2–4 倍——公式一样，工程实现不同</text>
</svg>
