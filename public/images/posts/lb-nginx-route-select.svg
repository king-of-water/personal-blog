<svg xmlns="http://www.w3.org/2000/svg" width="780" height="665" viewBox="0 0 780 665" role="img" aria-labelledby="title desc"><title id="title">第三处选择：先找业务组，再挑实例</title><desc id="desc">Nginx 取得解密后的 HTTP 请求，按路径选择业务组，再在组内筛选并选择健康实例。应用处理完成后响应代理，由代理交回客户端。路由与副本选择承担不同职责。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="665" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">第三处选择：先找业务组，再挑实例</text><rect x="225" y="75" width="330" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="113.5" font-size="19" text-anchor="middle" fill="#2b2620">Nginx 读取 HTTP 路径</text><path d="M390 140 V180" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="225" y="180" width="330" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="218.5" font-size="19" text-anchor="middle" fill="#2b2620">路径属于哪一项业务？</text><path d="M390 245 V280 H205 V325" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 245 V280 H590 V325" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="205" y="305" font-size="17" text-anchor="middle" fill="#2b2620">/products/42</text><text x="590" y="305" font-size="17" text-anchor="middle" fill="#2b2620">/orders/100</text><rect x="45" y="325" width="320" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="205" y="356" font-size="19" text-anchor="middle" fill="#2b2620">进入商品服务组</text><text x="205" y="381" font-size="19" text-anchor="middle" fill="#2b2620">在健康的 A、B 中选择</text><rect x="430" y="325" width="320" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="356" font-size="19" text-anchor="middle" fill="#2b2620">进入订单服务组</text><text x="590" y="381" font-size="19" text-anchor="middle" fill="#2b2620">在该组健康副本中选择</text><path d="M205 400 V455" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M590 400 V455" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="45" y="455" width="320" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="205" y="493.5" font-size="19" text-anchor="middle" fill="#2b2620">选中 A，转发商品查询</text><rect x="430" y="455" width="320" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="590" y="493.5" font-size="19" text-anchor="middle" fill="#2b2620">选中订单实例，转发查询</text><path d="M205 520 V550 H315 V575" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M590 520 V550 H465 V575" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="225" y="575" width="330" height="65" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="613.5" font-size="19" text-anchor="middle" fill="#2b2620">应用返回结果，Nginx 响应顾客</text></svg>
