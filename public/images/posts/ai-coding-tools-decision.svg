<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 编程工具选型路径</title>
  <desc id="desc">按主要工作方式选择 Cursor、Claude Code、Codex 或 GitHub Copilot。</desc>
  <rect width="1440" height="900" fill="#fdfaf3"/>
  <text x="720" y="82" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">先判断你要把 Agent 放在哪里</text>
  <rect x="500" y="126" width="440" height="84" rx="4" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
  <text x="720" y="178" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="650">一天里，哪一种动作占用你最多时间？</text>

  <line x1="720" y1="210" x2="720" y2="270" stroke="#5b5245" stroke-width="2"/>
  <line x1="210" y1="270" x2="1230" y2="270" stroke="#5b5245" stroke-width="2"/>
  <line x1="210" y1="270" x2="210" y2="328" stroke="#5b5245" stroke-width="2"/>
  <line x1="550" y1="270" x2="550" y2="328" stroke="#5b5245" stroke-width="2"/>
  <line x1="890" y1="270" x2="890" y2="328" stroke="#5b5245" stroke-width="2"/>
  <line x1="1230" y1="270" x2="1230" y2="328" stroke="#5b5245" stroke-width="2"/>

  <rect x="80" y="328" width="260" height="108" rx="4" fill="#f5f0e4" stroke="#8a7f6d"/>
  <text x="210" y="370" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">盯着代码即时修改</text>
  <text x="210" y="402" text-anchor="middle" fill="#6f6659" font-family="Inter, system-ui, sans-serif" font-size="15">高频补全、局部编辑、视觉反馈</text>
  <line x1="210" y1="436" x2="210" y2="500" stroke="#295279" stroke-width="2"/>
  <rect x="80" y="500" width="260" height="122" rx="4" fill="#d8dee0" stroke="#295279" stroke-width="2"/>
  <text x="210" y="550" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Cursor</text>
  <text x="210" y="586" text-anchor="middle" fill="#554d42" font-family="Inter, system-ui, sans-serif" font-size="15">让 Agent 留在编辑器里</text>

  <rect x="420" y="328" width="260" height="108" rx="4" fill="#f5f0e4" stroke="#8a7f6d"/>
  <text x="550" y="370" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">在终端拼装工作流</text>
  <text x="550" y="402" text-anchor="middle" fill="#6f6659" font-family="Inter, system-ui, sans-serif" font-size="15">Shell、管道、Hooks、CI</text>
  <line x1="550" y1="436" x2="550" y2="500" stroke="#466b48" stroke-width="2"/>
  <rect x="420" y="500" width="260" height="122" rx="4" fill="#dee3d6" stroke="#466b48" stroke-width="2"/>
  <text x="550" y="550" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Claude Code</text>
  <text x="550" y="586" text-anchor="middle" fill="#554d42" font-family="Inter, system-ui, sans-serif" font-size="15">让 Agent 成为命令行组件</text>

  <rect x="760" y="328" width="260" height="108" rx="4" fill="#f5f0e4" stroke="#8a7f6d"/>
  <text x="890" y="370" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">委派完整任务再审查</text>
  <text x="890" y="402" text-anchor="middle" fill="#6f6659" font-family="Inter, system-ui, sans-serif" font-size="15">线程、Worktree、Goal、Review</text>
  <line x1="890" y1="436" x2="890" y2="500" stroke="#5e5083" stroke-width="2"/>
  <rect x="760" y="500" width="260" height="122" rx="4" fill="#e3dde2" stroke="#5e5083" stroke-width="2"/>
  <text x="890" y="550" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Codex</text>
  <text x="890" y="586" text-anchor="middle" fill="#554d42" font-family="Inter, system-ui, sans-serif" font-size="15">让 Agent 承担可验收任务</text>

  <rect x="1100" y="328" width="260" height="108" rx="4" fill="#f5f0e4" stroke="#8a7f6d"/>
  <text x="1230" y="370" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="650">围绕 Issue 与 PR 协作</text>
  <text x="1230" y="402" text-anchor="middle" fill="#6f6659" font-family="Inter, system-ui, sans-serif" font-size="15">权限、策略、审计、团队推广</text>
  <line x1="1230" y1="436" x2="1230" y2="500" stroke="#943b37" stroke-width="2"/>
  <rect x="1100" y="500" width="260" height="122" rx="4" fill="#eed9d3" stroke="#943b37" stroke-width="2"/>
  <text x="1230" y="550" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">GitHub Copilot</text>
  <text x="1230" y="586" text-anchor="middle" fill="#554d42" font-family="Inter, system-ui, sans-serif" font-size="15">让 Agent 进入研发平台</text>

  <line x1="210" y1="622" x2="210" y2="704" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="6 7"/>
  <line x1="550" y1="622" x2="550" y2="704" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="6 7"/>
  <line x1="890" y1="622" x2="890" y2="704" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="6 7"/>
  <line x1="1230" y1="622" x2="1230" y2="704" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="6 7"/>
  <rect x="214" y="686" width="1012" height="82" rx="4" fill="#ebe4d4"/>
  <text x="720" y="724" text-anchor="middle" fill="#2b2620" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">团队里可以组合使用，但一个文件在同一时间只交给一个 Agent 修改。</text>
  <text x="720" y="750" text-anchor="middle" fill="#6f6659" font-family="Inter, system-ui, sans-serif" font-size="15">主工具负责日常入口，第二工具负责独立任务或复核，避免上下文和 Git 状态互相覆盖。</text>
</svg>
