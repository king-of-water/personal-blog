<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-labelledby="title desc"><title id="title">固定延迟队列可分档，混排不等于按期限排序</title><desc id="desc">等待队列无业务消费者，TTL 到期经 DLX 进入执行队列；不同逐消息 TTL 混排可能受到队头消息阻碍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="430" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">固定延迟队列可分档，混排不等于按期限排序</text><rect x="24" y="80" width="210" height="75" rx="6" fill="#d8dee0" stroke="#295279"/><text x="129" y="111" font-size="19" text-anchor="middle" fill="#2b2620">固定 TTL 等待队列</text><text x="129" y="136" font-size="19" text-anchor="middle" fill="#2b2620">不设业务消费者</text><rect x="284" y="80" width="210" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="389" y="111" font-size="19" text-anchor="middle" fill="#2b2620">到期进入 DLX</text><text x="389" y="136" font-size="19" text-anchor="middle" fill="#2b2620">转发也有可靠性边界</text><rect x="544" y="80" width="212" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="111" font-size="19" text-anchor="middle" fill="#2b2620">执行队列</text><text x="650" y="136" font-size="19" text-anchor="middle" fill="#2b2620">检查业务当前状态</text><path d="M234,117 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,117 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="24" y="250" width="210" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="129" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">队头 A</text><text x="129" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">等待一小时</text><rect x="284" y="250" width="210" height="80" rx="6" fill="#eed9d3" stroke="#943b37"/><text x="389" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">后方 B</text><text x="389" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">一分钟已经过期</text><rect x="544" y="250" width="212" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="650" y="283.5" font-size="19" text-anchor="middle" fill="#2b2620">死信时机</text><text x="650" y="308.5" font-size="19" text-anchor="middle" fill="#2b2620">仍受队头处理影响</text><path d="M234,290 H284" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M494,290 H544" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="24" y="395" font-size="18" text-anchor="start" fill="#2b2620">消息 TTL、队列 TTL、业务截止时间是三个不同概念。</text></svg>
