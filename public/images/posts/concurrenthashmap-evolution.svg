<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ConcurrentHashMap 从分段锁到 CAS+synchronized 的演进</title>
  <desc id="desc">HashTable 锁整张表，JDK 7 的 ConcurrentHashMap 用分段锁（每段一把锁），JDK 8 放弃分段锁改用 CAS + synchronized，锁的粒度缩小到单个桶，get 完全无锁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 29px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2b2620}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#fdfaf3"/>
  <text x="56" y="54" class="h">把锁做小：HashTable → 分段锁 → 桶级锁</text>
  <text x="56" y="88" class="b">锁的粒度越细，写并发度越高，实现也越复杂。</text>

  <g transform="translate(70 140)">
    <rect width="320" height="430" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#943b37">HashTable</text>
    <rect x="50" y="65" width="220" height="250" rx="14" fill="#eed9d3" stroke="#943b37"/>
    <text x="160" y="120" text-anchor="middle" class="b">一把大锁锁整张表</text>
    <text x="160" y="160" text-anchor="middle" class="s">任何写都串行</text>
    <text x="160" y="200" text-anchor="middle" class="s">读也要加锁</text>
    <text x="160" y="250" text-anchor="middle" class="s">并发度 = 1</text>
    <text x="160" y="330" text-anchor="middle" class="s">几乎不用了</text>
  </g>

  <g transform="translate(440 140)">
    <rect width="320" height="430" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#8a6b31">ConcurrentHashMap · JDK 7</text>
    <rect x="50" y="65" width="220" height="250" rx="14" fill="#f4eace" stroke="#8a6b31"/>
    <text x="160" y="110" text-anchor="middle" class="b">分段锁 Segment</text>
    <text x="160" y="145" text-anchor="middle" class="s">16 段，每段一把锁</text>
    <text x="160" y="180" text-anchor="middle" class="s">写只锁自己那段</text>
    <text x="160" y="215" text-anchor="middle" class="s">不同段可并行写</text>
    <text x="160" y="250" text-anchor="middle" class="s">段内不同桶仍互相阻塞</text>
    <text x="160" y="330" text-anchor="middle" class="s">粒度 = 一段</text>
  </g>

  <g transform="translate(810 140)">
    <rect width="320" height="430" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="160" y="38" text-anchor="middle" class="t" fill="#466b48">ConcurrentHashMap · JDK 8</text>
    <rect x="50" y="65" width="220" height="250" rx="14" fill="#dee3d6" stroke="#466b48"/>
    <text x="160" y="110" text-anchor="middle" class="b">CAS + synchronized</text>
    <text x="160" y="145" text-anchor="middle" class="s">空桶 CAS 直接放（无锁）</text>
    <text x="160" y="180" text-anchor="middle" class="s">非空桶锁桶头节点</text>
    <text x="160" y="215" text-anchor="middle" class="s">get 完全无锁（volatile）</text>
    <text x="160" y="250" text-anchor="middle" class="s">粒度 = 一个桶</text>
    <text x="160" y="330" text-anchor="middle" class="s">并发度最高</text>
  </g>

  <g transform="translate(70 600)">
    <rect width="1060" height="56" rx="14" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="36" class="b">演进主线是「把锁做小」：全表 → 分段 → 单桶；读从「要锁」变成「无锁」。</text>
  </g>
</svg>
