<svg xmlns="http://www.w3.org/2000/svg" width="780" height="435" viewBox="0 0 780 435" role="img" aria-labelledby="title desc"><title id="title">退款：结果未知时保留额度，查询原请求</title><desc id="desc">售后核定可退金额后，支付端预留额度并建立原退款请求。成功转为已退，明确失败按规则恢复，未知时保留额度查询并对账。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="435" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">退款：结果未知时保留额度，查询原请求</text><rect x="24" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="134" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">售后批准退 A</text><text x="134" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">核定可退 109.65 元</text><rect x="280" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">支付端预留额度</text><text x="390" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">创建退款请求 R01</text><rect x="536" y="80" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="111.5" font-size="19" text-anchor="middle" fill="#2b2620">渠道处理原退款</text><text x="646" y="136.5" font-size="19" text-anchor="middle" fill="#2b2620">支付端确认结果</text><path d="M244 118 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M500 118 H536" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M601 156 V210 H134 V258" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="134" y="238" font-size="16" text-anchor="middle" fill="#2b2620">成功</text><path d="M646 156 V222 H390 V258" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="245" font-size="16" text-anchor="middle" fill="#2b2620">明确失败</text><path d="M700 156 V258" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="733" y="210" font-size="16" text-anchor="middle" fill="#2b2620">未知</text><rect x="24" y="258" width="220" height="76" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="134" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">预留转为已退</text><text x="134" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">通知售后与结算调整</text><rect x="280" y="258" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">按规则恢复退款</text><text x="390" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">确认可释放才还额度</text><rect x="536" y="258" width="220" height="76" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="646" y="289.5" font-size="19" text-anchor="middle" fill="#2b2620">原身份继续查询</text><text x="646" y="314.5" font-size="19" text-anchor="middle" fill="#2b2620">无安全恢复则对账</text><path d="M756 296 H768 V118 H756" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="24" y="406" font-size="17" text-anchor="start" fill="#2b2620">未知资金结果不新建退款，也不释放本次预留额度。</text></svg>
