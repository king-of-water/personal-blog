<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">红黑树的五条性质与旋转</title>
  <desc id="desc">红黑树用五条性质保证近似平衡：节点非红即黑、根为黑、叶子 NIL 为黑、红节点的子节点必须为黑、任一节点到其所有叶子的路径黑色节点数相同。这些性质把最长路径限制在最短路径两倍以内，树高为 O(log n)。违反性质时靠左旋右旋加重新着色修正。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a7f6d"/></marker>
    <style>.h{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#2b2620}.t{font:700 19px ui-sans-serif,system-ui,sans-serif}.b{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#554d42}.s{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#6f6659}.m{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace}.n{font:600 15px ui-sans-serif,system-ui,sans-serif}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fdfaf3"/>
  <text x="56" y="52" class="h">红黑树：五条性质把树高压在 O(log n)</text>
  <text x="56" y="84" class="b">节点用 B（黑）/ R（红）标注，不靠颜色单独传意。</text>

  <!-- 树 -->
  <g transform="translate(60 120)">
    <rect width="560" height="440" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="280" y="36" text-anchor="middle" class="t">一棵红黑树</text>

    <line x1="280" y1="100" x2="180" y2="170" stroke="#8a7f6d" stroke-width="2.5"/>
    <line x1="280" y1="100" x2="380" y2="170" stroke="#8a7f6d" stroke-width="2.5"/>
    <line x1="180" y1="210" x2="120" y2="280" stroke="#8a7f6d" stroke-width="2.5"/>
    <line x1="180" y1="210" x2="240" y2="280" stroke="#8a7f6d" stroke-width="2.5"/>
    <line x1="380" y1="210" x2="320" y2="280" stroke="#8a7f6d" stroke-width="2.5"/>
    <line x1="380" y1="210" x2="440" y2="280" stroke="#8a7f6d" stroke-width="2.5"/>

    <circle cx="280" cy="80" r="30" fill="#2b2620" stroke="#2b2620" stroke-width="3"/>
    <text x="280" y="86" text-anchor="middle" class="m" fill="#ffffff">10B</text>

    <circle cx="180" cy="190" r="30" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
    <text x="180" y="196" text-anchor="middle" class="m" fill="#943b37">5R</text>

    <circle cx="380" cy="190" r="30" fill="#eed9d3" stroke="#943b37" stroke-width="3"/>
    <text x="380" y="196" text-anchor="middle" class="m" fill="#943b37">15R</text>

    <circle cx="120" cy="300" r="30" fill="#2b2620" stroke="#2b2620" stroke-width="3"/>
    <text x="120" y="306" text-anchor="middle" class="m" fill="#ffffff">3B</text>

    <circle cx="240" cy="300" r="30" fill="#2b2620" stroke="#2b2620" stroke-width="3"/>
    <text x="240" y="306" text-anchor="middle" class="m" fill="#ffffff">7B</text>

    <circle cx="320" cy="300" r="30" fill="#2b2620" stroke="#2b2620" stroke-width="3"/>
    <text x="320" y="306" text-anchor="middle" class="m" fill="#ffffff">12B</text>

    <circle cx="440" cy="300" r="30" fill="#2b2620" stroke="#2b2620" stroke-width="3"/>
    <text x="440" y="306" text-anchor="middle" class="m" fill="#ffffff">18B</text>

    <text x="280" y="380" text-anchor="middle" class="s">每条路径上的黑色节点数相同（这里都是 2 个）</text>
    <text x="280" y="410" text-anchor="middle" class="s">红节点 5R、15R 的子节点都是黑色 → 没有红红相连</text>
  </g>

  <!-- 五条性质 -->
  <g transform="translate(650 120)">
    <rect width="490" height="440" rx="18" fill="#f5f0e4" stroke="#d7cebd"/>
    <text x="245" y="36" text-anchor="middle" class="t" fill="#466b48">五条性质</text>
    <text x="30" y="78" class="b">① 每个节点是红色或黑色</text>
    <text x="30" y="114" class="b">② 根节点是黑色</text>
    <text x="30" y="150" class="b">③ 每个叶子节点（NIL）是黑色</text>
    <text x="30" y="186" class="b" fill="#943b37">④ 红节点的两个子节点必须是黑色</text>
    <text x="30" y="222" class="b" fill="#943b37">⑤ 任一节点到它所有叶子的路径，</text>
    <text x="44" y="248" class="b" fill="#943b37">黑色节点数相同</text>

    <rect x="30" y="276" width="430" height="140" rx="12" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="50" y="304" class="b">④⑤ 合起来 ⇒ 最长路径 ≤ 2 × 最短路径</text>
    <text x="50" y="334" class="s">最短路径全黑；最长路径只能黑红交替</text>
    <text x="50" y="362" class="s">⇒ 树高 O(log n)，查/插/删都是 O(log n)</text>
    <text x="50" y="394" class="s">违反时靠左旋、右旋 + 重新着色修正</text>
  </g>

  <!-- 旋转与代价 -->
  <g transform="translate(60 580)">
    <rect width="1080" height="110" rx="16" fill="#ebe4d4" stroke="#8a7f6d"/>
    <text x="28" y="34" class="t">为什么不用 AVL 树</text>
    <text x="28" y="66" class="b">AVL 平衡更严格（查询略快），但增删要旋转更多次；红黑树放松平衡，换更少旋转。</text>
    <text x="28" y="94" class="s">HashMap 是「增删查都频繁」的场景，所以选红黑树：插入最多 2 次旋转，删除最多 3 次。</text>
  </g>
</svg>
