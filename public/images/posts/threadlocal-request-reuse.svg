<svg xmlns="http://www.w3.org/2000/svg" width="780" height="365" viewBox="0 0 780 365" role="img" aria-labelledby="title desc"><title id="title">同一个工作线程：请求结束不等于绑定结束</title><desc id="desc">路径 A 设置 user-A 后不清理，路径 B 同线程读取到 user-A；finally 清理后下一次读取才没有旧用户。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="365" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">同一个工作线程：请求结束不等于绑定结束</text><text x="25" y="77" text-anchor="start" font-size="18" fill="#2b2620">没有清理</text><rect x="25" y="95" width="205" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="127.5" y="123.5" text-anchor="middle" font-size="20" fill="#2b2620">请求 A</text><text x="127.5" y="148.5" text-anchor="middle" font-size="20" fill="#2b2620">set(user-A)</text><rect x="290" y="95" width="205" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="392.5" y="123.5" text-anchor="middle" font-size="20" fill="#2b2620">A 结束</text><text x="392.5" y="148.5" text-anchor="middle" font-size="20" fill="#2b2620">工作线程继续存活</text><rect x="555" y="95" width="200" height="68" rx="7" fill="#eed9d3" stroke="#943b37"/><text x="655" y="123.5" text-anchor="middle" font-size="20" fill="#2b2620">请求 B：get</text><text x="655" y="148.5" text-anchor="middle" font-size="20" fill="#2b2620">读到 user-A</text><path d="M230,129 H290" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M495,129 H555" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="25" y="215" text-anchor="start" font-size="18" fill="#2b2620">顶层范围 finally 清理</text><rect x="25" y="233" width="205" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="127.5" y="261.5" text-anchor="middle" font-size="20" fill="#2b2620">请求 A</text><text x="127.5" y="286.5" text-anchor="middle" font-size="20" fill="#2b2620">set(user-A)</text><rect x="290" y="233" width="205" height="68" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="392.5" y="261.5" text-anchor="middle" font-size="20" fill="#2b2620">A 结束</text><text x="392.5" y="286.5" text-anchor="middle" font-size="20" fill="#2b2620">finally remove</text><rect x="555" y="233" width="200" height="68" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="655" y="261.5" text-anchor="middle" font-size="20" fill="#2b2620">请求 B：get</text><text x="655" y="286.5" text-anchor="middle" font-size="20" fill="#2b2620">没有旧用户</text><path d="M230,267 H290" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M495,267 H555" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="25" y="344" text-anchor="start" font-size="18" fill="#2b2620">不需要 GC：ThreadLocal key 仍然有效，也会发生串用。</text></svg>
