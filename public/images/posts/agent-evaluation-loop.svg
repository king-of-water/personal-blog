<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评测闭环</title><desc id="desc">真实任务被整理成任务契约，Agent 在隔离环境中运行并接受结果、轨迹和运行评测，失败分类后进入回归集，线上新失败继续回流。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.dark{fill:#222825}.white{fill:#fff}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">EVALUATION LOOP</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">一次评测怎样变成长期回归</text><text x="88" y="180" class="sans muted" font-size="21">从真实任务出发，记录执行证据，定位失败，再把新问题沉淀进任务集。</text>
  <g transform="translate(70 270)">
    <rect width="220" height="135" rx="10" class="box"/><text x="24" y="42" class="mono green" font-size="15">01 TASKS</text><text x="24" y="80" class="sans ink" font-size="24" font-weight="700">真实任务</text><text x="24" y="110" class="sans muted" font-size="17">成功 · 失败 · 边界</text><path d="M220 67H305" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="315" width="230" height="135" rx="10" class="box"/><text x="339" y="42" class="mono green" font-size="15">02 CONTRACT</text><text x="339" y="80" class="sans ink" font-size="24" font-weight="700">任务契约</text><text x="339" y="110" class="sans muted" font-size="17">环境 · 结果 · 边界</text><path d="M545 67H630" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="640" width="300" height="135" rx="10" class="dark"/><text x="664" y="42" class="mono" fill="#9bd4bd" font-size="15">03 RUN</text><text x="664" y="80" class="sans white" font-size="24" font-weight="700">隔离运行</text><text x="664" y="110" class="sans" fill="#c9d2cd" font-size="17">版本 · Trace · Artifact</text><path d="M940 67H1025" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1035" width="260" height="135" rx="10" class="accent"/><text x="1059" y="42" class="mono green" font-size="15">04 GRADE</text><text x="1059" y="80" class="sans ink" font-size="24" font-weight="700">三层评测</text><text x="1059" y="110" class="sans muted" font-size="17">结果 · 轨迹 · 运行</text>
    <path d="M1165 135V235" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="955" y="245" width="340" height="135" rx="10" class="box"/><text x="979" y="287" class="mono green" font-size="15">05 DIAGNOSE</text><text x="979" y="325" class="sans ink" font-size="24" font-weight="700">失败分类</text><text x="979" y="355" class="sans muted" font-size="17">定位任务、工具或运行时问题</text>
    <path d="M955 312H855" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="515" y="245" width="330" height="135" rx="10" class="box"/><text x="539" y="287" class="mono green" font-size="15">06 REGRESSION</text><text x="539" y="325" class="sans ink" font-size="24" font-weight="700">回归任务集</text><text x="539" y="355" class="sans muted" font-size="17">修复当前问题，守住已有能力</text>
    <path d="M515 312H415" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="75" y="245" width="330" height="135" rx="10" class="box"/><text x="99" y="287" class="mono green" font-size="15">07 ONLINE</text><text x="99" y="325" class="sans ink" font-size="24" font-weight="700">线上失败回流</text><text x="99" y="355" class="sans muted" font-size="17">脱敏 · 复现 · 补充契约</text>
    <path d="M75 312H15V67H0" stroke="#176f55" stroke-width="3" fill="none" marker-end="url(#a)"/>
  </g>
  <g transform="translate(190 720)"><rect width="1060" height="74" rx="10" class="accent"/><text x="28" y="47" class="sans ink" font-size="20" font-weight="650">程序断言检查事实，轨迹规则检查边界，Judge 补充开放判断。</text></g>
  <text x="90" y="850" class="sans muted" font-size="17">评测的长期价值来自可以复现的任务、可执行的标准和能够解释失败的轨迹。</text>
</svg>
