<svg xmlns="http://www.w3.org/2000/svg" width="780" height="730" viewBox="0 0 780 730" role="img" aria-labelledby="title desc"><title id="title">三处选择，处理不同粒度的流量</title><desc id="desc">DNS 查询返回区域入口地址，网页请求不经 DNS 转发。浏览器连接该入口，NLB 为连接选择 Nginx，Nginx 解密并解析 HTTP 后为请求选择应用实例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="730" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">三处选择，处理不同粒度的流量</text><rect x="240" y="80" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="111" font-size="19" text-anchor="middle" fill="#2b2620">浏览器打开商品 42</text><text x="390" y="136" font-size="19" text-anchor="middle" fill="#2b2620">先取得区域入口地址</text><rect x="580" y="80" width="180" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="670" y="111" font-size="19" text-anchor="middle" fill="#2b2620">DNS 查询分支</text><text x="670" y="136" font-size="19" text-anchor="middle" fill="#2b2620">返回入口地址</text><path d="M540 105 H580" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M580 140 H540" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M390 155 V225" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="390" y="195" font-size="17" text-anchor="middle" fill="#2b2620">连接返回的入口地址</text><rect x="240" y="225" width="300" height="75" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="256" font-size="19" text-anchor="middle" fill="#2b2620">NLB 四层入口</text><text x="390" y="281" font-size="19" text-anchor="middle" fill="#2b2620">为连接选择后端目标</text><path d="M390 300 V340 H210 V390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M390 300 V340 H570 V390" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="210" y="368" font-size="17" text-anchor="middle" fill="#2b2620">例如连接 C1</text><text x="570" y="368" font-size="17" text-anchor="middle" fill="#2b2620">另一连接 C2</text><rect x="55" y="390" width="310" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="210" y="423.5" font-size="19" text-anchor="middle" fill="#2b2620">Nginx G1</text><text x="210" y="448.5" font-size="19" text-anchor="middle" fill="#2b2620">TLS 终止，按 HTTP 路由</text><rect x="415" y="390" width="310" height="80" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="570" y="423.5" font-size="19" text-anchor="middle" fill="#2b2620">Nginx G2</text><text x="570" y="448.5" font-size="19" text-anchor="middle" fill="#2b2620">TLS 终止，按 HTTP 路由</text><path d="M210 470 V520 H315 V560" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M570 470 V520 H465 V560" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="190" y="560" width="400" height="90" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="390" y="586" font-size="19" text-anchor="middle" fill="#2b2620">商品后端组：A 与 B</text><text x="390" y="611" font-size="19" text-anchor="middle" fill="#2b2620">每台 Nginx 按规则选择业务实例</text><text x="390" y="636" font-size="19" text-anchor="middle" fill="#2b2620">返回结果，经入口响应客户端</text><text x="390" y="690" font-size="17" text-anchor="middle" fill="#2b2620">同一连接固定经过 G1，也可以由 G1 为不同 HTTP 请求选择 A 或 B。</text></svg>
