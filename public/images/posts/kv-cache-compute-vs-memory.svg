<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">没有 KV Cache 与有 KV Cache 的推理对比</title>
  <desc id="desc">左侧展示无缓存时每步都重新计算所有 Token 的 K 和 V，计算量随序列长度平方增长；右侧展示有 KV Cache 时每步只计算新 Token 的 K/V 并追加到缓存，历史 K/V 从显存直接读取，计算量线性增长但显存占用随上下文线性增长。</desc>
  <defs>
    <style>.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.ink{fill:#2b2620}.muted{fill:#6f6659}.green{fill:#2f6f5f}.line{stroke:#8a7f6d;stroke-width:2}.box{fill:#fffdf8;stroke:#b9ae9c;stroke-width:2}.soft{fill:#f5f0e4}.accent{fill:#dfe9df}.blue{fill:#dce6ee}.warn{fill:#f0e2dc}.warnstroke{stroke:#c4836a;stroke-width:2}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f6659"/></marker>
  </defs>
  <rect width="1440" height="780" fill="#fdfaf3"/>

  <text x="90" y="70" class="mono green" font-size="17" font-weight="700" letter-spacing="3">KV CACHE EFFECT</text>
  <text x="90" y="122" class="sans ink" font-size="40" font-weight="720">同一个优化，让计算省了、让显存贵了</text>
  <text x="90" y="158" class="sans muted" font-size="19">KV Cache 把重复计算换成了显存读取；上下文越长，节省越大，占用越多。</text>

  <!-- Left panel: no cache -->
  <rect x="90" y="196" width="590" height="536" rx="18" class="warn" style="fill:#fef3ee;stroke:#c4836a;stroke-width:2"/>
  <text x="120" y="236" class="mono" font-size="14" font-weight="700" fill="#a04020">WITHOUT KV CACHE</text>
  <text x="120" y="264" class="sans ink" font-size="22" font-weight="700">每步重新计算所有 Token 的 K 和 V</text>

  <!-- Step 1 -->
  <text x="120" y="308" class="sans muted" font-size="14">Step 1 — 生成 Token₂：</text>
  <rect x="120" y="318" width="64" height="32" rx="8" class="blue"/>
  <text x="152" y="340" class="mono ink" font-size="13" text-anchor="middle">T₁</text>
  <path d="M184 334 H220" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="318" width="90" height="32" rx="8" fill="#e8e0d0" stroke="#b9ae9c" stroke-width="1.5"/>
  <text x="265" y="340" class="mono ink" font-size="12" text-anchor="middle">K₁V₁ 计算</text>
  <text x="328" y="340" class="sans muted" font-size="13">→ 输出 T₂</text>

  <!-- Step 2 -->
  <text x="120" y="378" class="sans muted" font-size="14">Step 2 — 生成 Token₃：</text>
  <rect x="120" y="388" width="64" height="32" rx="8" class="blue"/>
  <text x="152" y="410" class="mono ink" font-size="13" text-anchor="middle">T₁</text>
  <rect x="194" y="388" width="64" height="32" rx="8" class="blue"/>
  <text x="226" y="410" class="mono ink" font-size="13" text-anchor="middle">T₂</text>
  <path d="M258 404 H294" class="line" marker-end="url(#arrow)"/>
  <rect x="294" y="388" width="130" height="32" rx="8" fill="#e8e0d0" stroke="#b9ae9c" stroke-width="1.5"/>
  <text x="359" y="410" class="mono ink" font-size="12" text-anchor="middle">K₁V₁ K₂V₂ 全算</text>
  <text x="440" y="410" class="sans muted" font-size="13">→ T₃</text>

  <!-- Step N -->
  <text x="120" y="448" class="sans muted" font-size="14">Step N — 生成 TokenN：</text>
  <text x="120" y="472" class="sans ink" font-size="15">T₁ T₂ T₃ … T_{N-1}</text>
  <path d="M310 468 H346" class="line" marker-end="url(#arrow)"/>
  <rect x="346" y="456" width="160" height="32" rx="8" fill="#e8e0d0" stroke="#b9ae9c" stroke-width="1.5"/>
  <text x="426" y="478" class="mono ink" font-size="12" text-anchor="middle">K₁V₁…K_{N-1}V_{N-1} 全算</text>

  <rect x="120" y="510" width="530" height="72" rx="12" fill="#fde8de" stroke="#c4836a" stroke-width="1.5"/>
  <text x="140" y="540" class="sans ink" font-size="16" font-weight="700" fill="#a04020">代价：计算量 ∝ N²</text>
  <text x="140" y="566" class="sans muted" font-size="14">生成第 N 个 Token 要把前 N-1 个 Token 的 K/V 全部重新算一遍</text>

  <rect x="120" y="600" width="530" height="100" rx="12" class="soft"/>
  <text x="140" y="630" class="sans muted" font-size="14">Attention 的本质：Q·Kᵀ / √d → softmax → × V</text>
  <text x="140" y="658" class="sans muted" font-size="14">每个 Token 的 K 和 V 只取决于该 Token 本身的输入，</text>
  <text x="140" y="682" class="sans muted" font-size="14">不同步骤之间它们的值完全相同——重算是纯粹的浪费。</text>

  <!-- Right panel: with cache -->
  <rect x="760" y="196" width="590" height="536" rx="18" class="accent" style="fill:#edf5ed;stroke:#5a9a6a;stroke-width:2"/>
  <text x="790" y="236" class="mono" font-size="14" font-weight="700" fill="#2f6f5f">WITH KV CACHE</text>
  <text x="790" y="264" class="sans ink" font-size="22" font-weight="700">只算新 Token，历史 K/V 从显存读</text>

  <!-- Step 1 -->
  <text x="790" y="308" class="sans muted" font-size="14">Step 1 — 生成 Token₂：</text>
  <rect x="790" y="318" width="64" height="32" rx="8" class="blue"/>
  <text x="822" y="340" class="mono ink" font-size="13" text-anchor="middle">T₁</text>
  <path d="M854 334 H890" class="line" marker-end="url(#arrow)"/>
  <rect x="890" y="318" width="90" height="32" rx="8" fill="#d4e8d4" stroke="#5a9a6a" stroke-width="1.5"/>
  <text x="935" y="340" class="mono ink" font-size="12" text-anchor="middle">K₁V₁ 写缓存</text>
  <text x="996" y="340" class="sans muted" font-size="13">→ T₂</text>

  <!-- Step 2 -->
  <text x="790" y="378" class="sans muted" font-size="14">Step 2 — 生成 Token₃：</text>
  <rect x="790" y="388" width="64" height="32" rx="8" class="blue"/>
  <text x="822" y="410" class="mono ink" font-size="13" text-anchor="middle">T₂</text>
  <path d="M854 404 H890" class="line" marker-end="url(#arrow)"/>
  <rect x="890" y="388" width="90" height="32" rx="8" fill="#d4e8d4" stroke="#5a9a6a" stroke-width="1.5"/>
  <text x="935" y="410" class="mono ink" font-size="12" text-anchor="middle">K₂V₂ 追加</text>
  <text x="996" y="410" class="sans muted" font-size="13">K₁V₁ 直接读 → T₃</text>

  <!-- Step N -->
  <text x="790" y="448" class="sans muted" font-size="14">Step N — 生成 TokenN：</text>
  <rect x="790" y="458" width="64" height="32" rx="8" class="blue"/>
  <text x="822" y="480" class="mono ink" font-size="13" text-anchor="middle">T_{N-1}</text>
  <path d="M854 474 H890" class="line" marker-end="url(#arrow)"/>
  <rect x="890" y="458" width="90" height="32" rx="8" fill="#d4e8d4" stroke="#5a9a6a" stroke-width="1.5"/>
  <text x="935" y="480" class="mono ink" font-size="12" text-anchor="middle">K_{N-1}V_{N-1}</text>
  <text x="996" y="480" class="sans muted" font-size="13">历史 K/V 读缓存 → T_N</text>

  <rect x="790" y="510" width="530" height="72" rx="12" fill="#d4e8d4" stroke="#5a9a6a" stroke-width="1.5"/>
  <text x="810" y="540" class="sans ink" font-size="16" font-weight="700" fill="#2f6f5f">收益：计算量 ∝ N（只算新 Token）</text>
  <text x="810" y="566" class="sans muted" font-size="14">每步只做 1 个 Token 的 K/V 计算，历史部分从显存读取</text>

  <rect x="790" y="600" width="530" height="100" rx="12" class="soft"/>
  <text x="810" y="630" class="sans ink" font-size="15" font-weight="700">代价：显存占用 ∝ N × 层数 × 头数 × 头维度 × 精度</text>
  <text x="810" y="658" class="sans muted" font-size="14">上下文 128K Token 的缓存大小从几 GB 到几十 GB 不等，</text>
  <text x="810" y="682" class="sans muted" font-size="14">并发请求越多，显存压力越高。</text>
</svg>
