<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 0 780 455" role="img" aria-labelledby="title desc"><title id="title">先看三步：登记、通知、领取</title><desc id="desc">epoll_ctl 管理全部监听登记并建立通知关联；B 和 D 的状态变化使回调取得对应记录并加入就绪队列，epoll_wait 复查候选并返回事件。红黑树用于管理登记，事件到来不必先查询红黑树。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="455" fill="#fdfaf3"/><text x="24" y="34" font-size="22" text-anchor="start" fill="#2b2620">先看三步：登记、通知、领取</text><rect x="30" y="85" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="140" y="121" font-size="19" text-anchor="middle" fill="#2b2620">① epoll_ctl 登记</text><text x="140" y="146" font-size="19" text-anchor="middle" fill="#2b2620">记录要关注的连接</text><path d="M250 128 H280" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="280" y="85" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="121" font-size="19" text-anchor="middle" fill="#2b2620">② B、D 发生事件</text><text x="390" y="146" font-size="19" text-anchor="middle" fill="#2b2620">回调取得对应记录</text><path d="M500 128 H530" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="530" y="85" width="220" height="85" rx="6" fill="#dee3d6" stroke="#466b48"/><text x="640" y="121" font-size="19" text-anchor="middle" fill="#2b2620">③ epoll_wait 领取</text><text x="640" y="146" font-size="19" text-anchor="middle" fill="#2b2620">复查并返回就绪事件</text><path d="M140 170 V255" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="30" y="255" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="140" y="291" font-size="19" text-anchor="middle" fill="#2b2620">红黑树：全部登记项</text><text x="140" y="316" font-size="19" text-anchor="middle" fill="#2b2620">服务于查找和增删改</text><path d="M390 170 V255" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="280" y="255" width="220" height="85" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="390" y="291" font-size="19" text-anchor="middle" fill="#2b2620">就绪队列：候选项</text><text x="390" y="316" font-size="19" text-anchor="middle" fill="#2b2620">按条件加入 B、D</text><path d="M500 297 H640 V170" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="390" y="397" font-size="18" text-anchor="middle" fill="#2b2620">状态通知通过已建立的关联取得记录，不必先查红黑树。</text><text x="390" y="430" font-size="17" text-anchor="middle" fill="#2b2620">事件不是请求正文；返回以后，应用才实际读取数据。</text></svg>
