<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-labelledby="title desc"><title id="title">读取流程：命中与回填是两条路径</title><desc id="desc">读取缓存，命中则返回；未命中则查询数据库、回填并设置 TTL，再返回查询结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="320" fill="#fdfaf3"/><text x="26" y="35" text-anchor="start" font-size="22" fill="#2b2620">读取流程：命中与回填是两条路径</text><rect x="35" y="85" width="160" height="60" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="115" y="122" text-anchor="middle" font-size="20" fill="#2b2620">读取缓存 key</text><path d="M300,75 L365,115 L300,155 L235,115 Z" fill="#ebe4d4" stroke="#8a7f6d"/><text x="300" y="122" text-anchor="middle" font-size="20" fill="#2b2620">命中？</text><rect x="465" y="85" width="260" height="60" rx="7" fill="#dee3d6" stroke="#466b48"/><text x="595" y="122" text-anchor="middle" font-size="20" fill="#2b2620">返回缓存值</text><path d="M195,115 H235" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M365,115 H465" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="405" y="99" text-anchor="middle" font-size="18" fill="#2b2620">是</text><rect x="210" y="210" width="185" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="302.5" y="237" text-anchor="middle" font-size="20" fill="#2b2620">查询数据库</text><text x="302.5" y="262" text-anchor="middle" font-size="20" fill="#2b2620">得到 v41</text><rect x="435" y="210" width="180" height="65" rx="7" fill="#f5f0e4" stroke="#8a7f6d"/><text x="525" y="249.5" text-anchor="middle" font-size="20" fill="#2b2620">回填 + TTL</text><path d="M300,155 V210" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="323" y="189" text-anchor="middle" font-size="18" fill="#2b2620">否</text><path d="M395,242 H435" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M615,242 H715" fill="none" stroke="#8a7f6d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="711" y="227" text-anchor="middle" font-size="18" fill="#2b2620">返回</text><text x="711" y="259" text-anchor="middle" font-size="18" fill="#2b2620">查询结果</text></svg>
