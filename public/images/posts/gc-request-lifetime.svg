<svg xmlns="http://www.w3.org/2000/svg" width="780" height="325" viewBox="0 0 780 325" role="img" aria-labelledby="title desc"><title id="title">请求结束后：检查所有强引用路径</title><desc id="desc">请求栈、缓存和异步队列都可以持有查询结果。请求返回只断开栈路径，缓存与排队任务仍能让结果存活；全部强路径断开后才具备回收条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8a7f6d"/></marker></defs><rect width="780" height="325" fill="#fdfaf3"/><text x="24" y="34" text-anchor="start" font-size="22" fill="#2b2620">请求结束后：检查所有强引用路径</text><rect x="24" y="72" width="155" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="101.5" y="98.5" text-anchor="middle" font-size="19" fill="#2b2620">请求栈</text><text x="101.5" y="122.5" text-anchor="middle" font-size="19" fill="#2b2620">有效局部引用</text><rect x="24" y="177" width="155" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="101.5" y="203.5" text-anchor="middle" font-size="19" fill="#2b2620">运行时入口</text><text x="101.5" y="227.5" text-anchor="middle" font-size="19" fill="#2b2620">静态持有者</text><rect x="265" y="72" width="185" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="357.5" y="98.5" text-anchor="middle" font-size="19" fill="#2b2620">订单缓存</text><text x="357.5" y="122.5" text-anchor="middle" font-size="19" fill="#2b2620">尚未删除的条目</text><rect x="265" y="177" width="185" height="65" rx="6" fill="#f5f0e4" stroke="#8a7f6d"/><text x="357.5" y="203.5" text-anchor="middle" font-size="19" fill="#2b2620">异步队列</text><text x="357.5" y="227.5" text-anchor="middle" font-size="19" fill="#2b2620">捕获结果的任务</text><rect x="560" y="126" width="195" height="65" rx="6" fill="#d8dee0" stroke="#295279"/><text x="657.5" y="152.5" text-anchor="middle" font-size="19" fill="#2b2620">查询结果</text><text x="657.5" y="176.5" text-anchor="middle" font-size="19" fill="#2b2620">及响应缓冲</text><path d="M179,104 H220 V59 H657 V126" fill="none" stroke="#8a7f6d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M179,209 H223 V104 H265" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M223,209 H265" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M450,104 H505 V147 H560" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M450,209 H505 V171 H560" fill="none" stroke="#8a7f6d" stroke-width="1.5"  marker-end="url(#arrow)"/><text x="24" y="280" text-anchor="start" font-size="17" fill="#2b2620">虚线：请求返回后断开的路径；实线：仍然存在的强路径。</text><text x="24" y="307" text-anchor="start" font-size="17" fill="#2b2620">移除一个持有者，不能替代检查其他持有者。</text></svg>
