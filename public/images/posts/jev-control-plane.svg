<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Jev 选择性控制架构</title><desc id="desc">Jev 对有界决策返回选项和置信度，高置信低风险动作直接执行，其他任务升级到强模型。</desc>
  <defs><style>.bg{fill:#f5f4ef}.ink{fill:#1c201d}.muted{fill:#6f7670}.green{fill:#176f55}.accent{fill:#e4f1eb}.box{fill:#fff;stroke:#d8dcd6;stroke-width:2}.dark{fill:#222825}.white{fill:#fff}.sans{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176f55"/></marker></defs>
  <rect width="1440" height="900" class="bg"/><text x="88" y="78" class="mono green" font-size="19" font-weight="700" letter-spacing="3">SELECTIVE CONTROL</text><text x="88" y="137" class="sans ink" font-size="46" font-weight="760">让快决策与慢推理分工</text><text x="88" y="180" class="sans muted" font-size="21">Jev 负责类型化选择，强模型只处理低置信、生成式和高风险任务。</text>
  <g transform="translate(90 275)">
    <rect width="270" height="150" rx="12" class="box"/><text x="28" y="46" class="mono green" font-size="16">AGENT STATE</text><text x="28" y="85" class="sans ink" font-size="25" font-weight="700">上下文与候选动作</text><text x="28" y="119" class="sans muted" font-size="18">非结构化状态输入</text><path d="M270 75H380" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/>
    <rect x="390" width="310" height="150" rx="12" class="dark"/><text x="418" y="46" class="mono" fill="#9bd4bd" font-size="16">SYSTEM ONE · JEV</text><text x="418" y="85" class="sans white" font-size="26" font-weight="700">choice + probability</text><text x="418" y="119" class="sans" fill="#c9d2cd" font-size="18">不生成自由文本</text>
    <path d="M700 75H800" stroke="#176f55" stroke-width="3" marker-end="url(#a)"/><rect x="810" y="0" width="360" height="150" rx="12" class="accent"/><text x="838" y="45" class="mono green" font-size="16">CONFIDENCE GATE</text><text x="838" y="84" class="sans ink" font-size="25" font-weight="700">置信度 × 风险 × 类型</text><text x="838" y="118" class="sans muted" font-size="18">决定执行还是升级</text>
    <path d="M990 150V245H810" stroke="#176f55" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="480" y="205" width="330" height="145" rx="12" class="box"/><text x="508" y="249" class="mono green" font-size="16">DIRECT ACTION</text><text x="508" y="288" class="sans ink" font-size="25" font-weight="700">高置信、低风险</text><text x="508" y="320" class="sans muted" font-size="18">路由 · 打分 · 停止</text>
    <path d="M1170 75H1250V430H910" stroke="#176f55" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="480" y="385" width="430" height="150" rx="12" class="box"/><text x="508" y="431" class="mono green" font-size="16">SYSTEM TWO · STRONG LLM</text><text x="508" y="470" class="sans ink" font-size="25" font-weight="700">复杂推理与开放生成</text><text x="508" y="504" class="sans muted" font-size="18">澄清 · 规划 · 参数生成 · 综合答案</text>
  </g>
  <text x="90" y="850" class="sans muted" font-size="17">置信门不是“超过阈值就执行”：授权边界和不可逆动作必须拥有独立的硬规则。</text>
</svg>
